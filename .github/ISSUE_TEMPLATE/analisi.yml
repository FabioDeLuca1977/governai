name: Suggerimento o richiesta di analisi
description: "Chiunque può proporre un problema o un'idea: dopo una revisione umana, GovernAI prepara diagnosi e tre opzioni valutate sui valori della Carta."
title: "[Suggerimento] "
labels: ["suggerimento"]
body:
  - type: markdown
    attributes:
      value: |
        Grazie per il contributo! GovernAI è un prototipo a scopo sociale e **ogni suggerimento è ben accetto**.

        **Come funziona.**
        1. Un membro del progetto legge la proposta.
        2. Se la approva, le applica l'etichetta `analisi-approvata`.
        3. Il livello AI la analizza con lo stesso metodo del programma:
           - dati ufficiali;
           - tre opzioni con costi e coperture;
           - un panel di tre valutatori indipendenti;
           - un'analisi di robustezza ai valori.
        4. Il risultato compare nella sezione "Analisi" del sito, di solito entro un giorno dall'approvazione.

        Le decisioni restano alle persone. Scrivi in modo rispettoso: i contenuti offensivi o fuori tema verranno chiusi.
  - type: textarea
    id: problema
    attributes:
      label: Problema o idea
      description: Che cosa non funziona, o che cosa proponi? Se puoi, indica dati o esempi concreti.
      placeholder: "Es. Nei piccoli comuni delle aree interne chiudono gli sportelli e i servizi di base…"
    validations:
      required: true
  - type: textarea
    id: obiettivo
    attributes:
      label: Obiettivo
      description: Che cosa vorresti ottenere, e in quanto tempo?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area principale
      options:
        - Economia, Imprese, Turismo
        - Lavoro, Welfare, Famiglia
        - Ambiente, Energia, Agricoltura
        - Infrastrutture e Territori
        - Istruzione, Ricerca, Cultura
        - Salute
        - Giustizia, Interno, Difesa
        - Esteri, Europa, Istituzioni
        - PA e Digitale
        - Più aree
        - Metodo di GovernAI (valori, dati, sito)
  - type: textarea
    id: vincoli
    attributes:
      label: Vincoli o attenzioni
      description: Che cosa va evitato, oppure chi non deve essere penalizzato? (facoltativo)
