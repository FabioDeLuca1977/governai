name: Richiesta di analisi
description: "Poni un problema: GovernAI prepara diagnosi e tre opzioni valutate sui valori della Carta, senza deficit."
title: "[Analisi] "
labels: ["analisi"]
body:
  - type: markdown
    attributes:
      value: |
        GovernAI analizzerà il problema con lo stesso metodo del programma:
        - **dati ufficiali**;
        - **tre opzioni** con costo e coperture;
        - **un panel di tre valutatori indipendenti**;
        - **un'analisi di robustezza ai valori**.

        Il risultato arriva come commento a questa richiesta, in pochi minuti. Le decisioni restano alle persone.
  - type: textarea
    id: problema
    attributes:
      label: Problema
      description: Che cosa non funziona? Se puoi, indica dati o esempi concreti.
      placeholder: "Es. Nei piccoli comuni delle aree interne chiudono gli sportelli e i servizi di base…"
    validations:
      required: true
  - type: textarea
    id: obiettivo
    attributes:
      label: Obiettivo
      description: Che cosa vorresti ottenere, e in quanto tempo?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area principale
      options:
        - Economia, Imprese, Turismo
        - Lavoro, Welfare, Famiglia
        - Ambiente, Energia, Agricoltura
        - Infrastrutture e Territori
        - Istruzione, Ricerca, Cultura
        - Salute
        - Giustizia, Interno, Difesa
        - Esteri, Europa, Istituzioni
        - PA e Digitale
        - Più aree
  - type: textarea
    id: vincoli
    attributes:
      label: Vincoli o attenzioni
      description: Che cosa va evitato, oppure chi non deve essere penalizzato? (facoltativo)
