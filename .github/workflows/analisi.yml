# Analisi su richiesta: una issue con l'etichetta "analisi" avvia GovernAI sul problema descritto.
# Solo il proprietario, i membri e i collaboratori del repository possono avviarla:
# protegge dai costi dell'API e da richieste malevole se il repository diventa pubblico.
name: Analisi su richiesta

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  issues: write

concurrency:
  group: aggiornamento
  cancel-in-progress: false

jobs:
  analizza:
    if: >-
      contains(github.event.issue.labels.*.name, 'analisi') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Dipendenze
        run: pip install -r requirements.txt

      - name: Analisi
        working-directory: sistema
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            gh issue comment ${{ github.event.issue.number }} --body "Analisi non avviata: manca il secret ANTHROPIC_API_KEY nelle impostazioni del repository."
            exit 0
          fi
          python analizza_richiesta.py --issue-evento "$GITHUB_EVENT_PATH"
          python esporta_web.py
          python ../integrita/catena.py --aggiungi analisi --nota "issue #${{ github.event.issue.number }}"

      - name: Salva l'analisi
        run: |
          git config user.name "governai-bot"
          git config user.email "governai-bot@users.noreply.github.com"
          git add -A analisi docs integrita
          git diff --cached --quiet && exit 0
          git commit -m "Analisi su richiesta: issue #${{ github.event.issue.number }}"
          git pull --rebase origin main
          git push
