# Analisi su richiesta con la chiave API (facoltativa): parte quando un membro del progetto applica
# l'etichetta "analisi-approvata" a un suggerimento. Chiunque può proporre, ma solo il proprietario,
# i membri o i collaboratori possono approvare: protegge dai costi e dalle richieste malevole.
# Senza chiave API, le richieste approvate le elabora l'attività quotidiana di Claude (sistema/istruzioni_claude.md).
name: Analisi su richiesta

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write

concurrency:
  group: aggiornamento
  cancel-in-progress: false

jobs:
  analizza:
    if: >-
      github.event.label.name == 'analisi-approvata' &&
      github.event.sender.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Dipendenze
        run: pip install -r requirements.txt

      - name: Analisi
        working-directory: sistema
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "Nessuna chiave API: la richiesta sarà elaborata dall'attività quotidiana di Claude."
            exit 0
          fi
          python analizza_richiesta.py --issue-evento "$GITHUB_EVENT_PATH"
          python esporta_web.py
          python ../integrita/catena.py --aggiungi analisi --nota "issue #${{ github.event.issue.number }}"

      - name: Salva l'analisi
        run: |
          git config user.name "governai-bot"
          git config user.email "governai-bot@users.noreply.github.com"
          git add -A analisi docs integrita
          git diff --cached --quiet && exit 0
          git commit -m "Analisi su richiesta: issue #${{ github.event.issue.number }}"
          git pull --rebase origin main
          git push
