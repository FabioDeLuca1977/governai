# Parametri del calcolatore "Chi paga quanto" (regole in vigore nel periodo d'imposta 2026)
# Ogni voce: valore, fonte (norma), link, eventuale ipotesi. Tutti i valori sono modificabili:
# calcola.py legge solo questo file, nessun numero fiscale e' scritto nel codice.
# Ultima verifica: 16/11/2026.

anno: 2026

livelli_reddito: [25000, 50000, 100000, 300000, 1000000]

irpef:
  scaglioni:
    valore:            # [limite superiore dello scaglione, aliquota]; null = senza limite
      - [28000, 0.23]
      - [50000, 0.33]
      - [null, 0.43]
    fonte: "art. 11, c. 1, TUIR (DPR 917/1986) come modificato dall'art. 1, c. 3, L. 30/12/2025 n. 199 (legge di bilancio 2026): secondo scaglione dal 35% al 33%"
    link:
      - "https://www.normattiva.it/uri-res/N2Ls?urn:nir:stato:decreto.del.presidente.della.repubblica:1986-12-22;917"
      - "https://www.normattiva.it/uri-res/N2Ls?urn:nir:stato:legge:2025-12-30;199"
      - "https://www.ecnews.it/lavoro/news-del-giorno/legge-bilancio-2026-revisione-aliquote-irpef/"
    ipotesi: >
      Per i redditi oltre 200.000 euro la L. 199/2025 riduce di 440 euro le detrazioni per oneri al 19%
      (nuovo c. 5-bis art. 16-ter TUIR). I casi del calcolatore non hanno oneri detraibili, quindi la
      riduzione non opera ("fino a concorrenza"). Parametro: sterilizzazione_oltre_200k.
  sterilizzazione_oltre_200k:
    soglia: 200000
    importo: 440
    applica_senza_oneri: false
    fonte: "art. 16-ter, c. 5-bis, TUIR introdotto dalla L. 199/2025, art. 1, c. 4"
    link: "https://fiscomania.com/irpef-aliquota-33-secondo-scaglione/"

  detrazione_lavoro_dipendente:     # art. 13, c. 1 e 1.1, TUIR (testo dal 2024, d.lgs. 216/2023 e L. 207/2024)
    fino_15000: 1955
    tra_15000_28000: {base: 1910, variabile: 1190, soglia: 28000, ampiezza: 13000}
    tra_28000_50000: {base: 1910, soglia: 50000, ampiezza: 22000}
    maggiorazione_25000_35000: 65
    fonte: "art. 13, c. 1 e c. 1.1, TUIR"
    link: "https://www.normattiva.it/uri-res/N2Ls?urn:nir:stato:decreto.del.presidente.della.repubblica:1986-12-22;917"

  ulteriore_detrazione_cuneo:       # solo reddito di lavoro dipendente (art. 49), non per gli assimilati
    da: 20000
    pieno_fino: 32000
    importo: 1000
    azzera_a: 40000
    fonte: "L. 30/12/2024 n. 207, art. 1, c. 6 (strutturale dal 2025)"
    link: "https://www.normattiva.it/uri-res/N2Ls?urn:nir:stato:legge:2024-12-30;207"
    nota: "La somma esente per redditi fino a 20.000 euro (c. 4) non riguarda i livelli del calcolatore (minimo 25.000)."

  detrazione_pensione:              # art. 13, c. 3, TUIR
    fino_8500: 1955
    tra_8500_28000: {base: 700, variabile: 1255, soglia: 28000, ampiezza: 19500}
    tra_28000_50000: {base: 700, soglia: 50000, ampiezza: 22000}
    fonte: "art. 13, c. 3, TUIR"
    link: "https://www.normattiva.it/uri-res/N2Ls?urn:nir:stato:decreto.del.presidente.della.repubblica:1986-12-22;917"

  detrazione_autonomo_impresa_minore:   # art. 13, c. 5, TUIR
    fino_5500: 1265
    tra_5500_28000: {base: 500, variabile: 765, soglia: 28000, ampiezza: 22500}
    tra_28000_55000: {base: 500, soglia: 55000, ampiezza: 27000}
    fonte: "art. 13, c. 5, TUIR (redditi di lavoro autonomo art. 53 e impresa minore art. 66)"
    link: "https://www.normattiva.it/uri-res/N2Ls?urn:nir:stato:decreto.del.presidente.della.repubblica:1986-12-22;917"
    ipotesi: "Applicata al professionista e all'impresa individuale; non applicata al socio di SNC (reddito di partecipazione, art. 5 TUIR): punto incerto, effetto massimo circa 600 euro a 25.000 e nullo da 55.000."

addizionali:
  regionale:
    valore: 0.0173
    fonte: "art. 50 d.lgs. 446/1997 (aliquota base 1,23%, maggiorabile fino a +2,1 punti); le Regioni applicano aliquote per scaglioni"
    link: "https://www.normattiva.it/uri-res/N2Ls?urn:nir:stato:decreto.legislativo:1997-12-15;446"
    ipotesi: "Aliquota unica 1,73% (valore tipico delle Regioni del Centro-Nord sui redditi medio-alti). Ipotesi semplificata, modificabile."
  comunale:
    valore: 0.008
    fonte: "art. 1 d.lgs. 360/1998 (aliquota massima 0,8%, applicata dalla maggior parte dei grandi Comuni)"
    link: "https://www.normattiva.it/uri-res/N2Ls?urn:nir:stato:decreto.legislativo:1998-09-28;360"
    ipotesi: "0,8% senza soglia di esenzione. Ipotesi, modificabile."
  nota: "Le addizionali non si applicano a forfettario (imposta sostitutiva), cedolare secca, redditi finanziari e dividendi (ritenuta a titolo d'imposta)."

