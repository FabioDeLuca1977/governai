# GovernAI - Registro degli obiettivi misurabili (agente "obiettivi", 7 novembre 2026)
# Fonte: programma/schede/*.md, sezione "Indicatori" di ciascuna delle 52 misure (un elemento per KPI).
# Basi e obiettivi sono copiati dalle schede; null = la scheda non li da' in forma numerica.
#   scheda:                 testo originale delle tre celle (base, 3 anni, 5 anni), per verifica.
#   obiettivo_relativo:     obiettivo espresso come variazione rispetto a una base (spesso ancora da rilevare).
#   obiettivi_per_variante: obiettivi che dipendono dalla variante (PIENA/ESSENZIALE/ZERO) scelta.
# serie: KPI misurato automaticamente da dati/serie/<file>.csv
#   filtro:  colonna -> valore; restituisce una sola serie temporale
#   tempo:   colonna del periodo (default "time");  colonna: colonna del valore (default "valore")
#   scala:   moltiplicatore per riportare il valore all'unita' del KPI (es. 0.001 da mln a mld)
# Le serie obi_* si rigenerano con: python -I apprendimento/aggiorna_obi.py
# Verifica del file: python -I apprendimento/verifica_obiettivi.py
# direzione: su = un aumento e' un miglioramento; giu = una diminuzione e' un miglioramento.
# valori: codici della Carta (01_carta_valori.md): RIS FID INN BEN APC BPA FUT EQU SIC CIT
