# Testo finale scritto da un agente AI il 16 novembre 2026 dopo le scelte di chi guida il progetto; non rivisto da una persona.
# Blocchi da unire a programma/quattro_domande_01_03.yaml: 01-P19 sostituisce il blocco attuale, 01-P24 e 01-P25 sono nuovi.
proposte:
  01-P19:
    perche: "Un dividendo incassato da una persona paga il 26%; incassato dalla sua società holding paga l'1,2% (Testo unico delle imposte sui redditi, articoli 87 e 89). Se la holding non distribuisce mai, alla morte del socio l'imposta rinviata può sparire. Lo stesso vale per i dividendi della propria impresa: sullo stesso utile di 1 milione lasciato fermo nella holding si paga il 28,8%, mentre il socio di una SNC paga subito il 47,3%. Nessuna fonte ufficiale dice quanto valgano questi canali."
    come: "Per le holding personali passive (controllate da non più di 5 persone o famiglie, con almeno il 60% di proventi da investimenti e oltre 2 milioni di attivo passivo) gli utili incassati dopo la legge, non distribuiti entro 12 mesi né reinvestiti entro 3 anni, pagano il 26%, come se si possedesse direttamente; i primi 100.000 euro l'anno sono esenti. In più, per ogni holding di famiglia, i dividendi della propria società operativa incassati dal 2029 e non reinvestiti in imprese, beni strumentali o piccole imprese entro 3 anni sono tassati al 26% al socio che con la famiglia controlla la holding, come se li avesse incassati; la holding versa per suo conto e si rivale su di lui, e quando gli utili sono distribuiti davvero non si paga di nuovo. Valgono anche rimborsi di capitale, vendite in famiglia e prestiti della società; i primi 100.000 euro l'anno per famiglia sono esenti e le holding estere hanno la stessa regola, con credito per le imposte estere. Restano fuori le riserve già formate, gli utili lasciati nella società operativa, i reinvestimenti e una riserva per acquisizioni e crisi. I controlli costano poco e il gettito entra nelle coperture del programma."
    cosa: "La stessa imposta sullo stesso reddito, senza penalizzare chi investe nelle imprese. Obiettivi: dati annuali pubblici su holding passive, utili trattenuti e dividendi delle società operative fermi nelle holding; utili distribuiti ai soci +20% in 3 anni e +30% in 5; prima misura ufficiale dell'aliquota effettiva dello 0,1% più ricco. Costo a regime: 0,016 mld €/anno per controlli e sistemi nella versione piena, 0,011 nella essenziale."
    chi: "Decide il Parlamento con la legge di bilancio; attuano Agenzia delle entrate e Sogei. Ne beneficiano i conti pubblici, chi oggi paga il 26% possedendo direttamente e le imprese di persone, che non vedono più premiato chi parcheggia gli utili nella holding. Pagano le famiglie che, dopo la legge, tengono fermi nella holding proventi passivi o dividendi della propria società oltre le franchigie senza reinvestirli; non paga chi ha un'impresa operativa e vi lascia gli utili, chi reinveste, chi sta sotto le soglie o il socio di minoranza che non controlla."
    oceano_blu:
      eliminare: "La possibilità di rinviare per sempre l'imposta tenendo nella holding gli utili passivi o i dividendi della propria società."
      ridurre: "La differenza di imposta tra possedere direttamente e possedere tramite holding."
      aumentare: "La certezza per chi è in buona fede, con interpello preventivo, e la parità tra holding italiane ed estere."
      creare: "Un conto di reinvestimento per i dividendi della holding: chi investe non paga, chi tiene fermo paga come se avesse incassato."
  01-P24:
    perche: "Il 10% delle famiglie ha il 60,6% della ricchezza netta, la metà più povera il 7,2% (Banca d'Italia, fine 2025). Le imposte sul patrimonio che esistono cadono soprattutto su case e risparmio diffuso; la partecipazione in una società non quotata, dove sta la ricchezza più alta, non paga nessuna imposta annua. Secondo il rapporto al G20 del 2024 le imposte personali dei miliardari valgono circa lo 0,3% del loro patrimonio. Nessuna statistica ufficiale dice quante persone hanno più di 50 milioni."
    come: "Chi ha un patrimonio netto oltre 50 milioni paga un minimo dell'1% sulla parte oltre quella soglia e del 2% oltre 1 miliardo, meno le imposte sul reddito già pagate nell'anno, in Italia e all'estero: paga solo chi oggi paga poco rispetto a quello che ha. Tutti i beni sono valutati con criteri omogenei scritti nella legge, le holding si guardano dentro, le quote d'impresa si possono pagare in 10 anni o al momento della vendita, e si scalano le imposte sul patrimonio pagate all'estero. Chi trasferisce la residenza all'estero paga sulle plusvalenze delle sue partecipazioni, con pagamento sospeso se va in un Paese europeo. Prima valutazione a fine 2028. In alternativa, la versione minima è solo un registro statistico e l'adesione allo standard G20."
    cosa: "Un minimo di imposta per chi ha patrimoni molto grandi e paga poco sul reddito. Obiettivi: statistica ufficiale dei grandi patrimoni pubblicata ogni anno; partenze dei contribuenti sotto lo 0,5% l'anno; nessun calo degli investimenti delle loro imprese. Gettito stimato con prudenza: 0,3-1,5 mld €/anno dal 2030; costo di gestione a regime: 0,02 mld €/anno."
    chi: "Decide il Parlamento con un disegno di legge collegato alla manovra; attuano l'Agenzia delle entrate, con l'unità grandi patrimoni, e Sogei; il Dipartimento delle finanze e l'Ufficio parlamentare di bilancio valutano dopo 3 anni. Pagano circa 2.100 persone con oltre 50 milioni, e solo quelle che pagano imposte sul reddito sotto l'1% del patrimonio. Ne beneficiano i conti pubblici e le imprese di persone, perché il gettito paga il 24% sugli utili che lasciano in azienda (01-P25)."
    oceano_blu:
      eliminare: "La possibilità di avere patrimoni di centinaia di milioni pagando quasi nessuna imposta personale."
      ridurre: "Lo scarto di valutazione tra beni diversi, che ha fatto cadere l'imposta tedesca nel 1995."
      aumentare: "La conoscenza dei grandi patrimoni, con una statistica ufficiale annuale."
      creare: "Un'imposta minima che si scala dalle imposte sul reddito, con exit tax per chi se ne va."
  01-P25:
    perche: "Sullo stesso utile di 1 milione lasciato in azienda per investire, una SRL paga il 27,9%, il socio di una SNC il 47,3% e una ditta individuale il 43,4%, perché le imprese di persone pagano subito l'imposta progressiva anche sugli utili che non prelevano. Così la forma giuridica la sceglie il fisco, non l'impresa. Una regola simile, l'IRI, era già legge nel 2017 ed è stata rinviata e poi abrogata con effetto retroattivo."
    come: "Ditte, SNC e SAS in contabilità ordinaria possono scegliere per cinque anni di pagare il 24% sugli utili lasciati in azienda, come una SRL, fino a 100.000 euro l'anno per socio, e l'imposta progressiva solo su quello che prelevano; i contributi restano sull'intero reddito e i forfettari restano fuori. Quando si esce dal regime, si vende o si chiude l'impresa, gli utili accumulati pagano l'imposta progressiva con un credito del 24%; prestiti e beni ai soci contano come prelievi; regole chiare per le riserve e le perdite di prima. Una clausola nello Statuto del contribuente protegge chi ha scelto il regime. Si attiva solo insieme all'imposta minima sui grandi patrimoni (01-P24), che la paga. In alternativa, la versione minima è una simulazione ufficiale e la decisione nel 2030."
    cosa: "Stessa imposta sugli utili che restano nell'impresa, qualunque sia la forma. Obiettivi: imprese di persone che reinvestono con un'aliquota non più alta delle SRL fino a 100.000 euro trattenuti per socio; patrimonio netto delle imprese di persone in crescita; meno trasformazioni in SRL per soli motivi fiscali. Costo: circa 1,26 mld nel 2029, primo anno di cassa, e 0,63 mld €/anno a regime, pagato dall'imposta minima sui grandi patrimoni (0,3-1,5 mld €/anno) e, nel caso prudente, da altre coperture indicate dalla legge."
    chi: "Decide il Parlamento con la legge di bilancio; attuano Agenzia delle entrate e Sogei, con una simulazione del Dipartimento delle finanze prima della legge. Ne beneficiano le imprese di persone in contabilità ordinaria che reinvestono, soprattutto sopra 50.000 euro di reddito. Pagano, con l'imposta minima, le persone con patrimoni oltre 50 milioni che pagano poco sul reddito; non cambia nulla per chi preleva tutto, per i forfettari e per le SRL."
    oceano_blu:
      eliminare: "Il vantaggio fiscale di chiudere la SNC e aprire una SRL solo per pagare meno sugli utili reinvestiti."
      ridurre: "La distanza di imposta tra forme d'impresa sugli utili lasciati in azienda."
      aumentare: "La patrimonializzazione delle piccole imprese di persone e la stabilità della regola, che l'IRI non ha avuto."
      creare: "Un regime al 24% con due conti di riserva e una clausola di stabilità nello Statuto del contribuente."
