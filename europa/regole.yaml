              Lettonia, Lituania, Lussemburgo, Malta, "Paesi Bassi", Polonia, Portogallo, "Repubblica ceca", Cechia, Romania,
              Slovacchia, Slovenia, Spagna, Svezia, Ungheria]

# --- Esperti (governo/esperti.yaml) ---------------------------------------------------------------------
# Gli esperti sono scelti con le loro "parole" (come fa governo/consiglio.py), più queste regole fisse per tipo di impatto.
esperti_per_impatto:
  obbligo: [giurista]
  vincolo di bilancio: [finanza_pubblica]
  opportunità: [europa_esteri]
esperto_infrazioni: [giurista, europa_esteri]
