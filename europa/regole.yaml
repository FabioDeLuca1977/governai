# Regole di pertinenza del modulo europa/ (lette da pertinenza.py).
#
# Tutte le regole sono trasparenti e deterministiche: nessun modello decide da solo a chi "tocca" un atto UE.
# Il testo su cui si cercano le parole è: titolo italiano (senza l'intestazione "Direttiva (UE) ... del Parlamento europeo
# e del Consiglio, del ...", che nominerebbe sempre le istituzioni) + descrittori EuroVoc (in italiano) + voci del
# repertorio della legislazione UE (directory code), tutto in minuscolo.
# Le parole sono RADICI: "sanit" trova sanità, sanitario, sanitaria. Si confrontano all'inizio di parola.
# Una regola può essere una espressione regolare se inizia con 're:'.

# --- Finestre ---------------------------------------------------------------------------------------
finestre:
  novita_giorni: 30          # europa/novita.md
  scadenze_futuro_mesi: 24   # europa/scadenze.csv: termini di recepimento nei prossimi N mesi
  scadenze_passato_mesi: 36  # ... e quelli già scaduti negli ultimi N mesi
  proposte_giorni: 60        # proposte legislative della Commissione

# --- Aree dei ministeri GovernAI (governo/consiglio.py -> MINISTERI) ---------------------------------
