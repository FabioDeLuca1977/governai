# --- Tipo di impatto -----------------------------------------------------------------------------------
# Ordine di valutazione: rettifica -> atto che nomina solo altri Stati -> vincolo di bilancio -> opportunità -> direttiva (obbligo)
# -> gestione corrente (informativo) -> regolamento/decisione (obbligo) -> altro (informativo).
impatto:
  vincolo_bilancio: ["disavanzo eccessivo", "disavanzi eccessivi", "spesa netta", "patto di stabilità", "sorveglianza di bilancio",
                     "governance economica", "politica di bilancio", "disavanzo pubblico", "debito pubblico", "semestre europeo",
                     "piano strutturale di bilancio", "piano nazionale strutturale", "documento programmatico di bilancio",
                     "squilibri macroeconomici", "coordinamento delle politiche economiche", "quadri di bilancio"]
  opportunita: ["finanziamento dell'ue", "finanziamento dell'unione", "contributo finanziario", "sostegno finanziario",
                "assistenza finanziaria", "fondo europeo", "fondo sociale", fesr, "fondo di coesione", "fondo di solidarietà",
                "fondo per una transizione giusta", "dispositivo per la ripresa", "ripresa e resilienza", "investeu", "orizzonte europa",
                "programma dell'ue", "programma pluriennale", sovvenzion, "mobilitazione del fondo", "strumento di flessibilità",
                "fondo europeo di adeguamento alla globalizzazione", "connecting europe", "meccanismo per collegare l'europa"]
  # Frasi che escludono l'opportunità anche se compaiono parole sui fondi (es. contributi che gli Stati devono VERSARE)
  opportunita_esclusioni: ["devono versare", "contributi da versare", "recupero degli importi", "rettifiche finanziarie"]
  # Atti di gestione corrente: autorizzazioni singole, registrazioni, elenchi, misure su singoli prodotti o persone.
  routine: ["rilascia un'autorizzazione", "rilascia un’autorizzazione", "autorizzazione dell'unione per", "autorizzazione dell’unione per",
            "denominazione di origine", "indicazione geografica", "specialità tradizionale garantita", "iscrizione di una denominazione",
            "modifica non minore", "misure restrittive", "dazio antidumping", "dazi antidumping", "dazio compensativo",
            "classificazione di talune merci", "nomenclatura combinata", "posizione da adottare a nome dell", "nomina d",
            "che nomina", "rinnovo dell'approvazione della sostanza attiva", "rinnovo dell’approvazione della sostanza attiva",
            "non rinnovo", "proroga dei periodi di approvazione", "limiti massimi di residui", "misure speciali di controllo delle malattie",
            "peste suina", "influenza aviaria", "contingente tariffario", "contingenti tariffari", "valore forfettario",
            "autorizzazione di un preparato", "additivo per mangimi", "additivi per mangimi", "nuovo alimento",
            "sospensione dell'approvazione di un'attrezzatura", "norma armonizzata", "norme armonizzate", "elenco delle persone",
            "registro dei", "immissione in commercio", "importazioni di", "originari della", "originari del", "originarie della"]

