# Commento dell'Osservatorio (vedi osservatorio/metodo.md)
id: manovra-2027-difesa-clausola-ue
titolo: "Più spesa per la difesa nel 2027 e nel 2028, pagata in deficit grazie alla clausola nazionale UE"
atto: "DDL di bilancio 2027-2029, A.C. 3174-bis, artt. 91-95 e rifinanziamenti della Sezione II (Ministero della difesa)"
tipo: legge di bilancio
data: 2026-10-30
stato: "All'esame della Camera (A.C. 3174-bis); approvazione entro il 31 dicembre 2026. L'attivazione della clausola da parte del Consiglio UE era attesa all'ECOFIN di novembre"
fonte: "https://www.camera.it/leg19/126?tab=&leg=19&idDocumento=3174"
tema: "07"
in_breve: "La manovra aumenta la spesa per la difesa di circa 5,3 mld nel 2027 e 5,8 mld nel 2028, in gran parte in deficit. Lo consente la clausola nazionale delle regole UE. Una parte della spesa però resta per sempre, anche quando la clausola finisce."
cosa_fa:
  - "Art. 91: autorizza gli interventi degli artt. 92-95 «tenuto conto» della richiesta di attivare la clausola nazionale (art. 26 del Reg. UE 2024/1263) e della raccomandazione della Commissione dell'8/10/2026."
  - "Art. 92: crea un fondo per le Forze di riserva della difesa e per nuove capacità: 26 mln nel 2027, 423 mln nel 2028, 435 mln nel 2029, poi 218 mln l'anno per sempre dal 2032. In più 206 mln l'anno nel 2027-2028 e 171 mln l'anno dal 2029 per i servizi operativi."
  - "Art. 93: crea il carabiniere ausiliario della riserva volontaria: giovani fino a 26 anni, ferma di un anno, paga al 65%; 600 posti nel 2027 e 1.000 l'anno dal 2028; riserva fino al 30% dei posti nei concorsi dell'Arma."
  - "Art. 94: fondo per nuove caserme e ristrutturazioni (17 mln nel 2027, 87 mln nel 2028), con procedure accelerate e deroghe urbanistiche delle opere per la difesa nazionale."
  - "Art. 95: +520 mln nel 2027 e +804 mln nel 2028 per le missioni internazionali; +32 mln e +16 mln per il programma dell'aereo da combattimento GCAP."
  - "Sezione II: +2,63 mld nel 2027 e +2,62 mld nel 2028 per i programmi di investimento della difesa; +1,0 mld nel 2027, 0,84 mld nel 2028 e 69 mln l'anno dal 2029 per il funzionamento; 267 mln l'anno per la forza di reazione rapida; 135 e 197 mln per le infrastrutture NATO."
numeri:
  - voce: "Risorse per la difesa nella manovra"
    valore: "Personale, funzionamento e missioni: circa 2,3 mld nel 2027, 2,8 mld nel 2028, 1,1 mld nel 2029. Investimenti: circa 3 mld l'anno nel 2027 e nel 2028"
    fonte: "Relazione illustrativa A.C. 3174, quadro generale (Difesa)"
  - voce: "Effetto della difesa sul deficit"
    valore: "-0,19% del PIL nel 2027, -0,20% nel 2028, -0,03% nel 2029"
    fonte: "MEF, Documento programmatico di bilancio 2027, Tabella I.6-1"
  - voce: "Uso massimo della clausola nazionale per la difesa"
    valore: "0,3 punti di PIL l'anno nel 2027 e nel 2028 (altri 0,3 per l'energia)"
    fonte: "MEF, DPB 2027, par. I.5"
  - voce: "Deficit con la manovra"
    valore: "3,4% del PIL nel 2027, 3,2% nel 2028, 2,3% nel 2029; +0,5 punti rispetto alla legislazione vigente nel 2027 e 2028 (difesa ed energia insieme)"
    fonte: "MEF, DPB 2027, par. I.5"
  - voce: "Costi che restano dopo la clausola"
    valore: "Circa 0,6 mld l'anno a regime: fondo art. 92 (218 mln dal 2032 più 171 mln dal 2029), carabinieri ausiliari (141 mln lordi dal 2031), funzionamento (69 mln dal 2029)"
    fonte: "Testo artt. 92-93 A.C. 3174; elenco dei rifinanziamenti della Sezione II nella relazione tecnica; somma dell'Osservatorio"
  - voce: "Spesa per la difesa oggi"
    valore: "2,10% del PIL nel 2026 (48,3 mld), contro l'impegno NATO del 3,5% entro il 2035"
    fonte: "NATO, Defence Investment of NATO Countries 2014-2026; programma/schede/07_giustizia.md"
chi_guadagna:
  - "Industria della difesa e aerospaziale, nazionale ed europea: circa 2,6 mld l'anno di programmi di investimento nel 2027-2028, il programma GCAP e le infrastrutture NATO."
  - "Personale militare e dei Carabinieri: più fondi per i servizi operativi (206 mln l'anno), più missioni pagate."
  - "Giovani fino a 26 anni: fino a 1.000 posti l'anno da carabiniere ausiliario e una corsia di accesso ai concorsi dell'Arma."
  - "Alleati NATO e UE: l'Italia si avvicina agli impegni presi, e la sicurezza comune ne beneficia."
chi_paga:
  - "Chi paga le tasse in futuro, soprattutto giovani e chi deve ancora nascere: la spesa del 2027-2028 è in gran parte debito, con i suoi interessi."
  - "Le altre politiche pubbliche: dal 2029 circa 0,6 mld l'anno di costi fissi restano senza la clausola e andranno trovati in altri capitoli, senza dire quali; nello stesso disegno di legge il fondo sanitario in rapporto al PIL scende."
  - "Chi partecipa ai concorsi dell'Arma senza essere stato ausiliario: fino al 30% dei posti è riservato."
  - "Comunità locali e Comuni dove sorgono le nuove caserme: le opere seguono le deroghe urbanistiche e la dichiarazione di urgenza, con meno voce per il territorio."
rischi_giuridici: "Dubbio da chiudere sul deficit, dubbio serio sugli oneri permanenti (costituzione/esami/AC3174_manovra_2027.md, punto 2). Le regole UE non bastano: per spendere in deficit serve l'autorizzazione delle Camere a maggioranza assoluta (art. 81 Cost.; L. 243/2012, art. 6). Le risoluzioni sulla Relazione sono state approvate il 13/10/2026 (DPB 2027, nota 20), ma l'art. 91 non le richiama: va verificato che gli importi per anno rientrino in quelli autorizzati e vanno richiamati nella norma. Gli oneri dal 2029 in poi non possono stare in uno scostamento temporaneo: serve copertura ordinaria (art. 81, terzo comma). La figura del carabiniere ausiliario è una norma di ordinamento dentro la legge di bilancio."
valori:
  - valore: SIC
    segno: "+"
    perche: "Rafforza difesa aerea, prontezza e riserve in un contesto internazionale più rischioso; le misure non toccano le libertà personali."
  - valore: FUT
    segno: "-"
    perche: "Circa 11 mld in due anni sono in gran parte debito, e lasciano costi fissi dopo il 2028 senza dire chi li pagherà."
  - valore: FID
    segno: "-"
    perche: "Il testo non richiama la deliberazione delle Camere del 13/10/2026 né gli importi autorizzati, e l'attivazione della clausola da parte del Consiglio UE era ancora attesa; manca un piano pubblico su costi e capacità."
  - valore: FID
    segno: "+"
    perche: "Le caserme hanno un codice di progetto e il monitoraggio delle opere pubbliche; l'elenco degli interventi va alle Commissioni."
  - valore: CIT
    segno: "="
    perche: "La riserva volontaria offre un impegno civico ai giovani, ma la paga ridotta e la corsia nei concorsi la rendono soprattutto una via d'ingresso al lavoro."
  - valore: EQU
    segno: "-"
    perche: "Il costo futuro ricade su tutti; il beneficio di sicurezza è di tutti, quello economico immediato è concentrato su alcune imprese e territori."
bilancio: "Va bene rafforzare la sicurezza con il monitoraggio delle nuove caserme e l'attenzione agli impegni europei e NATO. Non va bene che sia pagata quasi tutta in deficit, senza richiamo esplicito al voto delle Camere, senza dire quali programmi finanzia il fondo da 2,6 mld e che lasci costi permanenti dopo il 2028 senza copertura."
governai:
  proposte: [07-C5]
  confronto: "GovernAI vuole una legge decennale sulla difesa, ogni aumento coperto da tagli o entrate, nessun deficit e nessun uso della clausola nazionale, e una relazione annuale verificata dalla Corte dei conti. Su questi punti è più rigoroso della manovra. Ma ha un difetto serio, che va detto: il programma intermedio non sceglie nessuna delle tre varianti di 07-C5, quindi non finanzia alcun aumento. La difesa resta circa al 2,1% del PIL, lontano dal 3,5% promesso alla NATO. Anche la variante piena non sarebbe finanziabile: costerebbe 32 mld l'anno nel 2035, più di tutte le coperture del programma. GovernAI evita il debito ma lascia aperto il costo di credibilità verso gli alleati e il rischio per la sicurezza. La manovra almeno fa una scelta; GovernAI la rinvia al Parlamento."
cosa_cambieremmo:
  - "Riscrivere l'art. 91 citando la deliberazione delle Camere a maggioranza assoluta (data e importi per anno), come proposto nell'esame di costituzionalità."
  - "Coprire con risparmi o entrate certe gli oneri che restano dal 2029 (circa 0,6 mld l'anno), oppure farli finire con la clausola."
  - "Ridurre in automatico gli stanziamenti 2027-2028 se il Consiglio UE non attiva la clausola o la attiva per importi minori."
  - "Vincolare una quota crescente degli investimenti ad acquisti comuni europei (per esempio il 25% nel 2028) e pubblicare ogni anno costi, ritardi e capacità ottenute, con verifica della Corte dei conti."
  - "Sentire i Comuni interessati sull'elenco delle caserme prima del decreto, e limitare le deroghe urbanistiche alle sole opere davvero operative."
  - "Accompagnare la riserva volontaria con una valutazione a tre anni: quanti restano, quanti entrano nell'Arma, a che costo per posto."
domande_aperte:
  - "Quali importi per anno hanno autorizzato le Camere il 13/10/2026, e coprono tutte le spese degli artt. 92-95 e della Sezione II?"
  - "Il Consiglio UE ha attivato la clausola, e per quale importo?"
  - "Quali programmi di armamento finanzia il fondo di investimento (2,6 mld l'anno), e quanti sono comuni con altri Paesi UE?"
  - "Come si pagherà la difesa dopo il 2028? Lo ha chiesto anche l'Ufficio parlamentare di bilancio sul DPFP (stima riportata dalla stampa, da verificare sul testo dell'audizione)."
