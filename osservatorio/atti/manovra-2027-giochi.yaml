# Commento dell'Osservatorio (vedi osservatorio/metodo.md)
id: manovra-2027-giochi
titolo: "Giochi: puntate doppie sulle slot, concessioni prorogate al 2029 senza gara, più Lotto, sconto ai concessionari"
atto: "DDL di bilancio 2027-2029, A.C. 3174-bis, artt. 23, 25, 26, 27, 28, 29 e 32 (Titolo II, Capo IV)"
tipo: legge di bilancio
data: 2026-10-30
stato: "All'esame della Camera (A.C. 3174-bis); approvazione entro il 31 dicembre 2026"
fonte: "https://documenti.camera.it/apps/commonServices/getDocumento.ashx?sezione=lavori&tipoDoc=testo_pdl&idlegislatura=19&codice=leg.19.pdl.camera.3174.19PDL0221150"
tema: "01"
in_breve: "Lo Stato ricava circa 0,75 miliardi nel 2027 dai giochi: prorogando fino al 2029 le concessioni senza gara, raddoppiando la puntata massima delle slot e aggiungendo un'estrazione del Lotto. Chiude anche con uno sconto e senza interessi un vecchio debito dei concessionari."
cifre_chiave:
  - numero: "0,75"
    unita: "mld"
    etichetta: "circa, incassati dai giochi nel 2027 (somma nostra)"
    fonte: "Elaborazione dell'Osservatorio; MEF, DPB 2027, tabella I.6-1"
  - numero: "281"
    unita: "mln l'anno"
    etichetta: "da proroghe senza gara di scommesse e apparecchi, 2027-29"
    fonte: "Relazione tecnica A.C. 3174, art. 26"
  - numero: "2"
    unita: "euro"
    etichetta: "nuova puntata massima delle slot (prima 1 euro)"
    fonte: "Relazione tecnica A.C. 3174, art. 23"
cosa_fa:
  - "Art. 23: sulle slot dei bar e delle sale (AWP) la puntata massima passa da 1 a 2 euro e la vincita massima da 100 a 200 euro. Il prelievo sale al 25% sulle AWP e al 9,6% sulle videolotterie (VLT); scende al 20% per le AWP che restituiscono in vincite almeno il 70%, in attesa del passaggio al gioco da remoto."
  - "Art. 26: proroga al 31/12/2029 le concessioni delle scommesse su rete fisica e delle reti degli apparecchi, che scadono a fine 2026, a fronte di un pagamento per ogni diritto o apparecchio."
  - "Art. 27: proroga al 2029 le concessioni del bingo, con un'indennità mensile legata al fatturato, e dimezza da 30 a 15 km la distanza minima tra due sale. Il comma 2 elenca sei proroghe precedenti, dal 2017 al 2024."
  - "Art. 28: proroga la concessione delle lotterie istantanee (gratta e vinci) fino al 31/12/2029, per 188 mln."
  - "Art. 29: istituisce un'estrazione in più a settimana del Lotto e del SuperEnalotto, il mercoledì."
  - "Art. 32: chiude con uno sconto fino al 20% e con la rinuncia dello Stato agli interessi maturati il debito residuo dei concessionari per il prelievo del 2015 (89,47 mln non versati), se rinunciano alle cause."
  - "Art. 25: regola le sale di videogiochi in rete senza vincita in denaro, con autorizzazioni a pagamento e accesso ai minori secondo la classificazione per età."
numeri:
  - voce: "Slot: puntata a 2 euro e nuovi prelievi (art. 23)"
    valore: "+160 mln nel 2027 (con il 10% delle AWP adeguate), circa +0,18 mld nel 2028; raccolta AWP attesa da 14,6 a 15,0 mld nel 2027; prelievo complessivo sugli apparecchi circa 5 mld l'anno"
    fonte: "Relazione tecnica A.C. 3174, art. 23"
  - voce: "Proroga scommesse e reti degli apparecchi (art. 26)"
    valore: "+281 mln l'anno nel 2027-2029 (scommesse 114,5; apparecchi 166,5, di cui VLT 154,35)"
    fonte: "Relazione tecnica A.C. 3174, art. 26"
  - voce: "Proroga bingo (art. 27)"
    valore: "+26,1 mln nel 2027, +21,5 mln nel 2028 e nel 2029"
    fonte: "Relazione tecnica A.C. 3174, art. 27"
  - voce: "Proroga lotterie istantanee (art. 28)"
    valore: "+188 mln nel 2027"
    fonte: "A.C. 3174, art. 28; relazione tecnica"
  - voce: "Estrazione in più di Lotto e SuperEnalotto (art. 29)"
    valore: "+30,5 mln nel 2027, +43,1 mln l'anno dal 2028; raccolta in più circa 155 mln l'anno"
    fonte: "Relazione tecnica A.C. 3174, art. 29"
  - voce: "Sconto sui debiti dei concessionari (art. 32)"
    valore: "Sconto massimo 17,85 mln (20% di 89,47 mln), più gli interessi maturati, a cui lo Stato rinuncia (importo non indicato); incasso stimato 71,6 mln nel 2027"
    fonte: "Relazione tecnica A.C. 3174, art. 32"
  - voce: "Totale di questa scheda"
    valore: "circa +0,75 mld nel 2027 (somma nostra); il DPB indica per i giochi lo 0,03% del PIL nel 2027 e nel 2028 e lo 0,02% nel 2029"
    fonte: "Elaborazione dell'Osservatorio; MEF, DPB 2027, tabella I.6-1"
chi_guadagna:
  - "I concessionari delle scommesse, degli apparecchi, del bingo e delle lotterie istantanee: tengono le concessioni fino al 2029 senza gara, pagando un corrispettivo; per il bingo è la settima proroga dal 2017 (art. 27, c. 2)."
  - "I concessionari in causa con lo Stato per il prelievo del 2015: pagano fino al 20% in meno e nessun interesse."
  - "Bar, tabaccherie e sale che ospitano le slot, e chi apre nuove sale bingo grazie alla distanza dimezzata."
  - "Il bilancio pubblico: circa 0,75 mld nel 2027."
  - "Le sale di videogiochi in rete: ottengono regole chiare e la possibilità di operare in modo regolare."
  - "Chi gioca nel circuito legale: la continuità delle concessioni, secondo la finalità dichiarata dalla norma, evita un vuoto che favorirebbe il gioco illegale in attesa delle gare."
chi_paga:
  - "Chi gioca alle slot: con puntate doppie si può perdere di più in meno tempo; il maggior gettito viene da una raccolta più alta, cioè da perdite più alte di chi gioca."
  - "Le persone con un problema di gioco e le loro famiglie, che sono una quota rilevante di chi gioca alle slot; i costi sociali e sanitari ricadono anche sul Servizio sanitario e sui Comuni."
  - "Le imprese che vorrebbero entrare nel mercato con una gara: la concorrenza viene rinviata ancora."
  - "Chi ha pagato per intero: lo sconto e la rinuncia agli interessi vanno a chi non ha versato il prelievo del 2015."
rischi_giuridici: "Rischio basso per la Costituzione; profilo UE da verificare. Le proroghe tecniche in attesa di gara sono ammesse se brevi e motivate; ripetute, possono violare la libertà di stabilimento e di servizi (artt. 49 e 56 TFUE). Per il bingo, la Corte di giustizia UE (20 marzo 2025, cause riunite C-728/22, C-729/22 e C-730/22, richiamata nella relazione tecnica) ha giudicato contraria alla direttiva 2014/23/UE una proroga unilaterale con canone fisso uguale per tutti e altre condizioni non conformi all'art. 43; l'indennità legata al fatturato risponde a quel punto, ma la ripetizione delle proroghe resta un rischio. La definizione agevolata dell'art. 32 è volontaria e non tocca in modo autoritativo i giudizi in corso. Fonte: costituzione/esami/AC3174_manovra_2027.md, punto 7."
valori:
  - valore: BEN
    segno: "-"
    perche: "Puntate e vincite raddoppiate sulle slot aumentano il rischio di perdite e di dipendenza, con un danno per la salute di chi gioca."
  - valore: EQU
    segno: "-"
    perche: "Il gioco pesa di più, in proporzione, su chi ha redditi bassi: è un prelievo regressivo."
  - valore: FID
    segno: "-"
    perche: "Un'altra proroga senza gara (la settima per il bingo) e sconto senza interessi a chi non ha pagato: regole che premiano chi aspetta e indeboliscono la parità tra operatori."
  - valore: SIC
    segno: "+"
    perche: "Le sale di videogiochi in rete vengono regolate, con controlli antimafia, conservazione dei dati e tutela dei minori."
  - valore: FUT
    segno: "="
    perche: "Entrate per circa 0,75 mld nel 2027 che coprono spese della manovra, ma in buona parte legate a proroghe e quindi temporanee."
  - valore: CIT
    segno: "-"
    perche: "Lo Stato aumenta l'offerta di gioco che deve regolare, con un'estrazione in più e puntate più alte."
bilancio: "Regolare le sale di videogiochi e incassare dai concessionari per l'uso delle concessioni va bene; ma raddoppiare le puntate delle slot e aggiungere estrazioni fa pagare le entrate soprattutto a chi gioca ed è più fragile, e un'altra proroga senza gara con lo sconto senza interessi sui debiti premia i concessionari a scapito della concorrenza e della parità di trattamento con chi ha pagato."
governai:
  proposte: [01-P12, 01-P2]
  confronto: "Il programma GovernAI non ha una proposta sul gioco pubblico: è un vuoto, perché è un settore che vale miliardi di prelievo e ha costi sociali rilevanti. GovernAI esclude i condoni (01-P12, nucleo robusto): lo sconto dell'art. 32 è una forma ridotta di condono e non passerebbe questa regola. GovernAI usa invece accise su tabacco, alcol e bevande zuccherate motivate dalla salute; un ragionamento simile sul gioco non c'è ancora."
cosa_cambieremmo:
  - "Togliere il raddoppio della puntata massima delle slot; se si vuole più gettito, alzare il prelievo senza cambiare puntate e vincite."
  - "Limitare la proroga a 12-18 mesi e fissare per legge la data della gara, con penale se slitta."
  - "Sopprimere lo sconto dell'art. 32: chi ha perso in giudizio paga tutto, eventualmente a rate."
  - "Vincolare una quota del maggiore prelievo (per esempio 5%) alla prevenzione e cura del gioco problematico nei servizi per le dipendenze."
  - "Lasciare a 30 km la distanza tra sale bingo e dare ai Comuni regole uniformi su orari e distanze dai luoghi sensibili."
domande_aperte:
  - "Quanto aumenteranno le perdite di chi gioca con le puntate a 2 euro? La relazione tecnica stima solo il gettito."
  - "Quando si faranno le gare? La riforma del gioco su rete fisica non ha ancora una data."
  - "Quante AWP passeranno al prelievo ridotto del 20% e con quale effetto?"
