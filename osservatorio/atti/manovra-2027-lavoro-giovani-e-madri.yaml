id: manovra-2027-lavoro-giovani-e-madri
titolo: "Famiglie e lavoro: bonus stabile per le madri, un mese in più di congedo all'80%, sconti di un anno ai giovani"
atto: "DDL di bilancio 2027-2029, A.C. 3174-bis, artt. 42, 43, 44, 45, 57, 58, 59, 60 e 65"
tipo: legge di bilancio
data: 2026-10-30
stato: "All'esame della Camera (A.C. 3174-bis); approvazione entro il 31 dicembre 2026"
fonte: "https://www.camera.it/leg19/126?leg=19&idDocumento=3174"
tema: "02"
in_breve: "Le misure per le famiglie diventano stabili: 100 euro al mese a circa un milione di madri lavoratrici con almeno due figli e un mese in più di congedo parentale pagato all'80%. Le misure per il lavoro restano invece di un solo anno: sgravi per chi assume, un'imposta ridotta all'1%, al posto dell'IRPEF, sugli aumenti di stipendio dei giovani, un'aliquota del 15% sul salario accessorio pubblico."
cifre_chiave:
  - numero: "1.070"
    unita: "mln l'anno"
    etichetta: "per il bonus alle madri lavoratrici, senza scadenza"
    fonte: "Relazione tecnica A.C. 3174, art. 57"
  - numero: "993.000"
    unita: "donne"
    etichetta: "circa, ricevono il bonus da 100 euro al mese"
    fonte: "Relazione tecnica A.C. 3174, art. 57"
  - numero: "216"
    unita: "mln"
    etichetta: "nel 2027 per gli sgravi a chi assume, prorogati di un anno"
    fonte: "Relazione tecnica A.C. 3174, art. 42"
cosa_fa:
  - "Bonus di 100 euro al mese, esente da tasse e contributi, alle madri lavoratrici dipendenti e autonome con due o più figli e reddito di lavoro fino a 40.000 euro, dal 2027 senza scadenza; esclude il lavoro domestico. Con due figli il bonus si ferma quando il secondo compie 10 anni; con tre o più, ai 18 anni del più piccolo (art. 57)."
  - "Congedo parentale all'80% dello stipendio: da tre a quattro mesi, cinque per il secondo figlio e sei dal terzo, per chi finisce il congedo di maternità o paternità dopo il 2026 (art. 59)."
  - "Conto di risparmio per ogni nato dal 2027, con 100 euro l'anno dallo Stato fino a 18 anni, gestito dall'INPS e investito da Cassa depositi e prestiti; i versamenti dei familiari si detraggono al 19% fino a 1.000 euro (art. 58)."
  - "Fino a 500 euro al mese per tre mesi per baby-sitter o nido ai genitori lavoratori autonomi, al posto del congedo, nel limite di 15 milioni l'anno (art. 60)."
  - "Proroga al 2027 gli sgravi contributivi per chi assume a tempo indeterminato donne, giovani e lavoratrici e lavoratori nella ZES del Mezzogiorno, e per chi stabilizza contratti a termine (art. 42)."
  - "Per il 2027 le imprese deducono l'80% in più del costo delle madri neoassunte e il 40% in più per i giovani sotto i 36 anni (art. 43)."
  - "Per il 2027 i dipendenti privati nati dopo il 1997 con reddito fino a 28.000 euro pagano l'1% invece dell'IRPEF sull'aumento di stipendio rispetto all'anno prima, fino a 2.500 euro (art. 44)."
  - "Per il 2027 i beni e servizi dati dal datore di lavoro sono esenti fino a 2.000 euro anche per chi ha meno di 31 anni (art. 45)."
  - "Per il 2027 il salario accessorio dei dipendenti pubblici non dirigenti con reddito fino a 50.000 euro è tassato al 15% fino a 800 euro (art. 65)."
numeri:
  - voce: "Bonus madri lavoratrici"
    valore: "1.070 mln l'anno dal 2027 per circa 993.000 donne; si abroga un esonero da 300 mln già previsto"
