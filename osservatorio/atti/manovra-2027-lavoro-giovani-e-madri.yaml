  - voce: "Conto «Valore nuovi nati»"
    valore: "36 mln nel 2027, poi cresce fino a 642 mln l'anno nel 2044"
    fonte: "Relazione tecnica A.C. 3174, art. 58"
  - voce: "Proroga degli sgravi per le assunzioni"
    valore: "216 mln nel 2027, 426 nel 2028, 225 nel 2029; circa 32.100 donne assunte stimate"
    fonte: "Relazione tecnica A.C. 3174, art. 42"
  - voce: "Deduzione maggiorata per madri e giovani assunti"
    valore: "410 mln, tutti nel 2028; nel 2024 la misura precedente è stata usata solo per il 14% delle nuove assunzioni stabili"
    fonte: "Relazione tecnica A.C. 3174, art. 43"
  - voce: "Imposta ridotta all'1% sugli aumenti dei giovani"
    valore: "378 mln nel 2027 e 74 mln nel 2028"
    fonte: "Relazione tecnica A.C. 3174, art. 44"
  - voce: "Salario accessorio pubblico al 15%"
    valore: "359 mln nel 2027 e 60 mln nel 2028, per circa 3 milioni di dipendenti"
    fonte: "Relazione tecnica A.C. 3174, art. 65"
chi_guadagna:
  - "Madri lavoratrici con due o più figli e reddito fino a 40.000 euro: 1.200 euro l'anno, in modo stabile."
  - "Genitori dipendenti: un mese in più di congedo pagato bene, di più per il secondo e il terzo figlio."
  - "Imprese che assumono a tempo indeterminato donne, giovani o nel Mezzogiorno: meno contributi e meno tasse per un anno."
  - "Giovani dipendenti privati con stipendio basso che ricevono un aumento: pagano quasi zero tasse su quella parte nel 2027."
  - "Dipendenti pubblici non dirigenti: meno tasse sul salario accessorio."
  - "Famiglie con nuovi nati, in particolare quelle che possono versare sul conto e detrarre."
chi_paga:
  - "La fiscalità generale: circa 2,2 miliardi nel 2027 tra tutte le misure, 1,9 al netto dell'esonero da 300 milioni abrogato (somma dell'Osservatorio sulle relazioni tecniche)."
  - "Le madri con un solo figlio, quelle disoccupate o con lavoro domestico: non ricevono il bonus; con due figli il bonus finisce ai 10 anni del secondo."
  - "Chi lavora ed è nato prima del 1998, con lo stesso stipendio basso: per lo stesso aumento pagano l'IRPEF piena."
  - "Il bilancio futuro: il bonus madri e il conto per i nuovi nati sono spese permanenti e crescenti, senza una copertura dedicata; il conto è però un risparmio a favore di chi nasce."
rischi_giuridici: "Rischio basso secondo l'esame di GovernAI (costituzione/esami/AC3174_manovra_2027.md, par. 7): le decorrenze dell'art. 42 favoriscono chi lavora. Da motivare, sul piano dell'uguaglianza tributaria (artt. 3 e 53 Cost.), le aliquote diverse a parità di reddito in base all'anno di nascita (art. 44) o al datore pubblico (art. 65). Gli sgravi territoriali vanno inquadrati nelle regole UE sugli aiuti di Stato."
