bilancio: "Bene rendere stabili il bonus per le madri e il congedo all'80%: danno certezza alle famiglie. Non bene la serie di sconti fiscali di un solo anno su giovani, assunzioni e dipendenti pubblici, che costano molto, si sovrappongono e non hanno una valutazione dei risultati; i servizi per l'infanzia restano fuori."
governai:
  proposte: ["02-C2", "02-C1", "01-P2", "01-P9", "02-C6"]
  confronto: "GovernAI punta sui servizi più che sui bonus: nido garantito negli ambiti sotto il 33% di posti e congedo di paternità vero, di un mese dal 2028 e due dal 2030 (02-C2, 2 mld a regime). Sul bonus madri GovernAI è d'accordo nel tenerlo, ma propone di abbassare la soglia da 40.000 a 32.000 euro con un'uscita graduale (RB03) e usa il risparmio come copertura. Chiede che ogni agevolazione fiscale abbia una scadenza e una valutazione (01-P2) e una sola detrazione per il lavoro (01-P9): due regole che le misure di un anno del disegno di legge non rispettano. Limiti di GovernAI: il congedo di paternità parte solo nel 2028 e la sua stima di costo, 1,2 mld, è incerta; il nido richiede anni di assunzioni; il taglio della soglia del bonus toglie qualcosa a madri con redditi medi."
cosa_cambieremmo:
  - "Far uscire il bonus madri in modo graduale tra 32.000 e 40.000 euro, invece di un taglio netto a 40.000 euro, ed estenderlo alle lavoratrici domestiche."
  - "Riservare almeno un mese del congedo all'80% al padre, non trasferibile."
  - "Sostituire gli sconti di un anno sulle assunzioni con uno sgravio stabile e più piccolo, valutato dopo tre anni con dati INPS pubblici."
  - "Non introdurre l'imposta ridotta all'1% per età: usare le stesse risorse per alzare la detrazione per il lavoro dei redditi bassi, per tutti."
  - "Usare parte delle risorse per posti nido nei territori sotto soglia, dove le madri lavorano di meno."
domande_aperte:
  - "Il bonus da 100 euro aumenta davvero l'occupazione delle madri, o premia chi lavora già?"
  - "Quante imprese useranno la deduzione maggiorata, visto che nel 2024 l'ha usata solo il 14% delle assunzioni?"
  - "Come sarà investito il conto per i nuovi nati e con quali costi di gestione?"
  - "Come si distribuiscono per territorio il bonus madri e gli sgravi per le assunzioni? (dati INPS, da verificare)"
