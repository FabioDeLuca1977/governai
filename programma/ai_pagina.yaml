# Pagina "AI e Stato" (21/11/2026): perché l'intelligenza artificiale è una chiave per l'Italia
# e come il programma la usa nella pubblica amministrazione. Dati Eurostat consultati il 21/11/2026
# (dataset indicati in ogni riga) e serie di storia/serie/ (AMECO). Scelta politica di chi guida il progetto:
# trasformazione digitale della PA con meno posti nelle attività ripetitive e meno tasse (09-C11).
titolo: "L'AI come chiave per l'Italia"
in_breve: "L'Italia cresce poco perché produce poco per ora lavorata, e i salari reali sono fermi da trent'anni. L'intelligenza artificiale è la prima tecnologia che rende accessibili a tutti, anche a un piccolo Comune o a un artigiano, competenze che prima avevano solo i grandi. GovernAI lavora su due fronti. Nello Stato le macchine fanno il lavoro ripetitivo, le persone il giudizio e la relazione, i posti che non servono più non si rimpiazzano quando qualcuno va in pensione e il risparmio, certificato, torna a chi paga le tasse (09-C11). Nelle piccole imprese un check-up gratuito e soluzioni per settore, pagate a risultato, portano l'AI dove oggi manca (01-P26)."
tesi: "Le macchine fanno meglio ciò che è ripetitivo, ad alto volume e basato su regole: ricopiare dati, controllare documenti standard, rispondere alle domande frequenti, fare i conti. Le persone fanno meglio ciò che chiede giudizio, relazione e responsabilità: decidere un caso difficile, ascoltare chi è in difficoltà, rispondere di una scelta. Il guadagno più grande viene dal lavoro fatto insieme (Daugherty e Wilson, Human + Machine, 2018). Per questo la regola è doppia: più macchine dove sono migliori, e decide sempre una persona."
dati:
  - numero: "16,4%"
    testo: "delle imprese italiane con almeno 10 addetti usa l'AI, contro il 20,0% nella UE e il 26,0% in Germania (2025). Era l'8,2% nel 2024."
    fonte: "Eurostat, isoc_eb_ai"
  - numero: "14,2%"
    testo: "nelle piccole imprese da 10 a 49 addetti (UE 17,0%, Germania 23,1%). Le grandi sono quasi alla pari: 53,1% contro 55,0%. Il ritardo è nei piccoli."
    fonte: "Eurostat, isoc_eb_ai, 2025"
  - numero: "54%"
    testo: "delle persone tra 16 e 74 anni ha competenze digitali almeno di base, contro il 60% nella UE e il 66-67% in Francia e Spagna (2025)."
    fonte: "Eurostat, isoc_sk_dskl_i21"
  - numero: "21 ogni 1.000"
    testo: "abitanti lavorano nell'amministrazione pubblica in senso stretto, contro 35 in Germania e Spagna e 37 in Francia (2024). Il problema non è il numero, è quanto lavoro ripetitivo fanno."
    fonte: "Eurostat, nama_10_a64_e e demo_pjan"
  - numero: "31,7%"
    testo: "di chi lavora nell'amministrazione pubblica ha tra 55 e 64 anni, contro il 23,5% nella UE (2024). Nei prossimi dieci anni andrà in pensione fino a un terzo del personale pubblico."
    fonte: "Eurostat, lfsa_egan2; INPS 2025"
  - numero: "-8,4%"
    testo: "il salario reale per dipendente tra il 1991 e il 2025, mentre in Francia è salito del 30% e in Germania del 26%. Senza produttività i salari non crescono."
    fonte: "AMECO (Commissione europea), storia/serie/salario_reale_crescita.csv"
perche: "Dal 2001 la produttività oraria italiana cresce meno di quella dei vicini, e con lei i salari. Nello stesso tempo una persona su tre nella pubblica amministrazione è vicina alla pensione: è l'occasione per ripensare il lavoro invece di rimpiazzare ogni uscita con lo stesso profilo. L'AI costa poco e si può usare ovunque: se lo Stato la adotta bene, ne beneficiano cittadini, imprese e contribuenti; se la adotta male, aggiunge solo un altro sistema al vecchio."
come: "Prima si mappano e si automatizzano i processi ripetitivi (09-C7), con una squadra che entra negli uffici (09-C9) e strumenti pubblici e aperti (09-C5, 09-C10). Poi, per ogni pensionamento in un'attività automatizzata e certificata, il posto non si rimpiazza (09-C8, 09-C11). Il risparmio si misura su tutta la spesa dell'ente, partecipate e appalti compresi, lo certifica un ente terzo, e va per l'80% a ridurre le tasse sul lavoro e per il 20% a chi resta. Nessun licenziamento per chi resta, e decide sempre una persona. Con il riesame delle funzioni (09-C12), in tre anni si chiudono le funzioni che una macchina fa in gran parte e le persone si spostano, riqualificate, nei posti vuoti vicini a casa; chi rifiuta due offerte adeguate senza motivo va in disponibilità come prevede la legge; il risparmio va per metà alle tasse, per un quarto ai servizi che mancano e per un quarto al debito. Per le imprese: una sola porta nella Camera di commercio, un check-up gratuito fatto da chi non vende, il 50% del costo di una soluzione di settore con affiancamento e formazione, il fornitore pagato per l'ultimo 30% solo se dopo sei mesi la soluzione è in uso, il 40% delle risorse al Mezzogiorno e alle aree interne (01-P26)."
cosa: "Si misurano ogni anno: il risparmio netto certificato destinato alle tasse; la spesa per funzione e il costo per servizio; i tempi delle pratiche e il tempo chiesto al cittadino, che non devono peggiorare; la quota di imprese e di persone che usano l'AI; la produttività oraria e il salario reale. Tutto pubblico, ente per ente."
chi: "Ne beneficiano chi paga le tasse sul lavoro, soprattutto con redditi medi e bassi; chi usa i servizi pubblici, con pratiche più rapide; chi lavora nella pubblica amministrazione, che lascia i compiti ripetitivi e riceve una parte del risparmio. Ci perdono le imprese che vendono lavoro d'ufficio esternalizzato e chi sperava in un posto pubblico in un'attività ormai automatizzata. Decidono il Parlamento e il Governo; attuano la Funzione pubblica, il Dipartimento per la trasformazione digitale e tutte le amministrazioni; certifica la Ragioneria generale dello Stato con il parere dell'Ufficio parlamentare di bilancio."
oceano_blu:
  eliminare: "La sostituzione automatica di ogni pensionamento con lo stesso profilo, e il risparmio che si perde nei bilanci degli enti."
  ridurre: "Il lavoro ripetitivo negli uffici, i tempi delle pratiche e il tempo che lo Stato chiede ai cittadini."
  aumentare: "L'uso delle macchine dove fanno meglio, le competenze digitali di chi lavora nello Stato e la parte di risparmio che torna in tasse più basse."
  creare: "Un dividendo dell'automazione certificato e pubblico, con regole costruite partendo dai trucchi di chi vuole aggirarle."
elusione:
  intro: "Un sistema abituato ad aggirare le regole proverebbe a far sparire gli addetti dal conto, non dal lavoro, e a trattenere il risparmio. Le regole di 09-C11 partono proprio da questi trucchi."
  righe:
    - trucco: "Spostare il personale in una società partecipata"
      regola: "Si conta la spesa consolidata dell'ente con le sue partecipate"
    - trucco: "Comprare il lavoro invece di assumerlo: somministrazione, appalti, consulenze"
      regola: "Il conto è sulla spesa totale per funzione, non solo sul personale"
    - trucco: "Contratti precari oggi, sanatoria domani"
      regola: "Nessuna stabilizzazione dei contratti flessibili nelle funzioni automatizzate"
    - trucco: "Spostare i posti in un altro ente"
      regola: "Si guarda anche il totale nazionale delle amministrazioni"
    - trucco: "Far costare le macchine più del personale risparmiato"
      regola: "Il risparmio è netto: si tolgono i costi delle macchine; codice aperto e contratti a risultato"
    - trucco: "Scaricare il lavoro sul cittadino con portali complicati"
      regola: "Se cresce il tempo del cittadino, il risparmio non è certificato"
    - trucco: "Tenere aperti per sempre carta e digitale"
      regola: "Data di chiusura registrata del canale vecchio, con assistenza per chi non può usare il digitale"
    - trucco: "Trattenere il risparmio o annullare il taglio delle tasse con un'altra imposta"
      regola: "Certificazione di un ente terzo, fondo vincolato e pressione fiscale totale pubblicata; l'ente che alza i suoi tributi perde la sua quota"
stime:
  intro: "Quanti posti ripetitivi si possono risparmiare? Le stime serie dicono tre cose: le macchine sostituiscono soprattutto compiti, non interi posti; i posti davvero sostituibili sono una minoranza; i risultati reali finora sono più bassi delle stime."
  righe:
    - chi: "OCSE, 2019"
      cosa: "In Italia il 15,2% dei posti è ad alto rischio di automazione (media OCSE 14,0%) e un altro 35,5% cambierà in modo significativo."
    - chi: "Banca d'Italia, 2024"
      cosa: "Circa 15 milioni di occupati su 22 sono esposti all'AI; di questi circa 9 milioni ne sarebbero aiutati e circa 6 milioni potrebbero vedere sostituiti compiti chiave."
    - chi: "OIL, 2025"
      cosa: "Nei Paesi ad alto reddito il 34% dei posti è esposto all'AI generativa, ma solo una piccola parte nella fascia più alta: il 9,6% dei posti delle donne e il 3,5% di quelli degli uomini. Le più esposte sono le mansioni d'ufficio."
    - chi: "Pubblica amministrazione italiana"
      cosa: "Le stime disponibili, fatte da società private con metodi diversi, vanno dal 7% al 12% degli addetti in mansioni davvero sostituibili. Non esiste ancora una stima di una fonte pubblica: per questo 09-C11 conta solo i risparmi certificati."
    - chi: "Esperienze reali"
      cosa: "Nel Regno Unito l'assistente AI ha fatto risparmiare 19-26 minuti al giorno a dipendente pubblico; in Danimarca, dei primi 7 grandi progetti AI pubblici, nel 2023 era in uso solo uno."
    - chi: "Robot nelle fabbriche"
      cosa: "L'Italia ha 237 robot ogni 10.000 addetti della manifattura, la Germania 449 (IFR 2025). In Germania i posti persi in fabbrica sono stati compensati da nuovi posti nei servizi."
  fonti: "OCSE, Employment Outlook 2019 (scheda Italia); Banca d'Italia, Questioni di economia e finanza n. 878, 2024; OIL, Working Paper 140, 2025; Implement Consulting Group 2025 e FPA 2024 (stime private sulla PA); governo britannico, prova di Microsoft 365 Copilot, 2025; Copenhagen Business School, 2025; IFR, World Robotics 2025; Dauth e coautori, JEEA 2021."
tasse:
  intro: "Quanto si risparmierebbe in tasse? Le tasse le riducono il dividendo dell'automazione (09-C11), con l'80% del risparmio dei posti non sostituiti al pensionamento, e il riesame delle funzioni (09-C12), con il 50% del risparmio delle persone ricollocate; l'AI nelle piccole imprese (01-P26) costa 0,08 mld l'anno e punta sulla produttività. Le stime sono indicative e non sono usate come copertura: conta solo ciò che la Ragioneria certificherà."
  righe:
    - scenario: "Prudente"
      posti: "50.000"
      lordo: "3,0 mld"
      tasse: "1,8 mld"
      persona: "circa 40 €"
      irpef: "0,9%"
    - scenario: "Centrale"
      posti: "130.000"
      lordo: "7,8 mld"
      tasse: "4,7 mld"
      persona: "circa 110 €"
      irpef: "2,4%"
    - scenario: "Alto"
      posti: "218.000"
      lordo: "13,1 mld"
      tasse: "7,8 mld"
      persona: "circa 180 €"
      irpef: "4,0%"
  ipotesi:
    - "Posti non sostituiti in tutto, quando la misura è a regime dopo circa dieci anni: lo scenario centrale usa la stima di 130.000 posti della pubblica amministrazione «probabilmente riallocati» con l'AI (Implement Consulting Group per Google, 2025), quello alto i 218.000 «a rischio sostituzione» (FPA, 2024), quello prudente circa un terzo del centrale. I posti si liberano solo con le uscite per pensione, fino a circa 120.000 l'anno."
    - "Costo di un posto circa 60.000 euro l'anno con gli oneri; le macchine costano il 25% di quanto si risparmia sul personale; del risparmio netto l'80% va alle tasse e il 20% è il premio per chi resta (da 0,45 a 2 mld)."
    - "Per persona: diviso per i 42,8 milioni di contribuenti IRPEF (MEF, anno d'imposta 2024) e confrontato con 197,4 mld di IRPEF netta. Il taglio andrebbe soprattutto ai lavoratori, con la detrazione per il lavoro o il trattamento integrativo, quindi per ciascuno di loro sarebbe più alto."
    - "Nel programma intermedio l'automazione (09-C7) è in versione essenziale, nelle amministrazioni centrali, all'INPS e nelle Agenzie fiscali: secondo la scheda vale circa metà dell'effetto pieno. Regioni e Comuni contano solo se automatizzano e aderiscono."
    - "Il primo taglio arriva al più presto dal 2030: prime uscite non sostituite nel 2028, certificazione nel 2029, sgravio con la legge di bilancio successiva. Le esperienze reali finora sono state più basse delle stime."
  riesame:
    intro: "Il riesame non libera molti posti in più di quelli che le macchine possono liberare: li libera prima, perché le persone delle funzioni chiuse coprono subito i posti vuoti invece di aspettare la pensione. Il risparmio netto va per metà alle tasse sul lavoro, per un quarto ai servizi che mancano e per un quarto alla riduzione del debito."
    righe:
      - scenario: "Prudente"
        persone: "10.000"
        netto: "0,45 mld"
        tasse: "0,23 mld"
        servizi: "0,11 mld"
        debito: "0,11 mld"
        persona: "circa 5 €"
      - scenario: "Centrale"
        persone: "20.000"
        netto: "0,9 mld"
        tasse: "0,45 mld"
        servizi: "0,22 mld"
        debito: "0,22 mld"
        persona: "circa 10 €"
      - scenario: "Alto"
        persone: "40.000"
        netto: "1,8 mld"
        tasse: "0,9 mld"
        servizi: "0,45 mld"
        debito: "0,45 mld"
        persona: "circa 20 €"
    ipotesi:
      - "Lo scenario centrale riprende la scala delle Province 2015-2017, circa 20.000 persone ricollocate in due anni, pari al 10% dei circa 200.000 dipendenti amministrativi di ministeri, Agenzie ed enti previdenziali nel 2024 (erano 269.000 nel 2010: -26%, Conto annuale RGS); quello prudente la metà; quello alto, 40.000 persone, è il 20%, vicino al calo del personale federale del Canada (-19% in cinque anni), ma senza le uscite incentivate che lì hanno fatto gran parte del lavoro."
      - "Conta solo chi copre un posto vuoto che altrimenti si sarebbe coperto con una nuova assunzione, e solo se le facoltà di assumere e gli stanziamenti sono tagliati davvero; i posti già certificati dal dividendo dell'automazione (09-C11) non si contano di nuovo."
      - "Costo di un posto circa 60.000 euro l'anno con gli oneri; macchine, formazione e assegni personali costano circa il 25% del risparmio. Per persona: la quota per le tasse divisa per i 42,8 milioni di contribuenti IRPEF (MEF, anno d'imposta 2024)."
      - "Il risparmio pieno arriva dopo i tre anni del riesame, dal 2030-2031, e resta, ma non cresce anno dopo anno come quello del dividendo dell'automazione. Le esperienze reali (Regno Unito, Danimarca, Province) sono state finora più basse delle stime."
proposte: [09-C11, 09-C12, 01-P26, 09-C7, 09-C8, 09-C9, 09-C10, 09-C5, 09-C2, 09-C1, 06-C10, 07-C1, 08-P1, 05-C2, 05-C6, 05-C10, 01-P9]
limiti:
  - "Quanto lavoro le macchine fanno davvero meglio nella pubblica amministrazione italiana non è ancora misurato: per questo nulla si conta prima della certificazione e la stima del risparmio non è una copertura."
  - "I dati Eurostat sull'AI nelle imprese non coprono le imprese con meno di 10 addetti, che in Italia sono la grande maggioranza."
  - "Meno posti nelle attività ripetitive vuol dire anche meno concorsi per quei profili: chi cerca lavoro nella pubblica amministrazione deve puntare su competenze diverse."
  - "Per l'AI nelle piccole imprese (01-P26) i risultati reali si sapranno solo con la valutazione: le esperienze estere vanno dal successo (Singapore, Germania) al fallimento (voucher nel Regno Unito)."
