# Pagina "AI e Stato" (21/11/2026): perché l'intelligenza artificiale è una chiave per l'Italia
# e come il programma la usa nella pubblica amministrazione. Dati Eurostat consultati il 21/11/2026
# (dataset indicati in ogni riga) e serie di storia/serie/ (AMECO). Scelta politica di chi guida il progetto:
# trasformazione digitale della PA con meno posti nelle attività ripetitive e meno tasse (09-C11).
titolo: "L'AI come chiave per l'Italia"
in_breve: "L'Italia cresce poco perché produce poco per ora lavorata, e i salari reali sono fermi da trent'anni. L'intelligenza artificiale è la prima tecnologia che rende accessibili a tutti, anche a un piccolo Comune o a un artigiano, competenze che prima avevano solo i grandi. GovernAI parte dallo Stato: le macchine fanno il lavoro ripetitivo, le persone il giudizio e la relazione, i posti che non servono più non si rimpiazzano quando qualcuno va in pensione e il risparmio, certificato, torna a chi paga le tasse."
tesi: "Le macchine fanno meglio ciò che è ripetitivo, ad alto volume e basato su regole: ricopiare dati, controllare documenti standard, rispondere alle domande frequenti, fare i conti. Le persone fanno meglio ciò che chiede giudizio, relazione e responsabilità: decidere un caso difficile, ascoltare chi è in difficoltà, rispondere di una scelta. Il guadagno più grande viene dal lavoro fatto insieme (Daugherty e Wilson, Human + Machine, 2018). Per questo la regola è doppia: più macchine dove sono migliori, e decide sempre una persona."
dati:
  - numero: "16,4%"
    testo: "delle imprese italiane con almeno 10 addetti usa l'AI, contro il 20,0% nella UE e il 26,0% in Germania (2025). Era l'8,2% nel 2024."
    fonte: "Eurostat, isoc_eb_ai"
  - numero: "14,2%"
    testo: "nelle piccole imprese da 10 a 49 addetti (UE 17,0%, Germania 23,1%). Le grandi sono quasi alla pari: 53,1% contro 55,0%. Il ritardo è nei piccoli."
    fonte: "Eurostat, isoc_eb_ai, 2025"
  - numero: "54%"
    testo: "delle persone tra 16 e 74 anni ha competenze digitali almeno di base, contro il 60% nella UE e il 66-67% in Francia e Spagna (2025)."
    fonte: "Eurostat, isoc_sk_dskl_i21"
  - numero: "21 ogni 1.000"
    testo: "abitanti lavorano nell'amministrazione pubblica in senso stretto, contro 35 in Germania e Spagna e 37 in Francia (2024). Il problema non è il numero, è quanto lavoro ripetitivo fanno."
    fonte: "Eurostat, nama_10_a64_e e demo_pjan"
  - numero: "31,7%"
    testo: "di chi lavora nell'amministrazione pubblica ha tra 55 e 64 anni, contro il 23,5% nella UE (2024). Nei prossimi dieci anni andrà in pensione fino a un terzo del personale pubblico."
    fonte: "Eurostat, lfsa_egan2; INPS 2025"
  - numero: "-8,4%"
    testo: "il salario reale per dipendente tra il 1991 e il 2025, mentre in Francia è salito del 30% e in Germania del 26%. Senza produttività i salari non crescono."
    fonte: "AMECO (Commissione europea), storia/serie/salario_reale_crescita.csv"
perche: "Dal 2001 la produttività oraria italiana cresce meno di quella dei vicini, e con lei i salari. Nello stesso tempo una persona su tre nella pubblica amministrazione è vicina alla pensione: è l'occasione per ripensare il lavoro invece di rimpiazzare ogni uscita con lo stesso profilo. L'AI costa poco e si può usare ovunque: se lo Stato la adotta bene, ne beneficiano cittadini, imprese e contribuenti; se la adotta male, aggiunge solo un altro sistema al vecchio."
come: "Prima si mappano e si automatizzano i processi ripetitivi (09-C7), con una squadra che entra negli uffici (09-C9) e strumenti pubblici e aperti (09-C5, 09-C10). Poi, per ogni pensionamento in un'attività automatizzata e certificata, il posto non si rimpiazza (09-C8, 09-C11). Il risparmio si misura su tutta la spesa dell'ente, partecipate e appalti compresi, lo certifica un ente terzo, e va per l'80% a ridurre le tasse sul lavoro e per il 20% a chi resta. Nessun licenziamento, e decide sempre una persona."
cosa: "Si misurano ogni anno: il risparmio netto certificato destinato alle tasse; la spesa per funzione e il costo per servizio; i tempi delle pratiche e il tempo chiesto al cittadino, che non devono peggiorare; la quota di imprese e di persone che usano l'AI; la produttività oraria e il salario reale. Tutto pubblico, ente per ente."
chi: "Ne beneficiano chi paga le tasse sul lavoro, soprattutto con redditi medi e bassi; chi usa i servizi pubblici, con pratiche più rapide; chi lavora nella pubblica amministrazione, che lascia i compiti ripetitivi e riceve una parte del risparmio. Ci perdono le imprese che vendono lavoro d'ufficio esternalizzato e chi sperava in un posto pubblico in un'attività ormai automatizzata. Decidono il Parlamento e il Governo; attuano la Funzione pubblica, il Dipartimento per la trasformazione digitale e tutte le amministrazioni; certifica la Ragioneria generale dello Stato con il parere dell'Ufficio parlamentare di bilancio."
oceano_blu:
  eliminare: "La sostituzione automatica di ogni pensionamento con lo stesso profilo, e il risparmio che si perde nei bilanci degli enti."
  ridurre: "Il lavoro ripetitivo negli uffici, i tempi delle pratiche e il tempo che lo Stato chiede ai cittadini."
  aumentare: "L'uso delle macchine dove fanno meglio, le competenze digitali di chi lavora nello Stato e la parte di risparmio che torna in tasse più basse."
  creare: "Un dividendo dell'automazione certificato e pubblico, con regole costruite partendo dai trucchi di chi vuole aggirarle."
elusione:
  intro: "Un sistema abituato ad aggirare le regole proverebbe a far sparire gli addetti dal conto, non dal lavoro, e a trattenere il risparmio. Le regole di 09-C11 partono proprio da questi trucchi."
  righe:
    - trucco: "Spostare il personale in una società partecipata"
      regola: "Si conta la spesa consolidata dell'ente con le sue partecipate"
    - trucco: "Comprare il lavoro invece di assumerlo: somministrazione, appalti, consulenze"
      regola: "Il conto è sulla spesa totale per funzione, non solo sul personale"
    - trucco: "Contratti precari oggi, sanatoria domani"
      regola: "Nessuna stabilizzazione dei contratti flessibili nelle funzioni automatizzate"
    - trucco: "Spostare i posti in un altro ente"
      regola: "Si guarda anche il totale nazionale delle amministrazioni"
    - trucco: "Far costare le macchine più del personale risparmiato"
      regola: "Il risparmio è netto: si tolgono i costi delle macchine; codice aperto e contratti a risultato"
    - trucco: "Scaricare il lavoro sul cittadino con portali complicati"
      regola: "Se cresce il tempo del cittadino, il risparmio non è certificato"
    - trucco: "Tenere aperti per sempre carta e digitale"
      regola: "Data di chiusura registrata del canale vecchio, con assistenza per chi non può usare il digitale"
    - trucco: "Trattenere il risparmio o annullare il taglio delle tasse con un'altra imposta"
      regola: "Certificazione di un ente terzo, fondo vincolato e pressione fiscale totale pubblicata; l'ente che alza i suoi tributi perde la sua quota"
proposte: [09-C11, 09-C7, 09-C8, 09-C9, 09-C10, 09-C5, 09-C2, 09-C1, 06-C10, 07-C1, 08-P1, 05-C2, 05-C6, 05-C10, 01-P9]
limiti:
  - "Quanto lavoro le macchine fanno davvero meglio nella pubblica amministrazione italiana non è ancora misurato: per questo nulla si conta prima della certificazione e la stima del risparmio non è una copertura."
  - "I dati Eurostat sull'AI nelle imprese non coprono le imprese con meno di 10 addetti, che in Italia sono la grande maggioranza."
  - "Meno posti nelle attività ripetitive vuol dire anche meno concorsi per quei profili: chi cerca lavoro nella pubblica amministrazione deve puntare su competenze diverse."
  - "L'AI nelle piccole imprese private è la seconda metà della strategia e non ha ancora una proposta dedicata."
