# Contenuti della pagina "Che cosa cambia per me" (scenario intermedio). Generato il 13/11/2026 da un agente AI dalle fonti del repository;
# aggiornato il 15/11/2026 con le coperture nuove (benchmark/risparmi_*.md) e il calendario ricalcolato.
# Fonti: programma/selezione_intermedio.md e .csv (variante scelta e coperture attive), programma/annuale_intermedio.md (calendario di avvio),
# programma/varianti/*.csv, programma/schede/*.md, programma/coperture_menu.csv, programma/coesione_dopo_2029.csv,
# 20_programma_governai.md, 22_programma_in_una_pagina.md, 23_equita_e_linguaggio.md. Stime GovernAI non certificate.
# Calendario di avvio (annuale_intermedio.md): il "primo gruppo" (nucleo robusto, sperimentazioni, 04-P8, 06-C8) parte nel 2027
# al 3% della spesa prevista (il 2027 è un anno di preparazione), 73% nel 2028, 94% nel 2029, 95% nel 2030, 100% dal 2031; le riforme a costo
# quasi zero partono subito; quattro misure (01-P10, 04-P4, 09-C1, 09-C6) partono solo nel 2031 (14%) e sono a pieno dal 2032. Le misure pagate solo con fondi europei 2021-2027 partono nel 2027 e durano fino al 2029.
profili:
- id: famiglia-figli-piccoli
  titolo: Famiglia con una bambina o un bambino sotto i 3 anni
  icona: baby
  chi: 'Le famiglie con figlie e figli sotto i 3 anni: circa 1,1 milioni di bambine e bambini. Oggi ci sono 31,6 posti al nido ogni 100, solo 19 al Sud (ISTAT, Offerta di nidi 2023/24).'
  in_breve: Più posti al nido dove oggi mancano, gratis con un ISEE (indicatore della situazione economica) fino a 25.000 euro. Il congedo paterno sale a un mese e poi a due, con tempi che dipendono dal calendario di avvio.
  in_30_secondi:
    esempi:
    - testo: Con un ISEE fino a 25.000 euro il nido è gratis, ma solo negli ambiti dove oggi ci sono meno di 33 posti ogni 100 bambine e bambini.
      fonte: programma/varianti/02_lavoro.csv, 02-C2 variante ESSENZIALE
      stima: false
    - testo: Con uno stipendio di 2.000 euro lordi al mese, il papà ha un mese di congedo pagato circa 1.600 euro lordi, cioè l'80%. Oggi i giorni sono 10.
      fonte: programma/varianti/02_lavoro.csv, 02-C2 variante ESSENZIALE (congedo all'80%); calcolo GovernAI 2.000 × 80% su uno stipendio di esempio
      stima: true
    - testo: 'Il bonus di 1.000 euro per ogni nuova nascita e il bonus per le lavoratrici madri restano come oggi: nel programma intermedio non cambiano.'
      fonte: programma/selezione_intermedio.md (RB02 e RB03 non attive dal 15/11/2026); programma/coperture_menu.csv, RB02 e RB03
      stima: false
    quando: Il 2027 è di preparazione; nel 2028 parte il 73% della spesa per nido e congedo, nel 2029 il 94%, tutta dal 2031. I bonus per le nascite e per le madri non cambiano.
  guadagna:
  - proposta: 02-C2
    testo: Versione essenziale. Lo Stato paga il personale dei nidi solo negli ambiti con meno di 33 posti ogni 100 bambine e bambini. Sono circa 60-70 mila posti in più, soprattutto al Sud e nelle aree interne.
  - proposta: 02-C2
    testo: In quegli ambiti il nido è gratis per le famiglie con un ISEE fino a 25.000 euro. Per loro la gratuità prende il posto del bonus nido.
  - proposta: 02-C2
    testo: 'Congedo di paternità: da 10 giorni a un mese, poi a due mesi, pagato all''80% dello stipendio e non cedibile. La scheda prevede il 2028 e il 2030, ma con il calendario di avvio nel 2028 parte solo il 73% della spesa per nido e congedo: le date possono slittare.'
  - proposta: 02-C2
    testo: Il congedo vale anche per chi lavora in proprio e per chi è iscritto alla Gestione separata dell'INPS (Istituto nazionale della previdenza sociale).
  paga: []
  da_sapere:
  - Il nido gratis e i posti in più valgono solo negli ambiti sotto 33 posti ogni 100. Dove l'offerta è già più alta non cambia nulla.
  - 'La versione piena non c''è: 33 posti ovunque, nido gratis fino a 30.000 euro di ISEE e tre mesi di congedo per il papà. Si deciderà dopo la valutazione del 2029.'
  - 'Calendario di avvio: il nido è nel primo gruppo. Il 2027 è un anno di preparazione: nel 2028 parte il 73% della spesa prevista, il 94% nel 2029, tutta dal 2031. I posti possono quindi arrivare più piano.'
  - Il congedo si perde se non viene usato entro 12 mesi dalla nascita.
  - 'Bonus nascita e bonus per le lavoratrici madri restano come oggi. Le coperture che li riducevano (RB02 e RB03) sono uscite dal programma il 15 novembre 2026: le nuove coperture trovate con la ricerca dei risparmi bastano senza toccarli.'
  - 'La misura non promette più nascite: gli obiettivi sono i posti al nido e il lavoro delle donne.'
- id: scuola-e-studio
  titolo: Studentessa o studente in una scuola o in un territorio fragile, e chi studia dopo il diploma
  icona: graduation-cap
  chi: Circa 0,7 milioni di alunne e alunni nel 10% di scuole più svantaggiate, fino a 1,4 milioni nelle 1.500 scuole con squadre. Gli ITS oggi hanno circa 33.400 iscrizioni (Il programma in una pagina).
  in_breve: Nelle scuole più fragili arrivano tutor, educatori e mediatori, 250 euro in più per alunna o alunno e scuole aperte il pomeriggio. Dopo il diploma, borsa di studio garantita a chi ne ha diritto per merito e reddito.
  in_30_secondi:
    esempi:
    - testo: Ogni scuola statale del 10% più svantaggiato riceve 250 euro in più l'anno per ogni alunna o alunno, da spendere per il 70% in interventi che funzionano.
      fonte: programma/varianti/05_istruzione.csv, 05-C7 variante ESSENZIALE
      stima: false
    - testo: Chi detrae le spese per lo sport di figlie e figli tra 5 e 18 anni perde in media 46 euro l'anno.
      fonte: programma/coperture_menu.csv, SF08 (MEF, Rapporto annuale sulle spese fiscali 2025)
      stima: false
    - testo: Con un ISEE sopra 35.000 euro la Carta Valore per chi ha appena preso il diploma non spetta più.
      fonte: programma/coperture_menu.csv, RB01 (l'importo della Carta non è nei file del repository)
      stima: false
    - testo: La borsa di studio resta garantita a chi è idoneo anche quando finiscono i fondi PNRR, che oggi pagano circa 150 dei 708 milioni delle borse.
      fonte: programma/schede/05_istruzione.md, 05-C4 (dato di stampa, da verificare)
      stima: false
    quando: Il 2027 è di preparazione; nel 2028 parte il 73% della spesa prevista, nel 2029 il 94%, tutta dal 2031, mentre le prove con fondi europei vanno dal 2027 al 2029.
  guadagna:
  - proposta: 05-C1
    testo: Versione piena. Squadre di tutor, educatrici, educatori e mediatori contro l'abbandono nelle circa 1.500 scuole più fragili. Tutoraggio in matematica alla primaria.
  - proposta: 05-C1
    testo: Per chi arriva in Italia tra 16 e 24 anni ci sono percorsi ponte nei CPIA, i centri per l'istruzione degli adulti. Un sistema di allerta segnala presto chi rischia di lasciare.
  - proposta: 05-C7
    testo: Versione essenziale. Ogni scuola statale del 10% più svantaggiato riceve 250 euro in più per alunna o alunno. Il 70% va speso in interventi che hanno dato prova di funzionare.
  - proposta: 05-C5
    testo: Versione essenziale. Le stesse circa 1.500 scuole più fragili restano aperte oltre l'orario delle lezioni, come luoghi per tutta la comunità.
  - proposta: 05-C4
    testo: Versione essenziale. Borsa di studio garantita a tutte le persone idonee dopo il diploma. Le iscrizioni agli ITS, le scuole tecniche superiori, raddoppiano fino a circa 66.000.
  - proposta: 05-C4
    testo: 'Nuove residenze per chi studia su immobili pubblici, con un affitto legato all''ISEE, l''indicatore della situazione economica: 1 miliardo in 10 anni.'
  - proposta: 06-C9
    testo: 'Solo in prova: équipe per il benessere psicologico in 100 reti di scuole di 4 Regioni, collegate alla Casa della Comunità.'
  - proposta: 05-C8
    testo: 'Solo in prova in 3 Regioni: biblioteche di comunità e 200 scuole con una biblioteca in rete.'
  - proposta: 05-C9
    testo: 'Solo in prova in 3 Regioni: zaino culturale per tutte le classi e prezzi ridotti per la cultura nei capoluoghi, secondo l''ISEE.'
  - proposta: 05-C6
    testo: 'Solo regole: nessun voto, ammissione o orientamento deciso da un sistema automatico. L''uso critico dell''intelligenza artificiale entra nell''educazione civica.'
  paga:
  - copertura: RB01
    testo: La Carta Valore per chi ha appena preso il diploma resta solo alle famiglie con un ISEE fino a 35.000 euro. Sopra questa soglia non spetta più.
  - copertura: SF08
    testo: La detrazione del 19% per lo sport di ragazze e ragazzi tra 5 e 18 anni sparisce. Al suo posto c'è sport gratuito a scuola. Oggi il beneficio medio è di 46 euro.
  da_sapere:
  - Squadre, 250 euro e scuole aperte valgono solo per le scuole più svantaggiate. Le altre 1.500 scuole che la versione piena avrebbe aperto restano fuori.
  - Gli ITS raddoppiano invece di triplicare e le residenze sono meno di quelle della versione piena.
  - Biblioteche, zaino culturale e benessere psicologico sono solo prove in 3-4 Regioni. Si estendono solo se la valutazione è positiva.
  - 'Calendario di avvio: queste misure sono nel primo gruppo. Il 2027 è un anno di preparazione: nel 2028 parte il 73% della spesa prevista, il 94% nel 2029, tutta dal 2031.'
  - 'Una parte delle squadre contro l''abbandono è pagata con fondi europei che finiscono nel 2029. Dopo serve il nuovo ciclo europeo 2028-2034: oggi non è garantito.'
- id: giovani-lavoro
  titolo: Giovane che cerca lavoro o partecipa ai concorsi pubblici
  icona: briefcase
  chi: In Italia il 13,3% delle persone tra 15 e 29 anni non studia e non lavora, il 22,8% in Sicilia (Eurostat 2025).
  in_breve: Chi ha più di 25 anni e non studia né lavora riceve una dote di 900 euro per la formazione. Nei concorsi pubblici ci sono meno posti amministrativi generici e più posti tecnici.
  in_30_secondi:
    esempi:
    - testo: Se hai più di 25 anni e non studi né lavori, o non hai il diploma, ricevi una dote di 900 euro per corsi certificati.
      fonte: programma/varianti/05_istruzione.csv, 05-C2 variante ESSENZIALE
      stima: false
    - testo: Nei concorsi per profili amministrativi generici di ministeri ed enti nazionali, dal 2028 al 2031 entrano 75-85 persone ogni 100 che vanno in pensione.
      fonte: programma/coperture_menu.csv e programma/selezione_intermedio.md, RP01
      stima: false
    - testo: 'Per la busta paga il programma dà solo regole: la detrazione unica per il lavoro e il salario del contratto di riferimento non portano euro in più garantiti.'
      fonte: programma/selezione_intermedio.md, 01-P9 e 02-C1 in variante ZERO (solo regole)
      stima: false
    quando: Le regole su salario e pensione integrativa partono subito; la dote parte nel 2028 al 73% della spesa prevista, al 94% nel 2029, tutta dal 2031.
  guadagna:
  - proposta: 05-C2
    testo: Versione essenziale. Dote di 900 euro per corsi certificati. Spetta a chi ha più di 25 anni e non studia né lavora, e a chi non ha il diploma. Spetta anche a chi fa un lavoro che l'intelligenza artificiale può sostituire.
  - proposta: 05-C2
    testo: I CPIA, i centri per l'istruzione degli adulti, offrono corsi serali su lettura, calcolo e uso dell'intelligenza artificiale.
  - proposta: 09-C8
    testo: Versione essenziale. Nella pubblica amministrazione, chi entra viene affiancato da chi sta per andare in pensione, su circa 2.250 posti critici l'anno.
  - proposta: 09-C3
    testo: Versione essenziale. 3.000 figure tecniche condivise tra i Comuni sotto i 5.000 abitanti del Mezzogiorno e delle aree interne. Priorità a chi ha già lavorato bene sui progetti del Piano nazionale di ripresa e resilienza (PNRR).
  - proposta: 02-C1
    testo: 'Solo regole: il salario del contratto più rappresentativo diventa il riferimento per tutto il settore, anche negli appalti. Non c''è una soglia fissata per legge.'
  - proposta: 02-C3
    testo: 'Solo regole: chi viene assunto entra in automatico nella pensione integrativa del suo contratto, ma può rinunciare.'
  - proposta: 01-P1
    testo: 'Versione essenziale: le leggi importanti mostrano in una tabella quanto pesano su ogni generazione, con una valutazione a 30 anni del debito.'
  paga:
  - copertura: RP01
    testo: Dal 2028 al 2031 ministeri ed enti nazionali sostituiscono il 75-85% di chi va in pensione nei profili amministrativi generici. Ci sono meno posti ai concorsi, soprattutto al Sud.
  - copertura: RP08
    testo: Lo stesso vale per i profili amministrativi generici delle aziende sanitarie, dal 2028 al 2031. I risparmi vanno a infermiere, infermieri e Case della Comunità.
  - copertura: RA07
    testo: Una quota delle nuove assunzioni pubbliche va a profili tecnici come informatica, appalti e progettazione, invece che a profili generici.
  da_sapere:
  - Nei ministeri il taglio non tocca scuola, università, ricerca, cultura, giustizia, Interno, agenzie fiscali, sicurezza e servizi sociali.
  - Nelle aziende sanitarie sono esclusi i profili tecnici, informatici e gli sportelli di prenotazione.
  - Se i tempi dei servizi peggiorano oltre una soglia, l'ufficio torna a sostituire tutte le persone che vanno in pensione.
  - 'Non c''è una dote di formazione per tutte e tutti: la versione piena, con 300 euro di base, è fuori.'
  - La parte della dote pagata con fondi europei finisce nel 2029. Dopo serve il nuovo ciclo europeo 2028-2034, oggi non garantito.
  - Restano fuori dal programma la casa a canone giusto (04-P2) e i treni per chi viaggia ogni giorno (04-P3).
- id: persone-anziane-cura
  titolo: Persona anziana non autosufficiente e chi se ne prende cura
  icona: heart-handshake
  chi: Circa 243.000 persone sono in lista d'attesa per una RSA, residenza sanitaria assistenziale (dato da verificare). L'assistenza a casa dà in media 14 ore l'anno per persona (Rapporto OASI 2025).
  in_breve: Più assistenza a casa con 500 squadre di infermiere e infermieri di quartiere e Case della Comunità aperte. Il budget di cura è solo una prova in 20 ambiti.
  in_30_secondi:
    esempi:
    - testo: Sotto 50.000 euro di reddito la detrazione del 19% sulle spese sanitarie non cambia. Sopra cala, in media del 40-60%, e oltre 120.000 euro sparisce.
      fonte: programma/coperture_menu.csv, SF06 (descrizione e nota con le ipotesi)
      stima: true
    - testo: 'Dal 2028 non detrai più le polizze vita e infortuni: oggi il vantaggio medio è di 53 euro l''anno. Le polizze per la non autosufficienza restano detraibili.'
      fonte: programma/coperture_menu.csv, FN02 (MEF, Rapporto annuale sulle spese fiscali 2025)
      stima: false
    - testo: 'Fuori dai 20 ambiti di prova non arrivano euro in più per la cura: le squadre di quartiere danno ore di assistenza, non soldi.'
      fonte: programma/varianti/06_salute.csv, 06-C4 variante PILOTA e 06-C8 variante ESSENZIALE
      stima: false
    quando: Il 2027 è di preparazione; squadre di quartiere e Case della Comunità partono nel 2028 al 73% della spesa prevista, al 94% nel 2029, tutte dal 2031.
  guadagna:
  - proposta: 06-C8
    testo: Versione essenziale. 500 squadre di infermiere e infermieri di quartiere per l'assistenza a casa, nelle Regioni dove oggi ce n'è meno. Sono pagate per le ore di cura, non per le visite.
  - proposta: 06-C3
    testo: 'Versione essenziale. Fondi per far funzionare 1.038 Case della Comunità, con sportello sociale insieme al Comune. Obiettivo: assistenza a casa per il 10% delle persone dai 65 anni in su.'
  - proposta: 06-C4
    testo: Solo in prova, in 20 ambiti territoriali per 3 anni, almeno 10 al Sud. Una sola valutazione del bisogno e un budget di cura, più alto se paga un'assistente familiare con contratto regolare.
  - proposta: 06-C1
    testo: 'Solo regole: un''agenda unica per prenotare visite ed esami, anche nel privato accreditato, e una chiamata attiva per ridurre gli appuntamenti persi.'
  paga:
  - copertura: SF06
    testo: Con un reddito tra 50.000 e 120.000 euro la detrazione del 19% sulle spese sanitarie scende. Le spese per la non autosufficienza sono escluse dal taglio.
  - copertura: FN02
    testo: Dal 2028 non si detraggono più i premi delle polizze vita e infortuni. Restano detraibili quelle per la non autosufficienza.
  da_sapere:
  - 'Il budget di cura per tutte e tutti non c''è: c''è solo la prova in 20 ambiti, pagata con fondi europei fino al 2029. Dopo si decide in base alla valutazione.'
  - Chi oggi riceve l'indennità di accompagnamento non perde nulla.
  - 'Calendario di avvio: squadre di quartiere e Case della Comunità sono nel primo gruppo. Il 2027 è un anno di preparazione: nel 2028 parte il 73% della spesa prevista, il 94% nel 2029, tutta dal 2031.'
  - Non c'è un rimborso automatico se l'attesa per una visita è troppo lunga.
  - La salute mentale (06-C5) resta fuori dal programma.
- id: persone-con-disabilita
  titolo: Persona con disabilità e la sua famiglia
  icona: accessibility
  chi: 'In Italia 2,9 milioni di persone hanno limitazioni gravi (ISTAT 2023). Lavorano molto meno delle altre: 43,4 punti di differenza nel tasso di occupazione (Eurostat 2025).'
  in_breve: Il collocamento mirato al lavoro diventa più efficace ovunque. Il progetto di vita ha personale e budget in più solo nel quarto degli ambiti con meno servizi, in prova fino al 2029.
  in_30_secondi:
    esempi:
    - testo: 'In tasca non arrivano euro nuovi: il programma rende più efficace il collocamento al lavoro e, solo in un ambito su quattro, dà personale per il progetto di vita.'
      fonte: programma/selezione_intermedio.md e programma/varianti/02_lavoro.csv, 02-C5 variante PILOTA
      stima: false
    - testo: 'Nel quarto degli ambiti con meno servizi c''è un budget di progetto di circa 100 milioni l''anno in tutto: paga servizi, non soldi alla persona.'
      fonte: programma/varianti/02_lavoro.csv, 02-C5 variante PILOTA (nota sul budget di progetto, circa 0,10 mld)
      stima: true
    - testo: Le spese sanitarie legate alla disabilità non subiscono il nuovo taglio della detrazione del 19% per i redditi tra 50.000 e 120.000 euro.
      fonte: programma/coperture_menu.csv, SF06
      stima: false
    quando: Riforma del progetto di vita e collocamento mirato partono dal 2027; la prova con personale e budget va dal 2027 al 2029, poi una valutazione decide.
  guadagna:
  - proposta: 02-C5
    testo: 'In tutta Italia: una banca dati dei posti di lavoro riservati ancora scoperti e sanzioni automatiche per le aziende che non assumono.'
  - proposta: 02-C5
    testo: 'Solo in prova: nel quarto degli ambiti con meno servizi, circa 750 persone in più valutano i bisogni e c''è un budget di progetto aggiuntivo, fino al 2029.'
  - proposta: 02-C5
    testo: La riforma del progetto di vita parte ovunque dal 2027, come già prevede la legge. Il budget non può ridurre le prestazioni che la persona riceve già.
  - proposta: 09-C2
    testo: 'Solo regole: diritto a non consegnare di nuovo documenti che un ufficio pubblico ha già. L''indennizzo arriva solo dopo 36 mesi.'
  paga:
  - copertura: SF06
    testo: Con un reddito tra 50.000 e 120.000 euro la detrazione del 19% sulle spese sanitarie scende. Le spese legate alla disabilità sono escluse dal taglio.
  - copertura: FN02
    testo: Dal 2028 non si detraggono più i premi delle polizze vita e infortuni. Restano detraibili quelle per la tutela di persone con disabilità grave.
  da_sapere:
  - Per tre anni, in tre ambiti su quattro, il progetto di vita resta un diritto senza personale e risorse in più. È un prezzo dichiarato.
  - Il personale è assunto a tempo determinato e pagato con fondi europei fino al 2029. Nel 2029 una valutazione decide se passare alla versione essenziale.
  - La versione essenziale, con circa 3.000 persone per la valutazione in tutti gli ambiti, non è nello scenario.
  - La salute mentale (06-C5) resta fuori dal programma.
- id: piccole-imprese
  titolo: Piccola impresa, autotrasporto o azienda agricola
  icona: truck
  chi: In Italia ci sono circa 1,13 milioni di aziende agricole (ISTAT 2020) e circa 2 milioni di contribuenti nel regime forfetario (Rapporto sulle spese fiscali). Nel 2025 i nuovi camion pesanti a zero emissioni erano solo 80 (dati ICCT).
  in_breve: Autotrasporto e agricoltura perdono il gasolio agevolato entro il 2035, con aiuti per mezzi puliti. Le piccole partite IVA hanno dichiarazioni precompilate e rate automatiche.
  in_30_secondi:
    esempi:
    - testo: 'Con 70.000 euro di ricavi nel forfetario paghi 5 punti in più sul reddito degli ultimi 20.000 euro di ricavi: sempre meno di 1.000 euro l''anno.'
      fonte: programma/coperture_menu.csv, SF02; calcolo GovernAI 5% di 20.000 euro = 1.000 euro, tetto massimo perché il reddito forfetario è solo una quota dei ricavi
      stima: true
    - testo: 'Entro il 2035 il gasolio agricolo paga l''accisa piena: circa 50 centesimi in più al litro. Con 5.000 litri l''anno sono circa 2.500 euro, in parte compensati.'
      fonte: programma/coperture_menu.csv, SAD02 e SAD13 (lo sconto vale il 78% dell'accisa piena); accisa sul gasolio tra 617,40 e 672,90 euro per 1.000 litri (legislazione/archivio/testi/2026/26A05912.txt, d.lgs. 43/2025 art. 3); calcolo GovernAI 78% × 0,62-0,67 euro
      stima: true
    - testo: Un camion Euro 5 perde dal 2028 tutto il rimborso dell'accisa sul gasolio. Per un Euro 6 il rimborso cala di un terzo, piano piano.
      fonte: programma/coperture_menu.csv, SAD01 (l'importo del rimborso per litro non è nei file del repository)
      stima: false
    - testo: Per comprare un camion pesante a zero emissioni il contributo medio è di circa 80.000 euro, con un'asta per circa 600 camion l'anno.
      fonte: programma/varianti/04_infrastrutture.csv, 04-P8 variante ESSENZIALE (nota)
      stima: true
    quando: Il forfetario cambia dal 2028; precompilata, rate e aiuti per i camion partono nel 2028 al 73% della spesa prevista, tutti dal 2031; il gasolio agevolato cala per tappe fino al 2035.
  guadagna:
  - proposta: 01-P12
    testo: Versione essenziale. Dichiarazione precompilata per le piccole partite IVA, rate automatiche online, sanzioni proporzionate. Nessun condono.
  - proposta: 01-P3
    testo: Versione essenziale. Rimborsi IVA più rapidi per chi è affidabile, grazie ai dati delle fatture elettroniche. Blocco dei crediti IVA sospetti.
  - proposta: 04-P8
    testo: Versione essenziale. Aste per contributi su circa 600 camion pesanti a zero emissioni l'anno. Gare per la ricarica dei camion solo nel Mezzogiorno.
  - proposta: 04-P8
    testo: Gli sconti sui pedaggi vanno solo ai camion Euro VI e a zero emissioni.
  - proposta: 04-P9
    testo: 'Solo regole: zone a emissioni zero per le merci nelle 14 città metropolitane dal 2030, con 4 anni di preavviso. I contributi per cargo bike e ricarica sono usciti dal programma dopo la verifica delle coperture.'
  - proposta: 01-P5
    testo: Versione essenziale. Garanzia pubblica per contratti lunghi di energia rinnovabile a prezzo stabile, solo per consorzi e distretti che consumano molta energia.
  - proposta: 05-C10
    testo: 'Solo in prova fino al 2029: voucher per le piccole e medie imprese che comprano servizi da 5 centri di ricerca, almeno 2 al Sud.'
  paga:
  - copertura: SAD13
    testo: Entro il 2035 finiscono il rimborso del gasolio per l'autotrasporto e lo sconto sul gasolio agricolo. Una parte dei soldi aiuta a rinnovare i mezzi e sostiene i redditi agricoli.
  - copertura: SAD01
    testo: Dal 2028 niente rimborso del gasolio per i camion Euro 5. Per gli Euro 6 il rimborso cala di un terzo, piano piano. Un quarto del gettito va a nuovi mezzi e intermodalità.
  - copertura: SAD02
    testo: L'accisa sul gasolio agricolo sale in 5 anni dal 22% al 40% di quella normale. Le piccole aziende e la montagna hanno un credito per mezzi a basse emissioni.
  - copertura: SF02
    testo: Nel regime forfetario l'imposta sale dal 15% al 20%, solo sulla parte di reddito legata ai ricavi tra 50.000 e 85.000 euro. Sotto i 50.000 euro non cambia nulla.
  - copertura: RA14
    testo: Gli incentivi alle imprese che non dimostrano di funzionare vengono aboliti con un nuovo Codice degli incentivi.
  - copertura: RA04
    testo: Le linee di incentivo alle imprese senza una valutazione positiva sono tagliate del 3-5%.
  - copertura: SF10
    testo: La maggiorazione per gli investimenti in beni ordinari scende. Resta per digitale, beni immateriali e transizione verde.
  - copertura: RA01
    testo: Le amministrazioni centrali comprano di più con gare centralizzate e prezzi di riferimento. In parte pesa sulle piccole imprese locali che vendono alla pubblica amministrazione.
  - copertura: RA21
    testo: Il Fondo di garanzia non garantisce più i prestiti ordinari alle imprese più solide, che il credito lo hanno già. Restano garantiti start-up, microimprese e investimenti per la transizione.
  - copertura: SAD21
    testo: Se guidi un taxi a benzina o gasolio, l'accisa ridotta sul carburante finisce. Per 3 anni al suo posto c'è un contributo per passare a un taxi elettrico. Le tariffe le decidono i Comuni.
  - copertura: SF25
    testo: Le società agricole di capitali e le cooperative con più di 1 milione di euro di ricavi pagano le imposte sull'utile vero, non più sul reddito catastale. Per le aziende agricole familiari e sotto 1 milione non cambia nulla.
  da_sapere:
  - 'Il taglio del gasolio agevolato arriva piano: SAD13 va a pieno solo nel 2035. Le tappe sono annunciate con 12 mesi di anticipo.'
  - Parte del costo può passare alla clientela finale, tramite i prezzi dei trasporti.
  - Dopo la verifica delle coperture della sera del 13 novembre sono usciti dal programma il credito per la ricerca (01-P13), le merci sul treno (04-P7) e i contributi per le consegne pulite (04-P9).
  - 'Gli aiuti per i camion a zero emissioni (04-P8) sono nel primo gruppo: nel 2028 parte il 73% della spesa prevista, il 94% nel 2029, tutta dal 2031.'
  - I fondi per rinnovare flotte e il credito agricolo vanno prima alle piccole imprese, alla montagna, alle aree interne e alle isole.
  - La garanzia sull'energia (01-P5) e i voucher per la ricerca (05-C10) sono pagati con fondi europei fino al 2029.
  - La misura per togliere i gradini che tengono piccole le imprese (01-P4) resta fuori dal programma.
- id: pensioni
  titolo: Persona in pensione, anche con una pensione alta (oltre circa 3.700 euro lordi al mese)
  icona: landmark
  chi: Circa 1 milione di persone ha una pensione sopra 6 volte il minimo, cioè circa 3.700 euro lordi al mese. È una stima GovernAI su dati 2025 dell'INPS, l'ente delle pensioni. La spesa per pensioni è il 15,2% del prodotto interno lordo (Ragioneria generale dello Stato).
  in_breve: Per chi ha una pensione alta, dal 2030 al 2034 la parte sopra 3.700 euro cresce meno con l'inflazione. Per tutte e tutti, dichiarazione dei redditi già pronta e più assistenza vicino a casa.
  in_30_secondi:
    esempi:
    - testo: 'Con 5.000 euro lordi al mese di pensione, la parte sopra circa 3.700 euro è 1.300: con inflazione all''1,8%, nel 2030 sono circa 6 euro al mese in meno.'
      fonte: programma/coperture_menu.csv, PE04 (rivalutazione al 50% invece del 75%; inflazione 1,8% nella nota); calcolo GovernAI 1.300 × 25% × 1,8% ≈ 5,85 euro lordi
      stima: true
    - testo: 'Ogni anno la differenza si somma: nel 2034 sono circa 30 euro lordi al mese in meno, e restano anche dopo.'
      fonte: programma/coperture_menu.csv, PE04 (nota «la base ridotta resta dopo la scadenza»); calcolo GovernAI 5 anni × 5,85 euro, con la stessa inflazione ogni anno
      stima: true
    - testo: Con una pensione fino a circa 3.700 euro lordi al mese la rivalutazione non cambia. Non c'è nessun contributo straordinario sulle pensioni.
      fonte: programma/coperture_menu.csv, PE04; programma/selezione_intermedio.md (PE01 e PE02 escluse)
      stima: false
    - testo: 'Dal 2028 non detrai più polizze vita e infortuni e spese veterinarie: oggi il vantaggio medio è di 53 e 45 euro l''anno.'
      fonte: programma/coperture_menu.csv, FN02 (MEF, Rapporto annuale sulle spese fiscali 2025)
      stima: false
    quando: Nel 2028 cambiano le detrazioni e partono dichiarazione già pronta e assistenza a casa, al 73% della spesa prevista, tutte dal 2031; la rivalutazione ridotta vale dal 2030 al 2034.
  guadagna:
  - proposta: 01-P7
    testo: Versione essenziale. Chi ha solo la pensione e la Certificazione Unica riceve la dichiarazione già fatta. Vale se non la contesta, e i rimborsi sono automatici.
  - proposta: 06-C8
    testo: Versione essenziale. 500 squadre di infermiere e infermieri di quartiere per l'assistenza a casa, nelle Regioni dove oggi ce n'è meno.
  - proposta: 06-C3
    testo: 'Versione essenziale. Fondi per far funzionare 1.038 Case della Comunità vicino a casa. Obiettivo: assistenza a casa per il 10% delle persone dai 65 anni in su.'
  - proposta: 06-C1
    testo: 'Solo regole: un''agenda unica per prenotare visite ed esami, anche nel privato accreditato, e una chiamata attiva per non perdere gli appuntamenti.'
  - proposta: 02-C3
    testo: 'Solo regole, per chi deve ancora andare in pensione: si può uscire prima, con una riduzione calcolata sul costo vero dell''anticipo. Regole più leggere per i lavori gravosi.'
  paga:
  - copertura: PE04
    testo: Dal 2030 al 2034 la parte di pensione sopra circa 3.700 euro lordi al mese si rivaluta al 50% dell'inflazione invece del 75%. Con inflazione oltre il 4% resta al 75%.
  - copertura: PE03
    testo: 'Niente nuove quote né Opzione donna: chi vuole uscire prima lo fa con il calcolo contributivo. Il risparmio è già nelle leggi in vigore.'
  - copertura: SF06
    testo: Con un reddito tra 50.000 e 120.000 euro la detrazione del 19% sulle spese sanitarie scende, fino a sparire. Restano salve disabilità, malattie croniche gravi e non autosufficienza.
  - copertura: SF07
    testo: Con un reddito oltre 75.000 euro si deduce di meno per i contributi ai fondi sanitari integrativi.
  - copertura: FN02
    testo: Dal 2028 non si detraggono più i premi delle polizze vita e infortuni e le spese veterinarie. Restano detraibili le polizze per non autosufficienza e disabilità grave.
  da_sapere:
  - La rivalutazione ridotta tocca solo la parte di pensione sopra 6 volte il minimo. Sotto questa soglia non cambia nulla.
  - Dura 5 anni. Può essere prorogata solo con una nuova legge motivata e non si somma ad altri tagli sulla rivalutazione.
  - Non c'è nessun contributo straordinario sulle pensioni.
  - Il risparmio va alle risorse generali del programma. Doveva pagare la prova sul personale infermieristico (06-C2), uscita dopo la verifica delle coperture.
  - La chiusura di Opzione donna riguarda un'uscita usata soprattutto dalle donne. La pensione di garanzia per chi ha carriere discontinue è rinviata.
- id: sud-aree-interne-montagna
  titolo: Chi vive al Sud, in un'area interna o in montagna
  icona: mountain
  chi: Nelle aree interne vivono 13,3 milioni di persone. Nel Mezzogiorno potrebbero scendere da 7,1 a 6,0 milioni entro il 2050 (ISTAT, previsioni 2025).
  in_breve: Nelle aree interne arrivano 500 presidi con più servizi e trasporto a chiamata. Molte misure su nidi, scuole, salute e piccoli Comuni vanno prima dove i servizi mancano.
  in_30_secondi:
    esempi:
    - testo: Con un ISEE fino a 25.000 euro il nido è gratis negli ambiti con meno di 33 posti ogni 100. Al Sud oggi i posti sono 19 ogni 100.
      fonte: programma/varianti/02_lavoro.csv, 02-C2 variante ESSENZIALE (nota con il dato del Sud); ISTAT, Offerta di nidi 2023/24
      stima: false
    - testo: 'Personale medico, infermieristico e docente di ruolo che resta almeno 5 anni nei comuni più lontani riceve un''indennità: in media circa 3.400 euro l''anno.'
      fonte: programma/varianti/04_infrastrutture.csv, 04-P6 variante ESSENZIALE (0,12 mld per circa 35.000 persone); programma/schede/04_infrastrutture.md, art. 4 (importo fissato dal contratto); calcolo GovernAI 120 milioni / 35.000
      stima: true
    - testo: Con un ISEE fino a 15.000 euro lo sconto sul gasolio e sul GPL da riscaldamento resta. Sopra sparisce in 4 anni, con un contributo per la pompa di calore.
      fonte: programma/coperture_menu.csv, SAD10 (l'importo dello sconto per litro non è nei file del repository)
      stima: false
    quando: Il 2027 è di preparazione; nidi, presidi e squadre tecniche partono nel 2028 al 73% della spesa prevista, al 94% nel 2029, tutti dal 2031; gli investimenti con fondi europei vanno dal 2027 al 2029.
  guadagna:
  - proposta: 04-P6
    testo: 'Versione essenziale. Contratti di area nelle 72 aree della Strategia per le aree interne: 500 presidi con più servizi in un solo punto e trasporto a chiamata.'
  - proposta: 04-P6
    testo: Un'indennità per circa 35.000 persone tra personale medico, infermieristico e docente di ruolo che lavora nei comuni più lontani dai servizi.
  - proposta: 02-C2
    testo: 'I nuovi posti al nido, gratis fino a 25.000 euro di ISEE (indicatore della situazione economica), vanno negli ambiti sotto 33 posti ogni 100: soprattutto Sud e aree interne.'
  - proposta: 09-C3
    testo: 3.000 tecniche e tecnici condivisi aiutano i Comuni sotto i 5.000 abitanti del Mezzogiorno e delle aree interne con gare, progetti e informatica.
  - proposta: 07-C1
    testo: Pilota. 1.500 addetti stabili all'Ufficio per il processo in 20 tribunali tra i più lenti, soprattutto nel Mezzogiorno, con un confronto con tribunali simili.
  - proposta: 03-P3
    testo: Versione essenziale. Fondi europei per rifare le reti idriche solo nelle Regioni che perdono più della metà dell'acqua.
  - proposta: 03-P4
    testo: Versione essenziale. Un fondo di 0,6 miliardi l'anno per i Comuni più a rischio di frane e alluvioni. Polizza per la casa con adesione automatica e uscita libera.
  - proposta: 09-C5
    testo: Aiuto a usare i servizi pubblici digitali solo nelle aree interne e nel Mezzogiorno.
  paga:
  - copertura: SAD10
    testo: In montagna e nelle isole lo sconto sul gasolio e sul GPL da riscaldamento sparisce in 4 anni. Al suo posto c'è un contributo per pompe di calore e stufe efficienti.
  - copertura: SAD02
    testo: L'accisa sul gasolio agricolo sale in 5 anni dal 22% al 40% di quella normale. Le aziende di montagna e le piccole aziende hanno un credito per mezzi puliti.
  - copertura: RP01
    testo: Dal 2028 al 2031 ci sono meno posti nei concorsi per profili amministrativi generici di ministeri ed enti nazionali, soprattutto al Sud.
  - copertura: SAD09
    testo: Metà dei contributi agli impianti di risalita diventa un fondo per adattare il turismo di montagna al clima. L'altra metà è risparmiata.
  - copertura: RA51
    testo: I contributi dello Stato alle TV e alle radio locali scendono di un quarto o di un terzo dal 2028. Il resto va solo a chi fa informazione locale con giornalisti assunti; niente a chi trasmette soprattutto televendite.
  da_sapere:
  - Chi ha un ISEE fino a 15.000 euro mantiene lo sconto sul gasolio e sul GPL da riscaldamento.
  - Gli investimenti nelle aree interne, nelle reti idriche e nella ricarica dei camion al Sud sono pagati con fondi europei che finiscono nel 2029.
  - 'Calendario di avvio: le misure del primo gruppo partono nel 2028 al 73% della spesa prevista, alil 94% nel 2029, tutte dal 2031; il 2027 è un anno di preparazione.'
  - Le rotte aeree e marittime di continuità territoriale con le isole non pagano le nuove accise sui carburanti (SAD03, SAD04).
  - Restano fuori i treni per chi viaggia ogni giorno (04-P3) e la casa a canone giusto (04-P2). Resta fuori anche il patto per le opere dopo il PNRR, il Piano nazionale di ripresa (04-P1).
- id: dipendente-reddito-medio
  titolo: Lavoratrice o lavoratore dipendente con un reddito medio
  icona: wallet
  chi: 'Qui: chi lavora da dipendente con circa 1.500-1.800 euro netti al mese, cioè circa 25.000-32.000 euro lordi l''anno. In Italia lavorano circa 24 milioni di persone (Eurostat 2025). Le retribuzioni dei contratti, tolto l''aumento dei prezzi, valgono il 10,2% in meno di gennaio 2021 (settembre 2026, elaborazione GovernAI su dati ISTAT ed Eurostat). Nel repository non c''è un dato su quante persone hanno questo reddito.'
  in_breve: 'Per te il programma cambia poco: nessun euro in più garantito in busta paga, perché detrazione unica e salario di riferimento sono solo regole. Guadagni qualcosa se diventi papà (congedo di un mese, poi due) o se il tuo lavoro può essere sostituito dall''intelligenza artificiale (dote di 900 euro per la formazione).'
  in_30_secondi:
    esempi:
    - testo: In busta paga non arriva nessun euro in più garantito. La detrazione unica per il lavoro unisce tre strumenti a parità di importi; anche la versione piena, non scelta, non cambierebbe nulla sotto i 32.000 euro.
      fonte: programma/selezione_intermedio.md, 01-P9 e 02-C1 in variante ZERO (solo regole); programma/varianti/10_fisco_semplice.csv, 01-P9 (la variante PIENA è a parità di importo fino a 32.000 euro)
      stima: false
    - testo: Se diventi papà e guadagni 2.300 euro lordi al mese, un mese di congedo pagato all'80% vale circa 1.840 euro lordi. Oggi i giorni sono 10.
      fonte: programma/varianti/02_lavoro.csv, 02-C2 variante ESSENZIALE (congedo all'80%); calcolo GovernAI 2.300 × 80% su uno stipendio di esempio
      stima: true
    - testo: 'Dal 2028 non detrai più polizze vita e infortuni e spese veterinarie: oggi il vantaggio medio è di 53 e 45 euro l''anno.'
      fonte: programma/coperture_menu.csv, FN02 (MEF, Rapporto annuale sulle spese fiscali 2025)
      stima: false
    - testo: 'Se fumi un pacchetto al giorno, dal 2029 spendi circa 0,50 euro in più a pacchetto: circa 180 euro l''anno.'
      fonte: programma/coperture_menu.csv, AS01 (circa 0,50 euro a pacchetto, in due tappe nel 2028 e nel 2029); calcolo GovernAI 0,50 × 365 giorni
      stima: true
    quando: Le regole su salario e pensione integrativa partono subito; congedo, dote e dichiarazione già fatta partono nel 2028 al 73% della spesa prevista, al 94% nel 2029, tutti dal 2031; polizze e auto aziendali cambiano dal 2028, le sigarette nel 2028 e nel 2029.
  guadagna:
  - proposta: 02-C1
    testo: 'Solo regole: il salario del contratto più rappresentativo del settore diventa il riferimento per tutte e tutti, anche negli appalti. Conta se oggi ti applicano un contratto firmato da organizzazioni poco rappresentative. Non c''è una soglia fissata per legge.'
  - proposta: 01-P9
    testo: 'Solo regole: le tre voci che oggi riducono l''IRPEF (l''imposta sul reddito) di chi lavora da dipendente diventano una sola formula, con gli stessi importi. Busta paga e dichiarazione diventano più semplici, non più ricche.'
  - proposta: 01-P7
    testo: 'Versione essenziale. Se l''anno prima hai presentato il 730, ricevi la dichiarazione già fatta: vale se non la contesti e i rimborsi sono automatici. Chi lavora e ha solo la Certificazione Unica, senza 730, resta fuori.'
  - proposta: 02-C2
    testo: Versione essenziale. Congedo di paternità da 10 giorni a un mese, poi a due mesi, pagato all'80% dello stipendio e non cedibile. La scheda prevede il 2028 e il 2030, ma con il calendario di avvio le date possono slittare.
  - proposta: 05-C2
    testo: Versione essenziale. Dote di 900 euro per corsi certificati se fai un lavoro che l'intelligenza artificiale può sostituire, o se non hai il diploma. Nei CPIA, i centri per l'istruzione degli adulti, ci sono corsi serali su lettura, calcolo e uso dell'intelligenza artificiale.
  - proposta: 02-C3
    testo: 'Solo regole: chi viene assunto entra in automatico nella pensione integrativa del suo contratto, ma può rinunciare. Si può andare in pensione prima, con una riduzione calcolata sul costo vero dell''anticipo.'
  - proposta: 09-C6
    testo: Versione piena, se lavori in un ufficio pubblico. Ogni ufficio pubblica 3-5 indicatori sul servizio, le valutazioni più alte vanno al massimo al 30% del personale e prima di un procedimento per scarso rendimento c'è un piano di miglioramento. Vietati dati biometrici, riconoscimento delle emozioni e valutazioni automatiche.
  paga:
  - copertura: FN02
    testo: Dal 2028 non si detraggono più i premi delle polizze vita e infortuni e le spese veterinarie. Restano detraibili le polizze per non autosufficienza e disabilità grave.
  - copertura: SAD05
    testo: Se hai un'auto aziendale a benzina o gasolio che usi anche per te, dal 2028 la parte tassata in busta paga sale dal 50% al 60%. Finisce anche il regime transitorio per i contratti firmati prima del 2025.
  - copertura: AS01
    testo: 'Se fumi: circa 0,50 euro in più a pacchetto di sigarette, in due tappe nel 2028 e nel 2029. Sale anche l''accisa su tabacco riscaldato e sigarette elettroniche (AS02).'
  - copertura: PE03
    testo: 'Niente nuove quote né Opzione donna: chi vuole lasciare prima il lavoro lo fa con il calcolo contributivo. Il risparmio è già nelle leggi in vigore.'
  - copertura: RA52
    testo: 'Dal 2029 lo Stato paga ai CAF la metà per i 730 precompilati inviati senza nessuna modifica. C''è il rischio che il CAF ti chieda la differenza. Resta gratuita l''assistenza dell''Agenzia delle entrate.'
  da_sapere:
  - Sotto i 50.000 euro di reddito non cambiano la detrazione del 19% sulle spese sanitarie (SF06), l'imposta ridotta sui premi di produttività (FN04) e la deduzione dei contributi al fondo pensione (SF22).
  - Restano le detrazioni del 19% per le spese di istruzione dei figli e per gli interessi sul mutuo della prima casa, anche per i mutui nuovi: in questo scenario le coperture che le toglierebbero (FN01, FN03) non ci sono.
  - La versione essenziale della detrazione unica, che riduceva il salto di imposta tra 32.000 e 44.000 euro, non è nello scenario. In ogni caso non avrebbe cambiato nulla sotto i 32.000 euro.
  - Il salario minimo con una soglia oraria e più ispettori del lavoro (versioni piena ed essenziale di 02-C1) non è nello scenario.
  - Il congedo retribuito di 40 ore l'anno per formarsi, per chi lavora senza diploma, è solo nella versione piena di 05-C2, che non è nello scenario. Una parte della dote è pagata con fondi europei che finiscono nel 2029.
  - 'Calendario di avvio: congedo, dote e dichiarazione già fatta sono nel primo gruppo. Il 2027 è un anno di preparazione: nel 2028 parte il 73% della spesa prevista, il 94% nel 2029, tutta dal 2031. Le regole per il lavoro pubblico (09-C6) partono solo nel 2031 e sono a pieno nel 2032.'
  - Restano fuori dal programma la casa a canone giusto (04-P2) e i treni per chi viaggia ogni giorno (04-P3).
- id: pensione-bassa
  titolo: Persona con una pensione bassa
  icona: hand-coins
  chi: 'Qui: chi ha una pensione sotto circa 1.000 euro al mese, anche integrata al minimo. Nel repository non c''è ancora un dato ufficiale su quante persone sono in questa situazione. La scheda sul fisco conta 11,3 milioni di persone incapienti: pagano così poca IRPEF, l''imposta sul reddito, che non possono usare le detrazioni.'
  in_breve: 'Per te il programma cambia poco: la pensione non aumenta e la pensione minima resta com''è, ma nessun taglio la tocca. Arrivano più assistenza a casa, Case della Comunità aperte e, se paghi l''IRPEF, la dichiarazione già fatta con rimborsi automatici.'
  in_30_secondi:
    esempi:
    - testo: 'Con una pensione di 900 euro al mese la rivalutazione resta quella di oggi: la riduzione tocca solo la parte di pensione sopra circa 3.700 euro lordi al mese.'
      fonte: programma/coperture_menu.csv, PE04; programma/selezione_intermedio.csv, 02-C8 variante PIENA (correttore solo sulla quota oltre 6 volte il minimo)
      stima: false
    - testo: La pensione minima non aumenta. La pensione di garanzia è rinviata e, nella versione piena, varrebbe solo dal 2036 e per chi ha il primo contributo dopo il 1995.
      fonte: programma/selezione_intermedio.csv, 02-C3 variante ZERO (pensione di garanzia rinviata); programma/schede/02_lavoro.md, 02-C3 art. 4
      stima: false
    - testo: 'Con la sola pensione, la dichiarazione già fatta ti rende in media 10-40 euro l''anno, di più con molte spese mediche. Vale solo se paghi l''IRPEF: se non la paghi, non cambia nulla.'
      fonte: programma/schede/10_fisco_semplice.md, tabella per decili (stima GovernAI per il 30% delle famiglie con il reddito più basso, calcolata sulla versione piena di 01-P7); programma/varianti/10_fisco_semplice.csv, 01-P7 ESSENZIALE (comprende chi ha una pensione e la sola Certificazione Unica)
      stima: true
    - testo: Se vivi in montagna o in un'isola e ti scaldi a gasolio o GPL, con un ISEE fino a 15.000 euro lo sconto resta. Sopra sparisce in 4 anni, con un contributo per la pompa di calore.
      fonte: programma/coperture_menu.csv, SAD10 (l'importo dello sconto per litro non è nei file del repository)
      stima: false
    quando: Il 2027 è di preparazione; dichiarazione già fatta, squadre di quartiere e Case della Comunità partono nel 2028 al 73% della spesa prevista, al 94% nel 2029, tutte dal 2031. La rivalutazione delle pensioni basse non cambia in nessun anno.
  guadagna:
  - proposta: 01-P7
    testo: Versione essenziale. Chi ha solo la pensione e la Certificazione Unica riceve la dichiarazione già fatta. Vale se non la contesta, e i rimborsi sono automatici. Serve solo a chi paga l'IRPEF.
  - proposta: 06-C8
    testo: Versione essenziale. 500 squadre di infermiere e infermieri di quartiere per l'assistenza a casa, nelle Regioni dove oggi ce n'è meno. Sono pagate per le ore di cura, non per le visite.
  - proposta: 06-C3
    testo: 'Versione essenziale. Fondi per far funzionare 1.038 Case della Comunità, con sportello sociale insieme al Comune. Obiettivo: assistenza a casa per il 10% delle persone dai 65 anni in su.'
  - proposta: 06-C4
    testo: Solo in prova, in 20 ambiti territoriali per 3 anni, almeno 10 al Sud. Se non sei più autosufficiente, una sola valutazione del bisogno e un budget di cura.
  - proposta: 06-C1
    testo: 'Solo regole: un''agenda unica per prenotare visite ed esami, anche nel privato accreditato, e una chiamata attiva per non perdere gli appuntamenti.'
  - proposta: 02-C8
    testo: Versione piena, a costo zero. Se la spesa per pensioni supera le previsioni, un correttore riduce per al massimo 3 anni la rivalutazione della sola parte di pensione oltre circa 3.700 euro lordi al mese. Le pensioni basse restano fuori.
  paga:
  - copertura: AS01
    testo: 'Se fumi: circa 0,50 euro in più a pacchetto di sigarette, in due tappe nel 2028 e nel 2029. Con un pacchetto al giorno sono circa 180 euro l''anno, che pesano di più su chi ha un reddito basso.'
  - copertura: FN02
    testo: Dal 2028 non si detraggono più polizze vita e infortuni e spese veterinarie. Tocca solo chi paga abbastanza IRPEF da usare le detrazioni. Restano detraibili le polizze per non autosufficienza e disabilità grave.
  - copertura: SAD10
    testo: In montagna, in Sardegna e nelle isole minori lo sconto sul gasolio e sul GPL da riscaldamento sparisce in 4 anni, con un contributo per pompe di calore e stufe efficienti. Con un ISEE fino a 15.000 euro lo sconto resta.
  - copertura: RA52
    testo: 'Dal 2029 lo Stato paga ai CAF la metà per i 730 precompilati inviati senza nessuna modifica. C''è il rischio che il CAF ti chieda la differenza: pesa di più su chi è anziano o usa poco internet. Resta gratuita l''assistenza dell''Agenzia delle entrate, e con la dichiarazione già fatta (01-P7) il 730 può non servire.'
  da_sapere:
  - 'La pensione minima e le pensioni basse non aumentano: nel programma non c''è nessuna misura che le alzi.'
  - La pensione di garanzia per chi ha carriere discontinue (02-C3) è rinviata a una legge futura con copertura. Anche nella versione piena varrebbe dal 2036 e solo per chi ha il primo contributo dopo il 1995.
  - Il reddito di inclusione universale (02-C4) resta fuori dal programma.
  - Non c'è nessun contributo straordinario sulle pensioni. La rivalutazione ridotta dal 2030 al 2034 (PE04) tocca solo la parte sopra circa 3.700 euro lordi al mese.
  - 'Il budget di cura per tutte e tutti non c''è: c''è solo la prova in 20 ambiti, pagata con fondi europei fino al 2029. Non c''è un rimborso automatico se l''attesa per una visita è troppo lunga.'
  - 'Calendario di avvio: dichiarazione già fatta, squadre di quartiere e Case della Comunità sono nel primo gruppo. Il 2027 è un anno di preparazione: nel 2028 parte il 73% della spesa prevista, il 94% nel 2029, tutta dal 2031.'
  - Restano fuori dal programma la casa a canone giusto (04-P2) e la salute mentale (06-C5).
- id: nati-all-estero
  titolo: Persona nata all'estero che vive e lavora in Italia
  icona: globe
  chi: 'In Italia risiedono circa 5,37 milioni di persone con cittadinanza straniera: 1,37 milioni di altri paesi dell''Unione europea e 4,00 milioni di paesi fuori dall''Unione. Lavorano 2,58 milioni di persone con cittadinanza straniera, il 10,7% di chi lavora (Eurostat 2025). Le famiglie di sole persone straniere sono in povertà assoluta nel 29,4% dei casi, contro il 5,9% delle famiglie di sole persone italiane (ISTAT 2025). Questi dati contano la cittadinanza, non il paese di nascita.'
  in_breve: 'Il programma fa poco di specifico per te: una prova per decidere le domande di asilo in 6 mesi, percorsi per chi arriva tra 16 e 24 anni e una dote di 900 euro per adulti senza diploma. Non interviene su cittadinanza, permessi di soggiorno e riconoscimento dei titoli di studio.'
  in_30_secondi:
    esempi:
    - testo: Se non hai il diploma, o fai un lavoro che l'intelligenza artificiale può sostituire, ricevi una dote di 900 euro per corsi certificati. La scheda non dice come contano i titoli presi all'estero.
      fonte: programma/varianti/05_istruzione.csv, 05-C2 variante ESSENZIALE; programma/schede/05_istruzione.md, 05-C2 (nessuna regola sui titoli esteri)
      stima: false
    - testo: 'Per circa 10.000 ragazze e ragazzi arrivati da poco tra 16 e 24 anni ci sono percorsi ponte di due anni tra CPIA e formazione professionale: circa 3.000 euro di spesa per ogni giovane.'
      fonte: 'programma/varianti/05_istruzione.csv, 05-C1 variante PIENA (nota: ponte CPIA circa 10.000 giovani × 3.000 euro = 0,03 mld); programma/schede/05_istruzione.md, 05-C1 art. 4'
      stima: true
    - testo: La domanda di asilo va decisa entro 6 mesi solo in 3 Commissioni territoriali su circa 40, in prova.
      fonte: 'programma/varianti/07_giustizia.csv, 07-C3 variante PILOTA (nota: 3 Commissioni su circa 40)'
      stima: false
    - testo: 'Il corso di italiano garantito entro 3 mesi dall''arrivo non c''è: era nelle versioni piena ed essenziale di 07-C3, che non sono nello scenario.'
      fonte: programma/varianti/07_giustizia.csv, 07-C3 (corso di italiano solo nelle varianti PIENA ed ESSENZIALE); programma/selezione_intermedio.md (07-C3 PILOTA)
      stima: false
    quando: Il 2027 è di preparazione; la prova sull'asilo, l'Osservatorio, i percorsi ponte e la dote partono nel 2028 al 73% della spesa prevista, al 94% nel 2029, tutti dal 2031. La Strategia demografica è una regola e parte subito.
  guadagna:
  - proposta: 07-C3
    testo: Solo in prova. La domanda di protezione internazionale (asilo) è decisa entro 6 mesi in 3 Commissioni territoriali, con una valutazione. Un Osservatorio indipendente pubblica ogni anno il fabbisogno di lavoro per settore e territorio e quante autorizzazioni al lavoro dall'estero (nulla osta) diventano davvero un contratto.
  - proposta: 05-C1
    testo: Versione piena. Per chi arriva in Italia tra 16 e 24 anni ci sono percorsi ponte tra i CPIA, i centri per l'istruzione degli adulti, e la formazione professionale. Nelle circa 1.500 scuole più fragili lavorano anche mediatrici e mediatori culturali.
  - proposta: 05-C2
    testo: Versione essenziale. Dote di 900 euro per corsi certificati per chi non ha il diploma, per chi ha più di 25 anni e non studia né lavora, e per chi fa un lavoro che l'intelligenza artificiale può sostituire. Nei CPIA ci sono corsi serali su lettura, calcolo e uso dell'intelligenza artificiale.
  - proposta: 02-C6
    testo: 'Solo regole: il Governo adotta una Strategia demografica di dieci anni con obiettivi pubblici e riferisce ogni anno al Parlamento. Secondo la scheda, tra gli obiettivi c''è l''integrazione di lavoratrici e lavoratori con cittadinanza straniera.'
  paga:
  - copertura: AS01
    testo: 'Come per tutte e tutti, se fumi: circa 0,50 euro in più a pacchetto di sigarette, in due tappe nel 2028 e nel 2029.'
  - copertura: FN02
    testo: 'Come per tutte e tutti: dal 2028 non si detraggono più polizze vita e infortuni e spese veterinarie.'
  - copertura: SF20
    testo: 'Cambia solo per chi si trasferisce in Italia dal 2028 e usa il regime per lavoratrici e lavoratori impatriati, pensato per redditi alti: la parte di reddito esente scende dal 50% al 30% (dal 60% al 40% con figli minori) e il tetto da 600.000 a 300.000 euro. Per chi è già nel regime non cambia nulla.'
  da_sapere:
  - 'Il programma non interviene su cittadinanza, permessi di soggiorno e loro rinnovo: nessuna delle 83 proposte tratta questi temi.'
  - Il riconoscimento rapido dei titoli di studio presi all'estero era solo nella versione piena di 02-C6, che non è nello scenario. Lo stesso vale per la programmazione degli ingressi per lavoro ogni tre anni (versione essenziale di 02-C6).
  - Nella versione scelta di 07-C3 restano fuori il corso di italiano entro 3 mesi, l'accoglienza diffusa nei Comuni (sistema SAI), i rimpatri volontari assistiti e le tutrici e i tutori per i minori arrivati soli. Tornano solo con risorse certificate.
  - Il programma stesso indica come una sua lacuna la mancanza di una misura per il lavoro delle persone straniere.
  - La riduzione a due anni del requisito di residenza per l'Assegno di inclusione fa parte del reddito di inclusione universale (02-C4), che resta fuori dal programma.
  - 'Le altre misure, come nido, congedo e Case della Comunità, non sono pensate in modo specifico per chi è nato all''estero: le schede non dicono se cambiano i requisiti di accesso di oggi.'
  - 'I percorsi ponte e una parte della dote sono pagati con fondi europei che finiscono nel 2029. Dopo serve il nuovo ciclo europeo 2028-2034: oggi non è garantito.'
  - 'Calendario di avvio: prova sull''asilo, percorsi ponte e dote sono nel primo gruppo. Il 2027 è un anno di preparazione: nel 2028 parte il 73% della spesa prevista, il 94% nel 2029, tutta dal 2031.'
