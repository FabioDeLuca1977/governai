proposte:
  01-P1:
    perche: "La spesa per interessi sul debito sale dal 3,8% del PIL nel 2025 (87,2 miliardi) al 4,3% nel 2027, oltre 100 miliardi (Eurostat; Ministero dell'economia, Documento programmatico di bilancio 2027). La relazione tecnica di una legge guarda solo a 3 anni: i costi rinviati, come pensioni, bonus edilizi e condoni, restano fuori dalla decisione. Ogni legge approvata senza questo conto lascia impegni alle generazioni più giovani."
    come: "Ogni legge con effetti sopra lo 0,1% del PIL porta una valutazione a 30 anni sul debito e su chi paga per fascia d'età. L'Ufficio parlamentare di bilancio, l'autorità indipendente sui conti pubblici, dà entro 15 giorni un giudizio a semaforo; con il rosso il Governo risponde per iscritto prima del voto, senza diritto di veto. Nel programma intermedio c'è la versione essenziale: il conto sul clima resta all'ecobilancio che esiste già. Si paga tagliando spese di funzionamento del Ministero dell'economia, come consulenze e affitti."
    cosa: "Leggi che dicono prima chi pagherà e quando. Obiettivi: il 100% degli atti sopra soglia con valutazione generazionale entro 3 anni (oggi 0%, 2026) e una risposta scritta del Governo al 100% dei giudizi «non sostenibile». Costo a regime: 0,01 mld €/anno."
    chi: "Decide il Parlamento, modificando le leggi sulle regole di bilancio; attuano Ragioneria generale dello Stato, Ufficio parlamentare di bilancio e ISTAT. Ne beneficiano le generazioni giovani e future e chi vota, che vede i costi nascosti. Perdono margine i governi, che devono motivare in pubblico le misure giudicate non sostenibili; paga il Ministero dell'economia con meno spese di funzionamento."
    oceano_blu:
      eliminare: "Il silenzio sui costi delle leggi oltre i 3 anni della relazione tecnica."
      ridurre: "niente"
      aumentare: "L'orizzonte con cui si valutano le leggi, da 3 a 30 anni."
      creare: "Un giudizio indipendente a semaforo con obbligo di risposta scritta del Governo."
  01-P2:
    perche: "Le agevolazioni fiscali dello Stato sono 573 e valgono 129,7 miliardi nel 2026 (Ministero dell'economia, Rapporto spese fiscali 2025). Il loro numero cresce e nessuna deve dimostrare di funzionare. Il Piano strutturale di bilancio conta già su 7,37 miliardi di riordino, ma non dice come ottenerli."
    come: "Ogni agevolazione riceve una data di scadenza a 5 anni, scaglionata un quinto l'anno. Una Commissione indipendente pubblica per ciascuna una scheda su costo, chi ne beneficia ed efficacia; il Parlamento la rinnova solo con un voto separato e una copertura. Salute, disabilità, carichi familiari e obblighi europei non scadono, ma vengono valutati. Nel programma intermedio c'è la versione piena, pagata con un piccolo taglio alle spese di funzionamento del Ministero dell'economia."
    cosa: "Restano solo le agevolazioni che funzionano e si ottiene il riordino già promesso all'Europa. Obiettivi: da 573 a non più di 490 agevolazioni in 3 anni e non più di 400 in 5; almeno metà dei 7,37 miliardi di riordino in 3 anni e tutto in 5. Costo a regime: 0,01 mld €/anno."
    chi: "Decidono Parlamento e Governo con una legge delega e un decreto legislativo; attuano il Dipartimento delle finanze e l'Agenzia delle entrate, che fornisce dati anonimi. Ne beneficiano chi paga le tasse e i conti pubblici. Perde chi oggi gode di agevolazioni senza risultati dimostrati; i settori interessati dovranno difenderle con dati, davanti al Parlamento."
    oceano_blu:
      eliminare: "Il rinnovo automatico, senza voto, delle agevolazioni che non danno risultati."
      ridurre: "Il numero delle agevolazioni fiscali, da 573 a non più di 400 in 5 anni."
      aumentare: "La trasparenza: una scheda pubblica di costo, beneficiari ed efficacia per ogni agevolazione."
      creare: "Una scadenza per legge per ogni agevolazione, con rinnovo solo per voto esplicito e con copertura."
  01-P3:
    perche: "Il buco dell'IVA, cioè l'imposta dovuta e non versata, vale 34,4 miliardi nel 2023, 3,6 in più del 2022 (Ministero dell'economia, Relazione evasione 2026). È la parte più grande dell'evasione, che in tutto vale 107,9-112,8 miliardi. Le frodi con società fittizie fanno sparire il denaro prima dei controlli."
    come: "L'Agenzia delle entrate incrocia dati che ha già (fatture elettroniche, scontrini telematici, pagamenti elettronici) e può sospendere fino a 30 giorni i crediti IVA sospetti, sempre con la decisione di una persona e diritto di replica entro 10 giorni. Chi è affidabile ha rimborsi più rapidi e per tutta la legislatura nessun condono è ammesso. Nel programma intermedio c'è la versione essenziale, senza le estensioni che richiedono il via libera europeo. Si paga tagliando spese di funzionamento del Ministero dell'economia e delle agenzie fiscali; il gettito recuperato riduce il deficit, non finanzia nuova spesa."
    cosa: "Meno frodi e rimborsi più veloci per chi è in regola. Obiettivi: buco IVA a non più di 32 miliardi in 3 anni e 28,5 in 5; rimborsi agli affidabili entro 90 giorni in 3 anni ed entro 60 in 5; zero condoni. Costo a regime: 0,08 mld €/anno."
    chi: "Decide il Parlamento con una legge; attuano Ministero dell'economia, Agenzia delle entrate e Sogei, sentito il Garante per la protezione dei dati personali. Ne beneficiano le imprese oneste, che non subiscono concorrenza sleale, e chi paga le tasse. Paga chi frode l'IVA; chi aspettava un condono non lo avrà."
    oceano_blu:
      eliminare: "I condoni e le definizioni agevolate per tutta la legislatura."
      ridurre: "I controlli sui contribuenti affidabili."
      aumentare: "La velocità: crediti sospetti bloccati prima che il denaro sparisca e rimborsi più rapidi a chi è in regola."
      creare: "Un sistema di analisi del rischio IVA in tempo quasi reale, con decisione umana e audit annuale."
  01-P4:
    perche: "Il 60,0% di chi lavora sta in imprese con meno di 50 addetti, contro il 41,6% in Francia e il 39,4% in Germania (Eurostat 2024). La produttività del lavoro è cresciuta dello 0,3% l'anno tra il 1995 e il 2024, contro l'1,5% dell'Unione europea (ISTAT 2025). Gli obblighi che scattano a 15 e 50 addetti scoraggiano le imprese dal crescere."
    come: "Chi supera 15 o 50 addetti avrebbe tre anni per adeguarsi agli obblighi amministrativi, mentre salute, sicurezza e diritti sindacali restano pieni da subito. Un premio di crescita, con un tetto di spesa, andrebbe solo alle imprese tra 10 e 49 addetti che crescono, si fondono o fanno rete, con uno sportello unico. La proposta non entra nel programma intermedio: non viene scelta in nessuna combinazione di pesi tra i valori. Si pagherebbe riducendo la parte generica dell'agevolazione sugli investimenti e incentivi a bassa efficacia."
    cosa: "Più imprese che crescono e più produttività. Obiettivi: quota di occupati nelle imprese sotto 50 addetti a non più del 59,3% in 3 anni e del 58,5% in 5; produttività per ora lavorata (indice 2015=100) da 100,4 a 104 in 5 anni. Nel programma intermedio il costo è zero perché la proposta è esclusa; la versione piena costerebbe 2,5 mld €/anno, quella essenziale 0,6."
    chi: "Deciderebbero il Parlamento e il Ministero delle imprese, con le parti sociali; attuerebbero Invitalia e Agenzia delle entrate. Ne beneficerebbero le piccole imprese che vogliono crescere e chi ci lavora. Pagherebbero le imprese che oggi usano agevolazioni sugli investimenti senza condizioni; chi lavora non perderebbe diritti."
    oceano_blu:
      eliminare: "Il salto immediato di obblighi amministrativi quando si superano 15 o 50 addetti."
      ridurre: "La parte generica, senza condizioni, dell'agevolazione sugli investimenti (iperammortamento)."
      aumentare: "Il sostegno alle imprese tra 10 e 49 addetti che crescono, si fondono o fanno rete."
      creare: "Un regime transitorio di tre anni e uno sportello digitale unico «Impresa che cresce»."
  01-P5:
    perche: "Il prezzo medio all'ingrosso dell'elettricità è 115,32 euro per megawattora nel 2025, contro 108,52 nel 2024 (Gestore dei mercati energetici). Il sostegno temporaneo all'energia delle imprese costa 1,7 miliardi ogni anno in cui si rinnova e non cambia il modo in cui si forma il prezzo. Le piccole imprese restano fuori dai contratti di lungo periodo perché il rischio che non paghino è considerato troppo alto."
    come: "Il Gestore dei servizi energetici mette all'asta contratti di 10-15 anni tra gruppi di piccole e medie imprese e nuovi impianti rinnovabili. Una garanzia pubblica copre le prime perdite, fino al 15%, se un'impresa non paga. Nel programma intermedio c'è la versione essenziale: solo consorzi e distretti che consumano molta energia (ceramica, carta, vetro, metalli, agroalimentare), con un fondo di 0,4 miliardi in 3 anni. Si paga con fondi europei di coesione 2021-2027, una tantum."
    cosa: "Energia a prezzo stabile e nuovi impianti rinnovabili. Obiettivi: 0,5 gigawatt contrattualizzati e 1.000 imprese aderenti in 3 anni, 1,5 gigawatt e 4.000 imprese in 5; prezzo pagato almeno il 10% sotto quello di mercato in 3 anni. Costo a regime: 0,15 mld €/anno nel 2027-2029, poi molto meno perché il fondo è rotativo."
    chi: "Decidono il Ministero dell'ambiente e della sicurezza energetica e il Ministero delle imprese con un decreto; attuano il Gestore dei servizi energetici e il Fondo di garanzia per le piccole e medie imprese, con le Regioni per i fondi europei. Ne beneficiano le piccole e medie imprese dei distretti energivori e chi ci lavora. Pagano i fondi europei di coesione, che non vanno ad altri progetti; per ora restano fuori commercio e servizi."
    oceano_blu:
      eliminare: "niente"
      ridurre: "Il ricorso ai bonus temporanei in bolletta, sostituiti da uno strumento stabile."
      aumentare: "L'accesso delle piccole e medie imprese ai contratti di lungo periodo sulle rinnovabili."
      creare: "Aste pubbliche per contratti di gruppo e una garanzia pubblica sulle prime perdite."
  01-P6:
    perche: "Luglio e agosto concentrano il 34,5% delle presenze turistiche dell'anno e i mesi da giugno a settembre il 56,9% (Eurostat 2024). Nei luoghi più visitati la pressione ricade su casa, trasporti e servizi di chi ci abita. Senza regole, il gettito dell'imposta di soggiorno non torna per forza ai residenti."
    come: "I Comuni ad alta intensità turistica possono modulare l'imposta di soggiorno per stagione e zona, entro un tetto nazionale, con una riduzione di almeno un terzo in bassa stagione. Almeno metà del gettito va a trasporto locale, case a canone calmierato, rifiuti e manutenzione, con rendiconto pubblico; i dati anonimi sugli affitti brevi diventano pubblici. Nel programma intermedio c'è la versione a costo zero: solo regole, senza il patto con le Regioni."
    cosa: "Turismo più distribuito nell'anno e benefici per chi ci abita. Obiettivi: presenze in luglio e agosto dal 34,5% al 33,5% in 3 anni e al 32,0% in 5; almeno il 50% del gettito ai servizi per i residenti; 50 Comuni con tariffa modulata in 3 anni e 150 in 5. Costo a regime per lo Stato: 0 mld €/anno."
    chi: "Decide il Parlamento, con un tetto fissato dal Ministero dell'economia d'intesa con i Comuni; attuano i Comuni e il Ministero del turismo, che pubblica i dati. Ne beneficiano le persone che vivono nei luoghi più turistici. Paga di più chi viaggia in alta stagione nei Comuni che scelgono di alzare la tariffa; chi viaggia in bassa stagione paga meno."
    oceano_blu:
      eliminare: "niente"
      ridurre: "L'imposta di soggiorno in bassa stagione, di almeno un terzo."
      aumentare: "La quota del gettito che torna a chi abita nel territorio, almeno il 50%, con rendiconto pubblico."
      creare: "Tariffe modulate per stagione e zona e dati pubblici anonimi sugli affitti brevi."
  01-P7:
    perche: "Su 42,8 milioni di contribuenti solo il 4% circa accetta il 730 precompilato senza modifiche (stima GovernAI su dati Agenzia delle entrate). I 9,2 milioni di persone che non presentano la dichiarazione perdono spesso detrazioni già note al fisco. In Danimarca l'80% delle persone non deve toccare il conto annuale preparato dallo Stato."
    come: "L'Agenzia delle entrate manda un conto fiscale di una pagina con redditi, detrazioni già note, imposta e rimborso o debito. Se non si risponde entro il 30 giugno il conto diventa definitivo (silenzio-assenso) e il rimborso arriva in automatico entro luglio; chi deve correggere lo fa online, al centro di assistenza fiscale o allo sportello. Nel programma intermedio c'è la versione essenziale: vale per chi ha presentato il 730 l'anno prima e per chi ha solo la pensione con la certificazione unica. Si paga con il riordino delle agevolazioni fiscali e un piccolo taglio di spese di funzionamento."
    cosa: "Meno tempo perso e rimborsi a chi ne ha diritto. Obiettivi: chi chiude senza modifiche dal 4% al 40% in 3 anni e al 60% in 5; rimborsi entro il 31 luglio per il 70% dei casi in 3 anni e il 90% in 5. Costo a regime: 0,15 mld €/anno, soprattutto crediti oggi persi che tornano alle persone."
    chi: "Decide il Parlamento con una legge; attua l'Agenzia delle entrate con i centri di assistenza fiscale. Ne beneficiano i circa 25 milioni di persone che usano il 730 e chi è in pensione con spese mediche ma oggi non dichiara. Per ora resta fuori chi lavora, ha la sola certificazione unica e non dichiara; il costo pesa sulle risorse del riordino delle agevolazioni."
    oceano_blu:
      eliminare: "La dichiarazione da compilare per chi ha solo redditi già noti al fisco e accetta il conto."
      ridurre: "Il lavoro di carta: chi corregge usa un modulo di una pagina."
      aumentare: "I rimborsi automatici entro luglio, anche per chi è in pensione e oggi perde detrazioni."
      creare: "Un conto fiscale annuale preparato dallo Stato, con silenzio-assenso."
  01-P8:
    perche: "Molte detrazioni del 19% valgono poche decine di euro a persona: 44,5 euro per le spese veterinarie e 53,4 euro per le assicurazioni vita e infortuni (Ministero dell'economia, Rapporto spese fiscali 2025). Ognuna chiede documenti e controlli e impedisce la dichiarazione automatica. Non arrivano agli 11,3 milioni di persone con un reddito troppo basso per usarle."
    come: "Dal 2028 si aboliscono le detrazioni del 19% per i premi delle assicurazioni vita e infortuni e per le spese veterinarie; restano quelle per non autosufficienza e disabilità grave. Nel programma intermedio c'è la versione a costo zero: le detrazioni per istruzione e per gli interessi sui mutui restano, e non c'è la quota studio nell'Assegno unico. È solo regole; il risparmio entra nelle coperture del programma."
    cosa: "Meno scontrini da conservare e una dichiarazione più vicina all'automatico. Obiettivo: agevolazioni sull'imposta sul reddito da 196 a 185 in 3 anni e a non più di 170 in 5, insieme al riordino della proposta 01-P2. Costo a regime: 0 mld €/anno; la misura produce risparmi che finanziano altre proposte."
    chi: "Decide il Parlamento con la legge di bilancio; attua l'Agenzia delle entrate. Ne beneficiano chi dichiara, con meno documenti, e il conto automatico della proposta 01-P7. Perdono la detrazione circa 5,3 milioni di persone con assicurazioni vita e infortuni e circa 1,7 milioni con spese veterinarie: poche decine di euro l'anno a testa."
    oceano_blu:
      eliminare: "Le detrazioni del 19% per assicurazioni vita e infortuni e per spese veterinarie."
      ridurre: "I documenti da conservare e da controllare per la dichiarazione."
      aumentare: "niente"
      creare: "niente"
  01-P9:
    perche: "Tra 32.000 e 40.000 euro di reddito chi lavora come dipendente paga circa 54 centesimi di imposta su ogni euro in più nel 2026, più di chi guadagna 100.000 euro (Osservatorio conti pubblici italiani; stima GovernAI). La causa sono tre strumenti sovrapposti, introdotti in anni diversi. Le buste paga si complicano e la progressività diventa disordinata."
    come: "La detrazione da lavoro, la somma esente e l'ulteriore detrazione di 1.000 euro diventano un'unica detrazione per il lavoro, con una sola formula. Nel programma intermedio c'è la versione a costo zero: gli importi restano uguali per tutti e lo scalino tra 32.000 e 40.000 euro resta. È solo regole."
    cosa: "Buste paga e dichiarazioni più semplici. Obiettivo: da 3 strumenti di detrazione per il lavoro a 1. Con questa versione l'aliquota effettiva massima resta circa al 54%: per scendere al 47-50% servono le versioni piena o essenziale. Costo a regime: 0 mld €/anno."
    chi: "Decide il Parlamento con la legge di bilancio; attuano l'Agenzia delle entrate e chi paga gli stipendi, che usa una sola formula. Ne beneficiano chi lavora come dipendente e gli uffici del personale, con meno calcoli. Nessuno perde importi; chi guadagna tra 32.000 e 40.000 euro non ha ancora il taglio dello scalino."
    oceano_blu:
      eliminare: "Due dei tre strumenti sovrapposti di detrazione per il lavoro."
      ridurre: "I calcoli in busta paga, con una sola formula."
      aumentare: "niente"
      creare: "Un'unica detrazione per il lavoro."
  01-P10:
    perche: "Sui redditi di lavoro autonomo e d'impresa l'imposta evasa è di 38,4 miliardi nel 2023, il 59,7% di quella dovuta (Relazione evasione 2026). Il buco dei contributi è di 9,2-12,7 miliardi e cresce. Dove il fisco usa bene i dati che ha, con garanzie, i risultati ci sono: 0,51 miliardi di maggiore imposta accertata nel 2025 dall'archivio dei rapporti finanziari."
    come: "Agenzia delle entrate, istituto di previdenza (INPS) e Ispettorato del lavoro incrociano solo dati che già possiedono per legge, per trovare le incongruenze più gravi. Il primo passo è sempre una lettera che permette di correggere con sanzioni ridotte; l'accertamento arriva dopo, con contraddittorio, e uno Statuto delle garanzie vieta la sorveglianza di massa. Nel programma intermedio c'è la versione essenziale: imposta sul reddito di autonomi e imprese e contributi, senza catasto, IMU e dati esteri. Si paga con un taglio di spese di funzionamento."
    cosa: "Meno evasione con controlli mirati e garantiti. Obiettivi: evasione di autonomi e imprese dal 59,7% al 57% dell'imposta dovuta in 3 anni e al 55% in 5; buco dei contributi -5% in 3 anni e -10% in 5; 100% dei modelli di rischio in un registro pubblico, con valutazione d'impatto e audit. Costo a regime: 0,06 mld €/anno; il maggior gettito atteso non è contato come copertura."
    chi: "Decide il Parlamento con una legge; attuano Agenzia delle entrate, INPS e Ispettorato del lavoro, sotto il controllo del Garante per la protezione dei dati personali. Ne beneficiano chi paga il giusto e le imprese oneste. Paga chi evade redditi o contributi; chi è in regola ha garanzie scritte contro errori e profilazione."
    oceano_blu:
      eliminare: "niente"
      ridurre: "I controlli a pioggia su chi è in regola."
      aumentare: "I controlli mirati sulle incongruenze più gravi, con una lettera per correggere prima dell'accertamento."
      creare: "Uno Statuto delle garanzie con registro pubblico dei modelli di rischio e audit."
  01-P11:
    perche: "Nel rapporto tra impresa e cliente finale l'evasione passa dallo scontrino non emesso: qui si concentrano l'evasione del lavoro autonomo (59,7% dell'imposta dovuta) e una parte del buco IVA (20,3%) (Relazione evasione 2026). Il cashback di Stato è stato sospeso nel 2021. La lotteria degli scontrini, attiva dal 2021, non ha mai avuto una valutazione pubblica d'impatto."
    come: "Nel programma intermedio c'è la versione a costo zero: una valutazione indipendente entro 12 mesi di lotteria degli scontrini e cashback, con i dati delle agenzie fiscali, e la chiusura della lotteria se l'effetto netto è nullo. Si aggiunge un accordo con gli operatori dei pagamenti elettronici sulle piccole spese. È solo regole: lo sconto fiscale mirato per chi chiede la fattura nei settori a rischio arriva solo con le versioni più ampie."
    cosa: "Decisioni basate sui dati e niente spesa per incentivi che non funzionano. La valutazione va pubblicata; nella misura completa la regola è che ogni euro speso deve far emergere più di un euro di gettito, altrimenti l'incentivo decade. Costo a regime: 0 mld €/anno."
    chi: "Decidono il Ministero dell'economia e le agenzie fiscali con un atto amministrativo; la valutazione è indipendente. Ne beneficiano i conti pubblici e chi paga le tasse. Può perdere chi partecipa alla lotteria degli scontrini, se la valutazione porta a chiuderla."
    oceano_blu:
      eliminare: "La lotteria degli scontrini, se la valutazione mostra un effetto nullo."
      ridurre: "niente"
      aumentare: "La conoscenza: una valutazione indipendente e pubblica di lotteria e cashback."
      creare: "Un accordo sui pagamenti elettronici per le piccole spese."
  01-P12:
    perche: "Circa 17 miliardi di buco fiscale nel 2023, il 17% del totale, non sono evasione nascosta ma imposte dichiarate e non pagate (Relazione evasione 2026). Nel 2019 erano il 15%. I condoni ripetuti insegnano ad aspettare il prossimo."
    come: "Per le piccole partite IVA registri, liquidazioni e dichiarazione sono preparati dal fisco a partire da fatture e scontrini: chi lavora conferma o corregge. La rateazione diventa automatica online, i crediti che non si possono più riscuotere escono dal magazzino e lo sforzo va su quelli recuperabili; niente condoni. Nel programma intermedio c'è la versione essenziale, senza l'accordo semplificato per le medie imprese. Si paga con un taglio di spese di funzionamento."
    cosa: "Pagare diventa più facile e riscuotere più rapido. Obiettivi: imposte dichiarate e non versate dal 17% al 16% del buco fiscale in 3 anni e al 15% in 5; almeno il 30% delle piccole partite IVA con la precompilata in 3 anni e il 60% in 5; zero condoni. Costo a regime: 0,04 mld €/anno; il gettito atteso non è contato come copertura."
    chi: "Decide il Parlamento con una legge; attuano Agenzia delle entrate e Agenzia delle entrate-Riscossione. Ne beneficiano le piccole partite IVA, con meno adempimenti, e chi paga puntuale. Perde chi contava su un nuovo condono."
    oceano_blu:
      eliminare: "I condoni e i crediti che non si possono più riscuotere tenuti nel magazzino."
      ridurre: "Gli adempimenti delle piccole partite IVA."
      aumentare: "La riscossione dei crediti davvero recuperabili, con rateazione automatica online."
      creare: "La precompilata IVA e dei redditi per forfettari e piccole imprese in contabilità semplificata."
  01-P13:
    perche: "Le imprese italiane spendono in ricerca e sviluppo lo 0,80% del PIL, contro l'1,50% dell'Unione europea (Eurostat 2024). Il sostegno passa da due strumenti sovrapposti: il credito d'imposta per la ricerca (1.823 milioni l'anno) e il patent box (283 milioni), che va soprattutto alle imprese con almeno 500 addetti (Ministero dell'economia 2025; ISTAT 2023). Le regole cambiano quasi ogni anno e i recuperi a distanza di anni hanno creato molto contenzioso."
    come: "Un solo credito per la ricerca con regole fisse per 5 anni: 10% per tutte le imprese, 13% sotto i 50 addetti, rimborso in denaro entro 90 giorni alle giovani imprese senza imposte da compensare. Il progetto si può far certificare prima di spendere, e la certificazione vincola il fisco; il patent box si chiude in due anni e paga il credito più forte. La proposta non entra nel programma intermedio: non viene scelta in nessuna combinazione di pesi tra i valori."
    cosa: "Più ricerca nelle piccole imprese e meno contenzioso. Obiettivi: spesa delle imprese in ricerca dallo 0,80% allo 0,85% del PIL in 3 anni e allo 0,90% in 5; metà del credito coperta da certificazione preventiva in 3 anni. Nel programma intermedio il costo è zero perché la proposta è esclusa; la versione piena costerebbe 0,30 mld €/anno, quasi tutto coperto dalla chiusura del patent box."
    chi: "Deciderebbero Parlamento e Governo con la legge di bilancio e un testo unico; attuerebbero il Ministero delle imprese, i certificatori iscritti all'albo e l'Agenzia delle entrate. Ne beneficerebbero le imprese sotto i 50 addetti e le giovani imprese innovative. Perderebbero le imprese, in prevalenza grandi, che oggi usano il patent box."
    oceano_blu:
      eliminare: "Il patent box, sovrapposto al credito per la ricerca."
      ridurre: "Il contenzioso e i recuperi a distanza di anni."
      aumentare: "Il credito per le imprese sotto i 50 addetti, dal 10% al 13%."
      creare: "La certificazione del progetto prima di spendere, vincolante per il fisco, con un portale unico."
  01-P14:
    perche: "Dal 2019 il programma nazionale di appalti per l'innovazione ha avuto in tutto circa 93 milioni di euro (Agenzia per l'Italia digitale). Nel 2026 il Consiglio dell'Unione europea raccomanda all'Italia di rafforzare gli appalti per l'innovazione. Manca anche una misura nazionale coerente della spesa pubblica in innovazione (CNR 2024)."
    come: "Le amministrazioni pubblicano sfide, cioè problemi concreti senza soluzione sul mercato, e le imprese competono in tre fasi: fattibilità, prototipo, acquisto. Le imprese tengono la proprietà intellettuale e lo Stato ha una licenza d'uso gratuita. Nel programma intermedio c'è la versione pilota: 3 sfide (salute, protezione civile, energia) nel 2027-2029, con valutazione. Si paga con fondi europei di coesione 2021-2027, in modo temporaneo; si prosegue solo se la valutazione è positiva."
    cosa: "Soluzioni nuove per i servizi pubblici e un mercato per le imprese innovative. Obiettivi della misura completa: 150 milioni l'anno di contratti per l'innovazione in 3 anni e 200 in 5; il 25% delle soluzioni di fase 2 acquistate da un'amministrazione entro 2 anni; almeno il 60% di piccole e medie imprese tra i vincitori della prima fase. Costo a regime della versione pilota: 0,03 mld €/anno, fino al 2029."
    chi: "Decidono con un accordo l'Agenzia per l'Italia digitale, il Ministero delle imprese e il Ministero dell'università, con la riprogrammazione dei fondi europei; l'Agenzia fa da centrale d'acquisto. Ne beneficiano le persone che usano i servizi pubblici e le imprese innovative, soprattutto piccole. Pagano i fondi europei di coesione, che non vanno ad altri progetti."
    oceano_blu:
      eliminare: "niente"
      ridurre: "niente"
      aumentare: "La quota di contratti per l'innovazione che va alle piccole e medie imprese, almeno il 60% nella prima fase."
      creare: "Le sfide pubbliche in tre fasi: fattibilità, prototipo e acquisto."
  01-P15:
    perche: "Nel 2023 università ed enti pubblici di ricerca hanno creato 86 imprese nate dalla ricerca (spin-off), contro 108 nel 2022 (Netval 2025). Il capitale di rischio investe circa lo 0,07% del PIL nel 2025, contro lo 0,22% della Francia e lo 0,15% della Germania (EY 2025, fonte privata). Manca un regolamento nazionale unico per gli spin-off."
    come: "Nel programma intermedio c'è la versione a costo zero, solo regole: un regolamento tipo nazionale per gli spin-off (quota dell'ateneo tra il 5% e il 10%, licenza standard, decisione entro 60 giorni) e un congedo fino a tre anni, con diritto di rientro, per chi fa ricerca e fonda un'impresa. Il fondo di fondi per le tecnologie avanzate e le prove di fattibilità arrivano solo con le versioni più ampie."
    cosa: "Più imprese nate dalla ricerca pubblica. Obiettivo: spin-off da 86 l'anno (2023) a 110 in 3 anni e 130 in 5. Questa versione toglie ostacoli ma non aggiunge capitale. Costo a regime: 0 mld €/anno."
    chi: "Decide il Ministero dell'università con un decreto; attuano università ed enti pubblici di ricerca. Ne beneficiano ricercatrici e ricercatori che vogliono fondare un'impresa e gli atenei, che hanno regole chiare. Nessuno paga in denaro; gli atenei perdono un po' di libertà nel fissare le proprie condizioni."
    oceano_blu:
      eliminare: "niente"
      ridurre: "I tempi di decisione degli atenei sugli spin-off, entro 60 giorni."
      aumentare: "niente"
      creare: "Un regolamento tipo nazionale e un congedo con diritto di rientro per chi fonda uno spin-off."
  01-P16:
    perche: "Nel 2025 la spesa netta è cresciuta dell'1,5%, contro un tetto europeo dell'1,3% (Commissione europea). La deviazione accumulata vale circa 2,4 miliardi, lo 0,1% del PIL (Ufficio parlamentare di bilancio). Il tetto europeo vale per il totale, ma nessuna regola nazionale dice a ogni ministero quanto può spendere in tre anni."
    come: "La legge di bilancio fissa per tre anni un tetto di spesa netta per ogni ministero, coerente con il percorso europeo. Una parte resta come riserva per gli imprevisti (dallo 0,05% del PIL nel 2028 allo 0,15% dal 2030) e le entrate superiori alle previsioni che non derivano da nuove leggi vanno a ridurre deficit e debito. Superare un tetto richiede una legge motivata e una nota dell'Ufficio parlamentare di bilancio. Nel programma intermedio c'è la versione piena, pagata con spese di funzionamento del Ministero dell'economia."
    cosa: "Conti in ordine e ministeri che sanno prima quanto avranno. Obiettivi: crescita della spesa netta entro il tetto europeo ogni anno; almeno l'80% dei ministeri entro il proprio tetto in 3 anni e tutti in 5, salvo deroga votata; 100% delle entrate inattese a ridurre il deficit. Costo a regime: 0,003 mld €/anno."
    chi: "Decide il Parlamento con una legge approvata a maggioranza assoluta; attua la Ragioneria generale dello Stato con un controllo ogni tre mesi. Ne beneficiano le generazioni giovani e chi pagherà gli interessi futuri. Perdono flessibilità il Parlamento in sessione di bilancio, i ministeri che oggi ottengono fondi in corso d'anno e chi chiede tagli di tasse pagati con entrate inattese."
    oceano_blu:
      eliminare: "L'uso delle entrate inattese per nuove spese o tagli di tasse."
      ridurre: "La spesa aggiunta in corso d'anno fuori dai tetti."
      aumentare: "La programmazione: ogni ministero conosce il proprio tetto per tre anni."
      creare: "Tetti di spesa per ministero e una riserva per gli imprevisti."
  01-P17:
    perche: "L'Ufficio parlamentare di bilancio può avere al massimo 40 persone e 6 milioni l'anno (legge 243/2012). L'autorità spagnola equivalente ha esaminato 108 miliardi di spesa nel primo ciclo di revisioni 2018-2021. In Italia il principio «rispetta o spiega» vale solo per le previsioni economiche, non per le raccomandazioni sulla spesa."
    come: "L'Ufficio parlamentare di bilancio rivede ogni anno 2-3 aree di spesa (15-25 miliardi) e propone opzioni, non scelte. Le amministrazioni rispondono alle sue richieste di dati entro 30 giorni e il Governo risponde entro 3 mesi a ogni raccomandazione: la accetta o spiega perché no. Ogni forza politica, se vuole, può chiedere una stima pubblica dei costi e delle coperture del proprio programma, con un metodo unico. Nel programma intermedio c'è la versione piena, con circa 30 persone in più, pagata con spese di funzionamento."
    cosa: "Spesa pubblica più efficace e promesse elettorali confrontabili. Obiettivi: almeno 30 miliardi di spesa esaminata in 3 anni e 60 in 5; risposta motivata del Governo al 100% delle raccomandazioni; almeno 3 forze politiche che chiedono la stima alle prime elezioni utili. Costo a regime: 0,006 mld €/anno; i risparmi delle revisioni non sono contati finché non sono tagliati per legge."
    chi: "Decide il Parlamento con una legge approvata a maggioranza assoluta; attuano l'Ufficio parlamentare di bilancio e la Ragioneria generale dello Stato. Ne beneficiano chi paga le tasse, chi usa i servizi, chi vota e il Parlamento. Perdono chi riceve spese senza risultati dimostrati, il Governo, che non controlla più da solo i numeri, e le forze politiche che promettono senza coperture."
    oceano_blu:
      eliminare: "niente"
      ridurre: "Il controllo esclusivo del Governo sui numeri della spesa."
      aumentare: "Le persone e i poteri dell'Ufficio parlamentare di bilancio, con accesso ai dati entro 30 giorni."
      creare: "Revisioni indipendenti della spesa, l'obbligo di «rispetta o spiega» e la stima volontaria dei programmi elettorali."
  01-P18:
    perche: "L'indicatore della situazione economica (ISEE) si calcola sui redditi di due anni prima. Chi perde il lavoro o ha redditi che cambiano riceve Assegno unico e Assegno di inclusione calcolati su una situazione vecchia, salvo domanda di ISEE corrente. L'Assegno di inclusione raggiunge 690 mila nuclei (INPS, giugno 2026)."
    come: "A regime chi paga gli stipendi trasmetterebbe ogni mese redditi e ritenute in un solo flusso, condiviso tra Agenzia delle entrate e INPS, con accessi tracciati e visibili alla persona. Nel programma intermedio c'è la versione pilota: si usano i dati mensili che l'INPS riceve già sui contributi per aggiornare l'Assegno di inclusione, con una valutazione. Servono una base di legge e una valutazione d'impatto sulla privacy; si paga con spese di funzionamento."
    cosa: "Prestazioni giuste nel momento giusto e meno somme da restituire. Obiettivi: ritardo tra cambio di reddito e aggiornamento dell'Assegno di inclusione da fino a 24 mesi a non più di 2 mesi in 3 anni; importi pagati in eccesso e poi recuperati -30% in 3 anni. Costo a regime: 0,005 mld €/anno."
    chi: "Decide il Ministero del lavoro con un decreto, su autorizzazione di legge; attuano INPS e Agenzia delle entrate, con il parere del Garante per la protezione dei dati personali. Ne beneficiano le famiglie con redditi variabili o che perdono il lavoro. Nella versione pilota i datori di lavoro non hanno obblighi nuovi, perché si usano dati già trasmessi; il prezzo è una maggiore concentrazione di dati personali, che richiede garanzie forti."
    oceano_blu:
      eliminare: "niente"
      ridurre: "Il ritardo tra cambio di reddito e aggiornamento dell'Assegno di inclusione."
      aumentare: "L'uso dei dati mensili che l'INPS riceve già."
      creare: "Un aggiornamento mensile della prestazione senza nuova domanda."
  01-P19:
    perche: "Un dividendo incassato da una persona paga il 26%; incassato dalla sua società holding paga l'1,2% (Testo unico delle imposte sui redditi, articoli 87 e 89). Se la holding non distribuisce mai, alla morte del socio l'imposta rinviata può sparire. Nessuna fonte ufficiale dice quanto valga questo canale."
    come: "Per le holding personali passive (controllate da non più di 5 persone o famiglie, con almeno il 60% di proventi da investimenti e oltre 2 milioni di attivo passivo) gli utili incassati dopo la legge, non distribuiti entro 12 mesi né reinvestiti entro 3 anni, pagano il 26%, come se si possedesse direttamente. Restano fuori le riserve già formate, i dividendi delle società operative, i reinvestimenti nelle imprese e una riserva per acquisizioni e crisi; i primi 100.000 euro l'anno sono esenti. Nel programma intermedio c'è la versione piena; i controlli costano poco e il gettito entra nelle coperture del programma."
    cosa: "La stessa imposta sullo stesso reddito, senza penalizzare chi investe nelle imprese. Obiettivi: dati annuali pubblici su holding passive e utili trattenuti; utili distribuiti ai soci +20% in 3 anni e +30% in 5; prima misura ufficiale dell'aliquota effettiva dello 0,1% più ricco. Costo a regime: 0,011 mld €/anno per controlli e sistemi."
    chi: "Decide il Parlamento con la legge di bilancio; attuano Agenzia delle entrate e Sogei. Ne beneficiano i conti pubblici e chi oggi paga il 26% possedendo direttamente. Pagano le famiglie con patrimoni finanziari di diversi milioni in holding che, dopo la legge, incassano proventi passivi e non li reinvestono; non paga chi ha un'impresa operativa, chi reinveste o chi sta sotto le soglie."
    oceano_blu:
      eliminare: "La possibilità di rinviare per sempre l'imposta tenendo gli utili passivi nella holding."
      ridurre: "La differenza di imposta tra possedere direttamente e possedere tramite holding passiva."
      aumentare: "La certezza per chi è in buona fede, con interpello preventivo."
      creare: "Un'imposta del 26% sugli utili passivi trattenuti, con una riserva esente per acquisizioni e crisi."
  01-P21:
    perche: "Una polizza vita in cui l'assicurazione non corre quasi nessun rischio è, nei fatti, un portafoglio di investimenti, ma il capitale pagato alla morte è escluso dall'imposta di successione (decreto legislativo 346/1990, articolo 12). Le polizze «dedicate», spesso emesse all'estero, servono soprattutto a rinviare le imposte e a trasmettere patrimoni. Le distribuzioni dei trust esteri opachi sono tassate solo se il trust sta in un Paese a fiscalità privilegiata."
    come: "Una polizza conta come assicurazione solo se il capitale alla morte supera di almeno il 10% il valore della polizza; altrimenti, per i premi versati dal 2028, il capitale entra nell'eredità con le franchigie ordinarie. Le polizze dedicate pagano ogni anno sui redditi realizzati; le distribuzioni dei trust esteri poco tassati pagano il 26% sulla sola parte di reddito, con credito per le imposte estere, e il registro dei titolari effettivi riapre entro 90 giorni. Nel programma intermedio c'è la versione piena; il gettito entra nelle coperture del programma."
    cosa: "Fine dei contenitori usati solo per pagare meno. Obiettivi: valore delle polizze senza rischio e dedicate pubblicato in 3 anni; registro dei titolari effettivi operativo; gettito dalle polizze in successione almeno pari al minimo stimato nelle coperture. Costo a regime: 0,004 mld €/anno per i controlli."
    chi: "Decide il Parlamento con la legge di bilancio; attuano l'Agenzia delle entrate e l'autorità di vigilanza sulle assicurazioni (IVASS). Ne beneficiano i conti pubblici e chi paga l'imposta di successione su titoli posseduti direttamente. Pagano chi usa polizze senza rischio per patrimoni oltre le franchigie, chi ha polizze dedicate e chi riceve da trust esteri poco tassati; le polizze di vera protezione e i premi già versati non cambiano."
    oceano_blu:
      eliminare: "L'esenzione di successione per le polizze senza rischio, sui premi versati dal 2028."
      ridurre: "Il rinvio dell'imposta nelle polizze dedicate, tassate ogni anno sui redditi realizzati."
      aumentare: "La trasparenza su trust e titolari effettivi."
      creare: "Una soglia minima di rischio (10%) per contare come assicurazione."
  01-P22:
    perche: "L'imposta di successione ha reso 1,08 miliardi nel 2025 (Bollettino n. 286). Il passaggio a figli e coniuge delle quote di controllo è esente anche quando la società è una holding con soli titoli o immobili (Agenzia delle entrate, risposta 152/2026). E le plusvalenze maturate in vita non si pagano mai, perché gli eredi ricevono le quote al valore di successione."
    come: "L'esenzione per il passaggio d'impresa resta per la parte operativa e si estende alle società europee; la parte di attivi passivi (liquidità oltre il maggiore tra il 20% dell'attivo e un anno di costi, titoli non usati, immobili affittati, beni di lusso) entra nella base con le franchigie ordinarie, pagabile in 10 rate senza interessi. Per le plusvalenze latenti oltre 1 milione per erede, gli eredi mantengono il costo fiscale di chi è morto e pagano solo quando vendono, con credito per l'imposta di successione già pagata. Vale solo per successioni e donazioni future; nel programma intermedio c'è la versione piena e il gettito entra nelle coperture."
    cosa: "Chi eredita un'impresa che lavora resta esente, chi eredita una cassaforte di titoli no. Obiettivi: gettito di successioni e donazioni +2-5% in 3 anni e +4-10% in 5; imprese familiari passate di generazione e ancora attive dopo 5 anni invariate o in crescita. Costo a regime: 0,003 mld €/anno per i controlli."
    chi: "Decide il Parlamento con la legge di bilancio; attua l'Agenzia delle entrate, con un decreto sui soli metodi di calcolo. Ne beneficiano i conti pubblici e chi eredita titoli senza holding, oggi trattato peggio. Pagano gli eredi di grandi patrimoni passivi tenuti in holding e, solo quando vendono, gli eredi di grandi plusvalenze; non paga chi eredita e continua un'impresa operativa né chi sta sotto le franchigie."
    oceano_blu:
      eliminare: "L'esenzione di successione per i patrimoni passivi chiusi in una holding."
      ridurre: "L'effetto blocco sulle vendite, con rate e credito per l'imposta già pagata."
      aumentare: "La parità di trattamento tra chi eredita titoli direttamente e chi li eredita tramite holding."
      creare: "Il mantenimento del costo fiscale di chi è morto per le plusvalenze oltre 1 milione per erede."
  01-P23:
    perche: "Le statistiche sull'imposta sul reddito dicono che lo 0,2% dei contribuenti, oltre 300.000 euro, dichiara il 6,6% dell'imposta netta, ma non vedono dividendi, plusvalenze, interessi e utili trattenuti nelle società. L'unica misura dell'aliquota effettiva dello 0,1% più ricco (32,6-36%) è accademica e su dati del 2015 (stime accademiche). Nessuno, nemmeno il Ministero dell'economia, pubblica quanto paga davvero chi sta in cima."
    come: "Dipartimento delle finanze, ISTAT e Banca d'Italia producono ogni anno una statistica ufficiale delle aliquote effettive fino allo 0,01% più ricco, con dati pseudonimizzati in ambiente sicuro, divieto di usarli per i controlli e parere del Garante per la protezione dei dati personali. Un'unità dell'Agenzia delle entrate di circa 100 persone segue grandi patrimoni e gruppi familiari e offre un accordo di collaborazione a chi ha oltre 1 milione di reddito o 50 milioni di patrimonio, con sanzioni ridotte solo per i rischi comunicati in anticipo. Ogni anno si pubblicano numero di aderenti e gettito dei regimi speciali (nuovi residenti, impatriati, forfettario). Nel programma intermedio c'è la versione piena, pagata con spese di funzionamento; il recupero atteso va a ridurre il deficit."
    cosa: "Sapere chi paga quanto, con dati ufficiali. Obiettivi: prima edizione della statistica in 3 anni e serie annuale in 5; almeno 300 persone nell'accordo di collaborazione in 3 anni e 1.000 in 5; pubblicazione completa dei regimi speciali. Costo a regime: 0,015 mld €/anno."
    chi: "Decide il Parlamento con una legge, dopo aver consultato la Banca centrale europea e il Garante; attuano Dipartimento delle finanze, ISTAT, Banca d'Italia e Agenzia delle entrate, con il metodo rivisto dall'Ufficio parlamentare di bilancio. Ne beneficiano cittadine e cittadini, che hanno dati per discutere di equità. Chi ha grandi patrimoni è seguito più da vicino e chi omette informazioni è escluso dall'accordo."
    oceano_blu:
      eliminare: "niente"
      ridurre: "Le sanzioni, solo per i rischi comunicati in anticipo dentro l'accordo di collaborazione."
      aumentare: "La trasparenza sui regimi speciali e sulle aliquote effettive in cima."
      creare: "Una statistica ufficiale delle aliquote effettive fino allo 0,01% più ricco e un'unità per i grandi patrimoni."
  02-C1:
    perche: "Nel 2025 il 10,2% delle persone occupate è a rischio di povertà, contro l'8,3% della media europea (Eurostat). Le retribuzioni contrattuali orarie reali sono il 10,2% più basse a settembre 2026 rispetto a gennaio 2021 (ISTAT ed Eurostat, elaborazione GovernAI). Lavorare non basta più, per molte persone, a uscire dalla povertà."
    come: "Una legge stabilisce che il trattamento economico complessivo del contratto collettivo più rappresentativo del settore è la paga giusta prevista dall'articolo 36 della Costituzione, per tutti i rapporti di lavoro e negli appalti. Il Consiglio nazionale dell'economia e del lavoro e l'INPS certificano quali contratti sono i più rappresentativi; una Commissione consultiva lavora senza costi. Nel programma intermedio c'è la versione a costo zero, solo regole: niente ispettori in più e niente soglia oraria vincolante."
    cosa: "Un pavimento salariale valido per tutte e tutti. Obiettivi: persone occupate a rischio di povertà dal 10,2% al 9,5% in 3 anni e all'8,5% in 5; paghe reali a -6% rispetto al 2021 in 3 anni e a -3% in 5. Senza controlli in più, l'effetto dipende dai ricorsi delle singole persone al giudice. Costo a regime: 0 mld €/anno."
    chi: "Decide il Parlamento con una legge; attuano Consiglio nazionale dell'economia e del lavoro, INPS e giudici del lavoro. Ne beneficiano le persone pagate sotto il contratto di riferimento. Pagano le imprese che oggi applicano trattamenti più bassi di quel contratto."
    oceano_blu:
      eliminare: "niente"
      ridurre: "Lo spazio per paghe sotto il contratto più rappresentativo del settore."
      aumentare: "La certezza del diritto a una paga giusta, per tutti i rapporti e negli appalti."
      creare: "La certificazione pubblica di quali contratti sono i più rappresentativi."
  02-C2:
    perche: "Nel 2023/24 i posti nei nidi sono 31,6 ogni 100 bambine e bambini sotto i 3 anni, ma solo 19,0 al Sud, e il 59,5% dei nidi ha liste d'attesa (ISTAT). La fecondità è 1,14 figli per donna nel 2025 (ISTAT) e l'occupazione delle donne tra 20 e 64 anni è al 58,0% (Eurostat 2025). Senza nidi e senza padri in congedo, il lavoro di cura resta sulle madri."
    come: "Un fondo paga il personale educativo, non solo gli edifici, negli ambiti con meno di 33 posti ogni 100 bambini, con nido gratuito per le famiglie con ISEE fino a 25.000 euro: circa 60-70 mila posti in più, soprattutto al Sud e nelle aree interne. Il congedo di paternità sale da 10 giorni a 1 mese nel 2028 e a 2 mesi pagati all'80%, non cedibili, dal 2030. È la versione essenziale scelta nel programma intermedio. Si paga per metà con il riordino dei bonus e per metà con il riordino delle agevolazioni fiscali, risorse generali del programma; nell'intermedio il bonus per le lavoratrici madri resta."
    cosa: "Più posti nido dove mancano, più lavoro per le madri, più tempo dei padri con i figli. Obiettivi: posti nido al Sud da 19,0 a 27 ogni 100 bambini in 3 anni e 33 in 5; occupazione femminile dal 58,0% al 60,5% in 3 anni e al 62,5% in 5; 60% dei padri in congedo in 3 anni. Costo a regime: 2,00 mld €/anno."
    chi: "Decide il Parlamento con la legge di bilancio; attuano Comuni e ambiti territoriali per i nidi e l'INPS per il congedo. Ne beneficiano bambine e bambini, madri e padri, soprattutto al Sud e con redditi bassi. Pagano chi perde bonus e agevolazioni fiscali riordinati per coprire la spesa; le imprese devono organizzarsi per assenze più lunghe dei padri."
    oceano_blu:
      eliminare: "niente"
      ridurre: "niente"
      aumentare: "Il congedo di paternità, da 10 giorni a 2 mesi pagati all'80%."
      creare: "Un fondo stabile per il personale dei nidi dove i posti mancano, con nido gratuito per ISEE fino a 25.000 euro."
  02-C3:
    perche: "La spesa per pensioni è al 15,2% del PIL nel 2025 e salirà al 17,1% nel 2041-44 (Ragioneria generale dello Stato 2026). Senza il legame tra età di pensione e aspettativa di vita il picco sarebbe il 18,0%. Il rapporto tra persone con 65 anni e più e persone in età da lavoro passa dal 39% nel 2025 al 63% nel 2050 (Eurostat)."
    come: "Nel programma intermedio c'è la versione a costo zero, solo regole. Si può uscire prima pagando il costo vero della scelta, con un'uscita flessibile calcolata in modo attuariale al posto del fondo per la flessibilità della legge di bilancio 2027; resta il legame con l'aspettativa di vita; l'elenco dei lavori gravosi si basa sui dati dell'istituto contro gli infortuni (INAIL); l'iscrizione alla pensione integrativa è automatica, con possibilità di uscire. La pensione di garanzia per chi ha carriere discontinue è rinviata a una legge successiva con copertura."
    cosa: "Un sistema prevedibile e giusto tra generazioni. Obiettivi: spesa per pensioni non oltre lo scenario di riferimento, con picco non oltre il 17,1%; relazione sul costo per generazione per il 100% delle leggi sulle pensioni; persone neoassunte iscritte alla previdenza integrativa +20 punti in 3 anni e +30 in 5. Costo a regime: 0 mld €/anno."
    chi: "Decide il Parlamento con una legge; attuano INPS, INAIL e Ufficio parlamentare di bilancio. Ne beneficiano le generazioni giovani e chi fa lavori gravosi. Chi esce prima riceve una pensione più bassa, in proporzione all'anticipo; chi ha carriere discontinue non ha ancora la pensione di garanzia."
    oceano_blu:
      eliminare: "Il fondo per la flessibilità in uscita, sostituito dall'uscita attuariale."
      ridurre: "niente"
      aumentare: "La trasparenza sul costo per generazione di ogni legge sulle pensioni."
      creare: "L'iscrizione automatica alla pensione integrativa, con possibilità di uscire."
  02-C4:
    perche: "Nel 2025 sono in povertà assoluta 5,4 milioni di persone (9,3%), tra cui 1,136 milioni di minori (12,5%) (ISTAT). L'Assegno di inclusione raggiunge 690 mila nuclei a giugno 2026, circa un terzo delle famiglie in povertà assoluta (INPS). Chi è povero ma non ha in casa minori, persone con disabilità o persone anziane resta escluso."
    come: "L'Assegno di inclusione diventerebbe universale: aperto a tutti i nuclei sotto le soglie di reddito, senza requisiti di categoria, con una scala più favorevole ai minori e 2 anni di residenza richiesti. Chi trova lavoro perderebbe solo 50-60 centesimi per ogni euro guadagnato per 18 mesi, con un patto di inclusione seguito da un operatore. La proposta non entra nel programma intermedio: non viene scelta in nessuna combinazione di pesi tra i valori. Si pagherebbe con il riordino di bonus e agevolazioni fiscali e con la riforma dei sussidi dannosi per l'ambiente."
    cosa: "Meno povertà, soprattutto tra i minori, e lavoro che conviene. Obiettivi: povertà assoluta dal 9,3% all'8,6% in 3 anni e all'8,0% in 5; tra i minori dal 12,5% all'11,5% in 3 anni e al 10,5% in 5. Nel programma intermedio il costo è zero perché la proposta è esclusa; la versione piena costerebbe 3,0 mld €/anno."
    chi: "Deciderebbe il Parlamento con una legge; attuerebbero INPS, Comuni e ambiti sociali. Ne beneficerebbero le famiglie povere oggi escluse, comprese quelle senza figli. Pagherebbe chi perde i bonus, le agevolazioni fiscali e i sussidi dannosi usati come copertura; alcune carte e bonus selettivi confluirebbero nello strumento unico."
    oceano_blu:
      eliminare: "Il requisito di categoria per avere l'Assegno di inclusione."
      ridurre: "La perdita di sostegno quando si trova lavoro, a 50-60 centesimi per euro guadagnato."
      aumentare: "La platea: tutti i nuclei sotto le soglie, con una scala più favorevole ai minori."
      creare: "Un reddito di inclusione universale con un patto seguito da un operatore."
  02-C5:
    perche: "Nel 2025 l'occupazione delle persone con limitazioni gravi è 43,4 punti più bassa di quella delle altre persone (Eurostat). Lavora solo il 32,5% delle persone tra 15 e 64 anni con limitazioni gravi, contro il 58,9% (ISTAT 2021). Le persone con limitazioni gravi sono 2,9 milioni (ISTAT 2023)."
    come: "La riforma del 2024 sulla disabilità parte su tutto il territorio dal 2027, con valutazione di base e progetto di vita. Nel programma intermedio c'è la versione pilota: personale a tempo determinato fino al 2029 (circa 750 unità) e un budget di progetto in più solo nel quarto degli ambiti sociali con meno servizi, con una valutazione nel 2029. Ovunque il collocamento mirato diventa effettivo: banca dati dei posti riservati scoperti, sanzioni automatiche, rimborso degli adattamenti del posto di lavoro. Si paga con il Fondo sociale europeo 2021-2027."
    cosa: "Più lavoro e una vita più indipendente per le persone con disabilità. Obiettivi: divario occupazionale da 43,4 a 40 punti in 3 anni e a 37 in 5; occupazione delle persone con limitazioni gravi dal 32,5% al 36% in 3 anni; 150 mila progetti di vita attivi in 3 anni. Costo a regime della versione pilota: 0,15 mld €/anno, fino al 2029."
    chi: "Decide il Governo con un decreto legislativo; attuano ambiti territoriali sociali, unità di valutazione e servizi per il lavoro, d'intesa con le autorità che gestiscono i fondi europei. Ne beneficiano le persone con disabilità e le loro famiglie, di più dove i servizi mancano. Pagano le imprese che non rispettano le quote di assunzione, con sanzioni automatiche; i fondi europei usati qui non vanno ad altri progetti."
    oceano_blu:
      eliminare: "niente"
      ridurre: "niente"
      aumentare: "Il personale delle unità di valutazione e i budget di progetto dove i servizi mancano di più."
      creare: "Una banca dati dei posti riservati scoperti, con sanzioni automatiche e rimborso degli adattamenti sul lavoro."
  02-C6:
    perche: "Nel 2025 i nati sono 355.772, il 3,8% in meno, e la fecondità è 1,14 figli per donna (ISTAT). Il rapporto tra persone con 65 anni e più e persone in età da lavoro sale dal 39% nel 2025 al 63,1% nel 2050 (Eurostat). Nessuna legge oggi dichiara quanto costa a ciascuna generazione."
    come: "Nel programma intermedio c'è la versione a costo zero: una Strategia demografica nazionale adottata con decreto del Presidente del Consiglio, con obiettivi pubblici e una relazione annuale al Parlamento. La valutazione generazionale delle leggi passa dalla proposta 01-P1, per non avere due strumenti paralleli. È solo regole."
    cosa: "Scelte coordinate e trasparenti su natalità, giovani e lavoro. Obiettivi: occupazione tra 20 e 64 anni dal 67,6% al 69,0% in 3 anni e al 70,5% in 5; giovani che non studiano né lavorano dal 13,3% al 12,0% in 3 anni e all'11,0% in 5. Questa versione coordina ma non aggiunge strumenti. Costo a regime: 0 mld €/anno."
    chi: "Decide il Presidente del Consiglio con un decreto; attuano i ministeri interessati, che riferiscono ogni anno al Parlamento. Ne beneficiano le generazioni giovani e le famiglie. Nessuno paga in denaro."
    oceano_blu:
      eliminare: "niente"
      ridurre: "niente"
      aumentare: "La trasparenza: una relazione annuale al Parlamento sulle scelte demografiche."
      creare: "Una Strategia demografica nazionale con obiettivi pubblici."
  02-C7:
    perche: "Il censimento conta 96.197 persone senza tetto o senza fissa dimora iscritte in anagrafe a fine 2021, metà in 6 Comuni (ISTAT). Il Piano nazionale di ripresa e resilienza ha dato 450 milioni per «prima la casa» (Housing First) e stazioni di posta fino al 2026. Dal 2027 non c'è un finanziamento stabile per le équipe che accompagnano le persone nella casa (Ministero del lavoro; fio.PSD 2023)."
    come: "Housing First («prima la casa») diventa un livello essenziale delle prestazioni sociali: la persona senza dimora di lungo periodo riceve subito una casa con contratto d'affitto proprio, poi il sostegno, senza condizioni preliminari. Nel programma intermedio c'è la versione essenziale: 6.000 persone nelle 14 città metropolitane, équipe stabili e riconversione graduale dei dormitori di lungo periodo. Si paga con il riordino delle agevolazioni fiscali e con tagli ad altre spese del Ministero del lavoro, escluso il Fondo povertà."
    cosa: "Persone che escono dalla strada e restano in casa. Obiettivi: 6.000 persone in Housing First con contratto proprio in 3 anni; almeno l'80% ancora nell'alloggio dopo 12 mesi in 3 anni e l'85% in 5; 20% dei posti di dormitorio di lungo periodo riconvertiti in 3 anni. Costo a regime: 0,09 mld €/anno."
    chi: "Decidono il Parlamento con la legge di bilancio e il Ministero del lavoro con un decreto sul livello essenziale; attuano città metropolitane, ambiti sociali e dipartimenti di salute mentale. Ne beneficiano le persone senza dimora di lungo periodo. Pagano le linee di spesa del Ministero del lavoro tagliate e chi perde agevolazioni fiscali riordinate; i posti di dormitorio di lungo periodo diminuiscono."
    oceano_blu:
      eliminare: "Le condizioni preliminari, come astinenza o terapia, per avere una casa."
      ridurre: "I posti di dormitorio di lungo periodo."
      aumentare: "La stabilità delle équipe di sostegno, finanziate anche dopo la fine del Piano di ripresa."
      creare: "Un livello essenziale nazionale di Housing First con contratto d'affitto proprio."
  02-C8:
    perche: "La spesa per pensioni è al 15,2% del PIL nel 2025 e arriverà al 17,1% nel 2041-44; senza il legame con l'aspettativa di vita il picco sarebbe il 18,0% (Ragioneria generale dello Stato 2026). Il legame è già stato attenuato per il 2027 e il 2028. Oggi nessuna regola obbliga a coprire queste scelte per tutta la durata dei loro effetti."
    come: "Aggancio protetto: ogni legge che sospende o riduce il legame con l'aspettativa di vita, o apre uscite anticipate, deve trovare la copertura dentro il sistema pensionistico per tutti gli anni di effetto, con una stima per generazione. Correttore: se per due previsioni di fila la spesa supera di oltre 0,2 punti di PIL lo scenario fissato per legge, senza colpa del ciclo economico, per al massimo 3 anni la rivalutazione della sola parte di pensione oltre 6 volte il minimo (circa 3.700 euro lordi al mese) passa dal 75% al 50%. Nel programma intermedio c'è la versione piena; è solo regole, a costo zero."
    cosa: "Pensioni sostenibili senza toccare gli assegni bassi. Obiettivi: scarto della spesa dallo scenario di riferimento non oltre 0,2 punti; 100% delle leggi che allentano l'aggancio con copertura interna per tutta la durata; confronto pubblico ogni anno tra Ragioneria e Ufficio parlamentare di bilancio. Costo a regime: 0 mld €/anno; l'eventuale risparmio non è contato come copertura."
    chi: "Decide il Parlamento con una legge approvata a maggioranza assoluta; attuano Ragioneria generale dello Stato, INPS e Ufficio parlamentare di bilancio. Ne beneficiano le generazioni giovani e chi entra oggi nel lavoro. Pagano, solo se il correttore scatta, circa 1 milione di persone con pensioni oltre 6 volte il minimo (stima GovernAI): per esempio circa 6,5 euro lordi al mese in meno il primo anno su una pensione di 5.000 euro; perdono flessibilità i governi futuri."
    oceano_blu:
      eliminare: "Le uscite anticipate o i rinvii dell'aggancio senza copertura per tutti gli anni di effetto."
      ridurre: "La rivalutazione della sola parte di pensione oltre 6 volte il minimo, solo se scatta il correttore e per al massimo 3 anni."
      aumentare: "La durata della copertura obbligatoria, da 3 anni a tutti gli anni di effetto."
      creare: "Un correttore automatico e temporaneo legato a uno scenario fissato per legge."
  02-C9:
    perche: "Il programma per l'occupabilità finanziato dal Piano di ripresa (GOL) ha avuto 5,4 miliardi e ha preso in carico oltre 3 milioni di persone entro il 2025; si è chiuso il 30 giugno 2026 (Ministero del lavoro e INAPP, cifre da riscontrare). Senza una fonte nuova la presa in carico si ferma. Il tasso di occupazione italiano è il 67,6%, contro il 76,1% della media europea."
    come: "Il nucleo minimo prevede la profilazione entro 30 giorni per chi riceve l'indennità di disoccupazione e per le persone attivabili dei nuclei con Assegno di inclusione, e un percorso intensivo (orientamento, formazione breve, tirocinio) solo per chi è più lontano dal lavoro. Nel programma intermedio c'è la versione pilota: una sperimentazione con estrazione casuale in 10 province per 3 anni (2027-2029), circa 30.000 persone l'anno, valutata da INAPP e Banca d'Italia. Si paga con il Fondo sociale europeo 2021-2027, una tantum."
    cosa: "Sapere con prove se il percorso aiuta a trovare lavoro. Obiettivi: 70% delle persone con indennità di disoccupazione profilate entro 30 giorni in 3 anni e 90% in 5; occupazione a 12 mesi misurata rispetto a un gruppo di confronto, +5 punti in 5 anni, altrimenti il percorso si rivede. Costo a regime della versione pilota: 0,03 mld €/anno fino al 2029, nessun onere dopo."
    chi: "Decide il Ministero del lavoro con un decreto autorizzato per legge; attuano Regioni e centri per l'impiego, con la valutazione di INAPP e Banca d'Italia. Ne beneficiano chi cerca lavoro, soprattutto chi ne è più lontano, e le imprese che cercano personale. Nel programma è attiva anche la riduzione, legata a questa misura, degli incentivi all'assunzione senza effetto aggiuntivo: pagano le imprese che avrebbero assunto comunque."
    oceano_blu:
      eliminare: "niente"
      ridurre: "Gli incentivi all'assunzione senza effetto aggiuntivo dimostrato."
      aumentare: "La rapidità della presa in carico, con profilazione entro 30 giorni."
      creare: "Una sperimentazione con estrazione casuale e valutazione pubblica dei risultati."
  03-P1:
    perche: "Nel 2025 lo Stato ha speso 22,38 miliardi in sussidi dannosi per l'ambiente, di cui 20,63 alle fonti fossili (Ministero dell'ambiente, Catalogo 2026). Le emissioni dei trasporti, 113,3 milioni di tonnellate di CO2 equivalente nel 2024, sono sopra il livello del 1990 (Eurostat). Ridurre i sussidi senza un calendario e senza proteggere i redditi bassi rischia proteste come in Francia nel 2018."
    come: "Nel programma intermedio c'è la versione senza dividendo: tutto il gettito della riforma dei sussidi dannosi finanzia altre proposte del programma. Resta la parte a costo zero: un calendario pubblico di 5 anni per la riforma, una clausola di sospensione legata ai prezzi dei carburanti, una valutazione per fasce di reddito dell'Ufficio parlamentare di bilancio al terzo anno e il bonus sociale elettrico che esiste già. È solo regole, con una legge delega."
    cosa: "Una riforma dei sussidi prevedibile e controllata. Obiettivi: sussidi alle fonti fossili da 20,63 a non più di 18 miliardi in 3 anni e 15,5 in 5; emissioni dei trasporti a non più di 109 milioni di tonnellate in 3 anni e 103 in 5; reddito del 20% più povero non peggiorato dalla riforma. Costo a regime: 0 mld €/anno."
    chi: "Decide il Parlamento con una legge delega; attuano Ministero dell'ambiente e Ministero dell'economia, con la valutazione dell'Ufficio parlamentare di bilancio. Ne beneficiano l'ambiente e le proposte finanziate con il gettito. Pagano chi oggi riceve i sussidi riformati nel programma, come l'autotrasporto per il rimborso sul gasolio, l'agricoltura per il gasolio agevolato e i voli nazionali; senza dividendo non c'è restituzione diretta alle famiglie, e il rischio per i redditi bassi va compensato con le misure sociali dell'area 02."
    oceano_blu:
      eliminare: "niente"
      ridurre: "I sussidi alle fonti fossili, seguendo un calendario pubblico (i tagli sono nelle coperture del programma)."
      aumentare: "La prevedibilità della riforma e la verifica dei suoi effetti per fascia di reddito."
      creare: "Un calendario di 5 anni fissato per legge e una clausola di sospensione legata ai prezzi dei carburanti."
  03-P2:
    perche: "Nel 2025 il prezzo all'ingrosso dell'elettricità è stato 115,32 euro per megawattora, il 6,3% in più del 2024, perché lo fissa il gas (Gestore dei mercati energetici). Le rinnovabili coprono il 41,1% della domanda e nel 2025 si sono installati 7,19 gigawatt nuovi, contro circa 9 l'anno necessari (Terna)."
    come: "Nelle aste future per le rinnovabili incentivate si usano contratti per differenza a due vie: se il prezzo di mercato supera quello concordato, gli extra-ricavi tornano in bolletta. Si approva con Regioni e Comuni la mappa definitiva delle aree adatte agli impianti e si rende effettivo il silenzio-assenso sulle autorizzazioni. Nel programma intermedio c'è la versione a costo zero, solo regole, senza la squadra tecnica statale né il gruppo che rivende energia a prezzo di costo."
    cosa: "Bollette meno legate al gas e più impianti rinnovabili. Obiettivi: rinnovabili dal 41,1% ad almeno il 52% della domanda in 3 anni; nuova capacità di almeno 9 gigawatt l'anno in 3 anni e 10 in 5; tempi di autorizzazione nelle aree adatte -40% in 3 anni. Il limite resta la lentezza delle autorizzazioni locali. Costo a regime: 0 mld €/anno."
    chi: "Decidono il Governo e il Ministero dell'ambiente con decreti, d'intesa con Regioni e Comuni in Conferenza unificata; attua il Gestore dei servizi energetici con le aste. Ne beneficiano famiglie e imprese che pagano la bolletta. Perdono i nuovi impianti incentivati gli extra-ricavi quando i prezzi sono alti."
    oceano_blu:
      eliminare: "Gli extra-ricavi dei nuovi impianti incentivati quando il prezzo di mercato è alto."
      ridurre: "I tempi di autorizzazione nelle aree adatte agli impianti."
      aumentare: "niente"
      creare: "Contratti per differenza a due vie e una mappa definitiva delle aree adatte."
  03-P3:
    perche: "Nel 2022 si è perso il 42,4% dell'acqua immessa nelle reti comunali, 3,39 miliardi di metri cubi (ISTAT). In Basilicata le perdite arrivano al 65,5% e in Abruzzo al 62,5%; cinque regioni sono oltre il 50%. La situazione non migliora: nel 2020 le perdite erano il 42,2%."
    come: "Ogni ambito ha obiettivi vincolanti di riduzione delle perdite, con premi e penalità in tariffa decisi dall'autorità di regolazione per energia, reti e ambiente (ARERA), e i Comuni che gestiscono l'acqua da soli devono unirsi in gestioni più grandi. Nel programma intermedio c'è la versione essenziale: contributi europei solo per le regioni con perdite oltre il 50% e per i distretti irrigui in forte siccità, riuso dell'acqua depurata obbligatorio solo per i grandi depuratori nei distretti siccitosi, bonus idrico sociale rafforzato. Si paga con fondi europei di coesione (una tantum 2027-2029), un piccolo taglio nel bilancio del Ministero dell'ambiente e componenti della tariffa."
    cosa: "Meno acqua sprecata e più acqua riusata. Obiettivi: perdite dal 42,4% al 38% in 3 anni e al 33% in 5; regioni con perdite oltre il 50% da 5 a non più di 3 in 3 anni e a nessuna in 5; acqua depurata riusata in agricoltura raddoppiata in 3 anni. Costo a regime: 0,6 mld €/anno."
    chi: "Decidono il Governo con un decreto legislativo, l'autorità di regolazione con le sue delibere e le Regioni per i fondi europei; attuano gestori idrici e Comuni. Ne beneficiano famiglie, agricoltura e territori in siccità, soprattutto al Sud; le famiglie con redditi bassi hanno un bonus idrico più alto. Pagano in parte gli utenti in tariffa, i Comuni che perdono la gestione diretta e i gestori che mancano gli obiettivi, con penalità."
    oceano_blu:
      eliminare: "Le gestioni comunali dell'acqua fatte da soli, unite in gestioni più grandi."
      ridurre: "Le perdite delle reti, con obiettivi vincolanti per ogni ambito."
      aumentare: "Il bonus idrico sociale e il riuso dell'acqua depurata nei distretti siccitosi."
      creare: "Premi e penalità in tariffa legati alle perdite."
  03-P4:
    perche: "Il 94,5% dei Comuni è in aree a rischio di frane, alluvioni, erosione o valanghe e 1,28 milioni di persone vivono in aree a pericolo di frana elevato o molto elevato (ISPRA 2024). Ad aprile 2026 solo il 16% delle imprese aveva la polizza obbligatoria contro le catastrofi (IVASS). Nel 2025 il consumo di suolo è stato di 102 chilometri quadrati, il più alto del decennio (ISPRA 2026)."
    come: "Un Fondo nazionale per la prevenzione da 0,6 miliardi l'anno, concentrato sui Comuni con più persone nelle aree a pericolo più alto e assegnato per graduatoria di rischio, non dopo le emergenze. Uno schema assicurativo per le abitazioni con adesione automatica e possibilità di uscire, riassicurazione pubblica e aiuto sui premi per chi ha ISEE basso. Restano intere le norme a costo zero: divieto di costruire nelle aree a pericolo più alto, niente indennizzi agli edifici abusivi, consumo di suolo netto zero. È la versione essenziale dell'intermedio, pagata con la riforma dei sussidi dannosi per l'ambiente, il riordino dei fondi per le emergenze, fondi europei di coesione e un contributo interno allo schema assicurativo."
    cosa: "Meno danni e meno spesa dopo i disastri. Obiettivi: imprese assicurate dal 16% ad almeno il 50% in 3 anni e l'80% in 5; consumo di suolo da 102 a non più di 60 chilometri quadrati l'anno in 3 anni e 35 in 5; spesa per prevenzione almeno pari a quella per emergenze in 3 anni e doppia in 5. Costo a regime: 0,8 mld €/anno."
    chi: "Decide il Parlamento con una legge quadro e la legge di bilancio; attuano Dipartimento della protezione civile, Comuni e la società pubblica di riassicurazione (CONSAP). Ne beneficiano chi vive nelle aree a rischio e i piccoli Comuni. Pagano chi riceve i sussidi dannosi riformati, chi ha edifici abusivi, che non avrà indennizzi, e chi voleva costruire nelle aree a pericolo più alto; le famiglie pagano un premio assicurativo, salvo scelta di uscire."
    oceano_blu:
      eliminare: "Gli indennizzi agli edifici abusivi o condonati e le nuove costruzioni nelle aree a pericolo più alto."
      ridurre: "La spesa decisa dopo le emergenze, spostata sulla prevenzione."
      aumentare: "La copertura assicurativa di case e imprese contro le catastrofi."
      creare: "Un fondo stabile per la prevenzione assegnato per graduatoria di rischio e un'assicurazione per le case con adesione automatica."
  03-P5:
    perche: "Nel 2024 l'agricoltura ha emesso 28,0 milioni di tonnellate di CO2 equivalente, il 7,7% del totale nazionale (Eurostat). Il 69% viene dagli allevamenti: digestione degli animali e reflui. Il calo dal 2005 è modesto: da 33,0 a 28,0 milioni di tonnellate."
    come: "Nella politica agricola europea il sostegno passerebbe gradualmente dai pagamenti per ettaro ai pagamenti per risultati misurati, anche da satellite: carbonio nel suolo, acqua, azoto, siepi e biodiversità. Un fondo mutualistico contro siccità e grandine, biometano dai reflui degli allevamenti in Pianura Padana e consulenza gratuita per le piccole aziende completerebbero la misura. La proposta non entra nel programma intermedio: non viene scelta in nessuna combinazione di pesi tra i valori. Si pagherebbe con la riforma dei sussidi agricoli dannosi e con risorse del Ministero dell'agricoltura."
    cosa: "Meno emissioni agricole e aziende più pronte alla siccità. Obiettivi: emissioni agricole a non più di 27,0 milioni di tonnellate in 3 anni e 26,0 in 5; almeno il 15% della superficie agricola sotto contratti a risultato in 5 anni; almeno metà degli aderenti con meno di 20 ettari. Nel programma intermedio il costo è zero perché la proposta è esclusa; la versione piena costerebbe 0,5 mld €/anno."
    chi: "Deciderebbero il Governo, con un decreto legislativo e la modifica del Piano strategico della politica agricola, e il Ministero dell'agricoltura; attuerebbero l'agenzia per le erogazioni in agricoltura (AGEA) e il centro di ricerca CREA. Ne beneficerebbero le aziende che migliorano suolo e acqua, soprattutto piccole. Pagherebbero le aziende che oggi ricevono pagamenti per ettaro senza risultati e chi usa sussidi dannosi come il gasolio agricolo agevolato."
    oceano_blu:
      eliminare: "niente"
      ridurre: "I pagamenti agricoli per ettaro, sganciati dai risultati."
      aumentare: "La consulenza tecnica gratuita per le piccole aziende e la protezione da siccità e grandine."
      creare: "Pagamenti per risultati ambientali misurati, anche da satellite."
