# GovernAI - Le quattro domande (WHY, HOW, WHAT, WHO) e la griglia oceano blu (eliminare, ridurre, aumentare, creare)
# per le proposte delle aree 07, 08 e 09. Fonti: programma/schede, programma/varianti, motore/proposte.csv,
# programma/coperture_menu.csv, programma/selezione_intermedio.md, apprendimento/obiettivi.yaml.
# La versione descritta in 'come' e 'cosa' e' quella del programma intermedio; se la proposta non e' nell'intermedio si descrive la versione piena.
proposte:
  07-C1:
    perche: "Dal 2019 al 2025 la durata stimata delle cause civili nei tre gradi di giudizio è scesa da 2.512 a 1.789 giorni (Ministero della Giustizia 2025). Il risultato si deve anche a circa 10.000 persone assunte con il PNRR, il Piano nazionale di ripresa e resilienza, finanziate solo fino al 30 giugno 2026. Senza quel personale i tempi rischiano di risalire dal 2027."
    come: "Una parte del personale dell'Ufficio per il processo, che prepara il lavoro dei giudici, diventa stabile con un concorso riservato. Nel processo civile telematico entra uno strumento di smistamento che classifica le cause e propone il calendario, ma decide sempre il giudice. Il programma intermedio sceglie la versione pilota: 1.500 persone stabilizzate in 20 tribunali critici e smistamento sperimentale, confrontati dopo 24 mesi con tribunali simili. Si paga spostando risorse dentro il bilancio della Giustizia, con la quota del Fondo unico giustizia (le somme sequestrate e confiscate) che spetta al ministero."
    cosa: "Obiettivi: durata delle cause civili nei tre gradi da 1.789 giorni (2025) a non più di 1.550 nel 2029 e 1.400 nel 2031; durata in tribunale da 435 a non più di 390 giorni nel 2029. Ogni trimestre un cruscotto pubblico mostra per ogni tribunale tempi e arretrati. Il pilota serve soprattutto a misurare l'effetto prima di estenderlo. Costo a regime della versione pilota: 0,10 mld €/anno dal 2028."
    chi: "Decidono il Parlamento con la legge di bilancio e il Ministero della Giustizia con un decreto, sentito il Consiglio superiore della magistratura; i sistemi informativi del ministero costruiscono lo smistamento digitale. Ne beneficiano le persone e le imprese che aspettano una sentenza e il personale precario stabilizzato. Paga il bilancio della Giustizia, che rinuncia ad altri usi di quelle risorse; i tribunali fuori dal pilota per ora non hanno rinforzi."
    oceano_blu:
      eliminare: "Il precariato del personale dell'Ufficio per il processo nei 20 tribunali del pilota."
      ridurre: "I tempi delle cause e il lavoro manuale di smistamento e calendarizzazione."
      aumentare: "La trasparenza: dati trimestrali per tribunale su tempi, arretrati e indennizzi per processi troppo lunghi."
      creare: "Uno strumento digitale di smistamento delle cause, iscritto in un registro pubblico degli algoritmi e sottoposto a controllo indipendente."
  07-C2:
    perche: "Al 30 settembre 2026 nelle carceri c'erano 66.063 persone detenute per 51.295 posti regolamentari: un affollamento del 128,8% (Dipartimento dell'amministrazione penitenziaria 2026). Ogni persona detenuta costa circa 178 € al giorno (stima GovernAI). Il sovraffollamento lede la dignità delle persone e oggi non esiste una statistica ufficiale sulla recidiva."
    come: "Per chi deve scontare al massimo 2 anni ed è a basso rischio, il magistrato di sorveglianza valuta d'ufficio le misure alternative, cioè scontare la pena nella comunità con controlli e lavoro; restano esclusi i reati più gravi. Il programma intermedio sceglie la versione essenziale: 1.000 persone in più negli uffici per l'esecuzione penale esterna, braccialetti elettronici disponibili entro 48 ore e statistica sulla recidiva, ma senza case di reinserimento. Si paga per 0,10 mld riducendo la spesa per la custodia in carcere e per 0,15 mld con la riforma dei sussidi dannosi per l'ambiente."
    cosa: "Obiettivi: affollamento da 128,8% a non più del 115% nel 2029 e del 105% nel 2031; persone detenute da 66.063 a non più di 60.000 nel 2029 e 56.000 nel 2031. Dal 2028 ISTAT e amministrazione penitenziaria pubblicano la recidiva a 3 anni; obiettivo nel 2031: -10% rispetto alla prima rilevazione. Costo a regime: 0,25 mld €/anno dal 2028; i risparmi da minori presenze in carcere non sono contati finché non sono certificati."
    chi: "Decidono il Parlamento con una legge delega e il Governo con un decreto legislativo; attuano il Ministero della Giustizia, la magistratura di sorveglianza, gli uffici per l'esecuzione penale esterna e l'ISTAT. Ne beneficiano le persone detenute a basso rischio, chi lavora nelle carceri e, se la recidiva cala, la sicurezza di tutte e tutti. Pagano chi oggi riceve sussidi dannosi per l'ambiente e la spesa per la custodia; resta il rischio politico se una persona ammessa alla misura commette un reato grave."
    oceano_blu:
      eliminare: "L'attesa della domanda: per pene residue fino a 2 anni la valutazione sulle misure alternative parte d'ufficio."
      ridurre: "Il sovraffollamento e la spesa per la custodia in carcere."
      aumentare: "Il personale degli uffici per l'esecuzione penale esterna (+1.000 persone) e la disponibilità di braccialetti elettronici entro 48 ore."
      creare: "Una statistica ufficiale annuale sulla recidiva per tipo di pena, che oggi non esiste."
  07-C3:
    perche: "Nel 2025 l'Italia ha eseguito 4.780 rimpatri su 21.295 ordini di allontanamento: il 22%, contro il 32% della media UE (Eurostat 2025). Non si pubblicano né la durata delle procedure d'asilo né quanti nulla osta al lavoro diventano davvero contratti. Senza dati le scelte sui flussi si fanno alla cieca, qualunque sia la linea politica."
    come: "Nasce presso il Consiglio nazionale dell'economia e del lavoro un Osservatorio indipendente che ogni anno stima il fabbisogno di lavoro per settore e territorio e pubblica quanti nulla osta diventano contratti; il decreto flussi deve motivare gli scostamenti. Il programma intermedio sceglie la versione pilota: Osservatorio e dati nazionali, più la decisione sull'asilo entro 6 mesi in 3 Commissioni territoriali su circa 40, con valutazione. Si paga riducendo la spesa per le convenzioni dei centri di accoglienza straordinaria."
    cosa: "Obiettivi della misura: rimpatri sugli ordini di allontanamento dal 22% al 30% nel 2029 e al 35% nel 2031; durata media dell'asilo in prima istanza non oltre 9 mesi nel 2029 e 6 mesi nel 2031 (oggi non pubblicata, si rileva dal 2027); nulla osta trasformati in contratti almeno al 60% nel 2029. Costo a regime della versione pilota: 0,04 mld €/anno dal 2028."
    chi: "Decide il Parlamento con un disegno di legge; attuano il Ministero dell'Interno, l'Osservatorio con ISTAT, INPS, Banca d'Italia, Ministero del Lavoro e Regioni, e le Commissioni territoriali per l'asilo. Ne beneficiano le persone richiedenti asilo, che aspettano meno, le imprese che cercano lavoratrici e lavoratori e chi decide le quote, che ha dati verificabili. Pagano i gestori dei centri di accoglienza straordinaria, con convenzioni ridotte; l'entità delle quote resta una scelta politica."
    oceano_blu:
      eliminare: "niente"
      ridurre: "L'attesa per la decisione sull'asilo, verso 6 mesi nelle Commissioni del pilota, e la spesa per i centri di accoglienza straordinaria."
      aumentare: "I dati pubblici sui flussi: fabbisogno per settore e territorio e quota di nulla osta trasformati in contratti."
      creare: "Un Osservatorio indipendente sul fabbisogno di lavoro, con l'obbligo per il decreto flussi di motivare gli scostamenti dalle sue stime."
  07-C4:
    perche: "Al 31 dicembre 2025 erano ancora in gestione all'Agenzia nazionale per i beni sequestrati e confiscati 19.414 immobili tolti alla criminalità, il 41% del totale; gli enti hanno preso solo il 44,8% dei beni proposti, contro il 67,2% del 2023 (Agenzia beni confiscati 2025). Le cause principali sono gli abusi edilizi e la mancanza di fondi per ristrutturare. Un bene confiscato che resta chiuso indebolisce la fiducia nello Stato."
    come: "L'Agenzia si rafforza con 200 persone in più e sedi presso le Prefetture; lo stato di ogni bene è pubblicato in dati aperti, con i tempi di ogni fase. Il programma intermedio sceglie la versione essenziale: un fondo rotativo che fa solo prestiti agevolati, senza contributi a fondo perduto, a Comuni, terzo settore e aziende confiscate, con capitale preso dal Fondo unico giustizia. Si paga per 0,04 mld con la quota del Fondo unico giustizia del Ministero dell'Interno e per 0,03 mld con la riforma dei sussidi dannosi per l'ambiente; i lavori del 2027-29 usano i fondi europei di coesione."
    cosa: "Obiettivi: immobili ancora in gestione dell'Agenzia da 19.414 a non più di 15.000 nel 2029 e 11.000 nel 2031; beni presi dagli enti sul totale proposto dal 44,8% al 60% nel 2029 e al 70% nel 2031; immobili destinati ogni anno da 3.639 ad almeno 4.500 nel 2029. Costo a regime: 0,07 mld €/anno dal 2030."
    chi: "Decide il Parlamento modificando il codice antimafia; attuano Ministero dell'Interno, Agenzia per i beni confiscati, Prefetture, Ministero della Giustizia per il Fondo unico giustizia, Comuni e terzo settore. Ne beneficiano le comunità che riusano i beni e chi lavora nelle aziende confiscate. Pagano chi oggi riceve sussidi dannosi per l'ambiente; senza contributi a fondo perduto i Comuni più poveri rischiano di restare esclusi."
    oceano_blu:
      eliminare: "niente"
      ridurre: "Gli immobili fermi in gestione all'Agenzia e i tempi delle fasi di destinazione."
      aumentare: "Il personale e la presenza sul territorio dell'Agenzia (+200 persone, sedi nelle Prefetture) e la trasparenza sullo stato di ogni bene."
      creare: "Un fondo rotativo di prestiti agevolati per ristrutturare i beni e dare continuità alle aziende confiscate."
  07-C5:
    perche: "La spesa per la difesa in senso NATO era l'1,52% del prodotto interno lordo (PIL) nel 2024 e il 2,10%, cioè 48,3 mld, nel 2026; l'impegno dell'Aia chiede il 3,5% entro il 2035, più l'1,5% per sicurezza e resilienza (NATO 2026). Il debito è al 136,7% del PIL (Eurostat 2025) e il margine di bilancio del programma è nullo. La scelta è politica: più sicurezza oggi oppure più spazio per le altre politiche e meno debito domani."
    come: "La proposta non è nel programma intermedio: la maggioranza del panel la indica come linea rossa sia nella versione piena sia in quella essenziale. La versione piena prevede una legge decennale con crescita lineare fino al 3,5% del PIL nel 2035, almeno il 40% degli investimenti in acquisti comuni europei, un piano di razionalizzazione della Difesa e una relazione annuale verificata dalla Corte dei conti, senza deficit. Le coperture indicate (sussidi dannosi per l'ambiente, agevolazioni fiscali, tagli ad altre spese, riordino dei bonus, accise sulla salute, pensioni) non bastano: 32 mld superano la capienza permanente di tutti i fondi del programma, circa 18 mld."
    cosa: "Obiettivi della versione piena: spesa per la difesa al 2,57% del PIL nel 2029 e al 2,88% nel 2031; quota degli investimenti in acquisti comuni UE almeno al 25% nel 2029 e al 40% nel 2031; debito non sopra il percorso concordato in Europa. Costo aggiuntivo della versione piena: 32 mld €/anno nel 2035, circa 160 mld cumulati; nel programma intermedio il costo è zero perché la misura è esclusa."
    chi: "Deciderebbero il Parlamento con una legge di programmazione e il Governo con Ministero della Difesa e Ministero dell'economia e delle finanze; controllerebbe la Corte dei conti. Ne beneficerebbero la capacità di difesa e la credibilità verso gli alleati. Per la copertura pagherebbero chi gode di agevolazioni fiscali e sussidi e i settori di spesa tagliati, con il rischio di togliere spazio a sanità, scuola e clima; restare fuori ha invece un costo diplomatico verso NATO e Stati Uniti."
    oceano_blu:
      eliminare: "La copertura in deficit: ogni aumento senza una copertura vera è sospeso."
      ridurre: "I programmi nazionali che duplicano capacità europee e le infrastrutture militari non necessarie, con un piano triennale di razionalizzazione."
      aumentare: "La spesa per la difesa fino al 3,5% del PIL nel 2035 e la quota di acquisti comuni europei ad almeno il 40% degli investimenti."
      creare: "Una legge decennale con relazione annuale su costi, capacità e ritardi verificata dalla Corte dei conti, e la possibilità per le Camere di rallentare la traiettoria ogni due anni."
  07-C6:
    perche: "Nel 2025 la squadra nazionale di risposta agli incidenti informatici ha gestito 2.729 eventi e 615 incidenti con impatto, di cui 103 attacchi ransomware, i più dannosi (Agenzia per la cybersicurezza nazionale 2025). Comuni piccoli e aziende sanitarie hanno poche risorse e competenze per difendersi (valutazione qualitativa, dato non verificato). Un attacco può fermare un ospedale o l'anagrafe di un Comune."
    come: "La proposta non è nel programma intermedio: con le risorse disponibili altre misure danno più valore per euro. La versione piena crea centri di sicurezza regionali condivisi, gestiti da Regioni e Agenzia per la cybersicurezza nazionale, che offrono gratis monitoraggio, copie di sicurezza protette e risposta agli incidenti ai Comuni sotto 50.000 abitanti e a tutte le aziende sanitarie; aggiunge una riserva cyber civile-militare, formazione di base per tutto il personale pubblico ed esercitazioni annuali. Si pagherebbe per 0,10 mld con risorse già previste per la sicurezza informatica e per 0,25 mld con il riordino delle agevolazioni fiscali; i fondi europei di coesione coprirebbero l'infrastruttura nel 2027-29."
    cosa: "Obiettivi della versione piena: Comuni sotto 50.000 abitanti e aziende sanitarie coperti da un centro di sicurezza da 0% (2026) ad almeno il 60% nel 2029 e al 100% nel 2031; incidenti con impatto negli enti locali e nella sanità -20% nel 2029 e -35% nel 2031; tempo di ripristino dopo un ransomware -30% nel 2029. Costo a regime della versione piena: 0,35 mld €/anno dal 2030; nel programma intermedio zero, perché la misura non è inclusa."
    chi: "Deciderebbero il Parlamento con la legge di bilancio e Stato e Regioni con un accordo; attuerebbero l'Agenzia per la cybersicurezza nazionale, le Regioni, le aziende sanitarie, i Comuni e la Difesa per la riserva. Ne beneficerebbero chi usa ospedali e servizi comunali e il personale pubblico formato. Pagherebbero chi gode delle agevolazioni fiscali riordinate e i capitoli per la sicurezza informatica già programmati da Interno, Difesa e Agenzia."
    oceano_blu:
      eliminare: "niente"
      ridurre: "Gli incidenti con impatto e i tempi di ripristino negli enti locali e nella sanità."
      aumentare: "Le competenze di base sulla sicurezza informatica di tutto il personale pubblico e i requisiti minimi di sicurezza nei capitolati."
      creare: "Una rete di centri di sicurezza regionali gratuiti per Comuni e sanità e una riserva cyber civile-militare attivabile nelle crisi."
  07-C7:
    perche: "La direttiva europea anticorruzione 2026/1021 va recepita entro l'1 giugno 2028 e chiede, all'articolo 7, di punire l'esercizio illecito di funzioni pubbliche quando è intenzionale (EUR-Lex 2026). Dopo l'abrogazione dell'abuso d'ufficio la Corte costituzionale ha parlato di \"indubbi vuoti di tutela\" (sentenza 95/2025). Nello stesso tempo la \"paura della firma\" frena chi decide: serve un reato stretto che colpisca solo l'abuso voluto, senza paralizzare l'amministrazione."
    come: "Il programma intermedio sceglie la versione piena, scelta da chi guida il progetto: recepimento entro il 2027 con un reato tassativo per chi ha poteri su appalti, concorsi, autorizzazioni ed erogazioni, solo con dolo intenzionale e solo per violazioni di regole precise scritte in una legge, mai per scelte discrezionali o semplice illegittimità. Chi segue un parere scritto preventivo è protetto, l'indagine non sospende in automatico dall'incarico, il reato non vale per il passato e nessuno è punito due volte per lo stesso fatto; le violazioni minori vanno all'Autorità nazionale anticorruzione (ANAC) come sanzioni amministrative. Chi segnala ha uno sportello e un fondo per l'assistenza legale, e un premio del 5-15% pagato solo con le somme recuperate in via definitiva, con filtri contro le segnalazioni opportunistiche. Si paga spostando circa 6 milioni l'anno nel bilancio pubblico."
    cosa: "Obiettivi: direttiva recepita entro l'1 giugno 2028 e nessuna procedura di infrazione; segnalazioni all'ANAC inammissibili o archiviate dal 55% (2025) al 40% nel 2029 e al 30% nel 2031; assistenza legale al 100% delle richieste ammissibili di chi segnala e subisce ritorsioni. Ogni anno si pubblicano iscrizioni, archiviazioni e condanne per il nuovo reato, per misurare la paura della firma, con revisione dopo 3 anni. Costo a regime: 0,006 mld €/anno dal 2028; i recuperi non sono usati come copertura."
    chi: "Decidono il Parlamento con la legge di delegazione europea e il Governo con il decreto legislativo; attuano il Ministero della Giustizia, l'ANAC e la magistratura. Ne beneficiano chi segnala illeciti, chi firma in buona fede, che ha più tutele di oggi, e la cittadinanza. Ci perdono i pubblici ufficiali che abusano in modo voluto delle regole e le imprese coinvolte nella corruzione, che rischiano sanzioni più alte."
    oceano_blu:
      eliminare: "Gli effetti automatici dell'indagine: nessuna sospensione dall'incarico per il nuovo reato prima di una condanna."
      ridurre: "La parte penale ai soli casi gravi e voluti: le violazioni minori dell'imparzialità passano a sanzioni amministrative e disciplinari."
      aumentare: "Le tutele per chi firma in buona fede e per chi segnala, con sportello e fondo di assistenza legale, e le sanzioni alle imprese fino ai massimi della direttiva."
      creare: "Un reato stretto di esercizio illecito di funzioni pubbliche, la protezione per chi segue un parere scritto preventivo e un premio per chi segnala pagato solo con le somme recuperate."
  08-P1:
    perche: "Nessuna norma regola l'uso dell'intelligenza artificiale come consulente delle leggi: chi la configura, con quali valori, con quale trasparenza e responsabilità (EUR-Lex; legge 132/2025). Intanto la fiducia nelle istituzioni è bassa: alle politiche 2022 ha votato il 63,9%, minimo storico (Ministero dell'Interno, Eligendo 2022). Gli obblighi europei per i sistemi ad alto rischio partono dal 2 dicembre 2027: conviene darsi regole prima."
    come: "Il programma intermedio sceglie la versione essenziale: una sezione di circa 30 persone dentro l'Ufficio parlamentare di bilancio pubblica una valutazione d'impatto sui valori, fatta con l'intelligenza artificiale, solo su legge di bilancio, decreti-legge e disegni di legge con costi sopra lo 0,1% del PIL. I pesi tra i valori li fissa un'Assemblea civica di 100 persone sorteggiate, con una sessione l'anno. Il parere non è mai vincolante; solo sulla legge di bilancio il Governo che se ne discosta deve spiegare perché. Si paga tagliando le consulenze esterne dei ministeri."
    cosa: "Obiettivi: atti obbligati con valutazione pubblicata nei termini da 0% ad almeno l'80% nel 2029 e il 95% nel 2031; scostamenti rilevanti con relazione motivata almeno al 70% nel 2029 e al 95% nel 2031; inviti al sorteggio accettati almeno al 10% nel 2029. L'affluenza è solo un indicatore di contesto, non attribuibile alla misura. Costo a regime: 0,015 mld €/anno dal 2029."
    chi: "Decide il Parlamento con una legge ordinaria e modifiche ai regolamenti delle Camere; attuano l'Ufficio parlamentare di bilancio e l'ISTAT per il sorteggio, con il parere dell'Agenzia per l'Italia digitale, dell'Agenzia per la cybersicurezza nazionale e del Garante della privacy. Ne beneficiano cittadinanza e opposizioni, che vedono effetti, chi guadagna e chi perde con le leggi più costose, e le generazioni future. Pagano le società di consulenza dei ministeri; il Governo perde un po' di libertà perché deve motivare gli scostamenti sulla manovra."
    oceano_blu:
      eliminare: "niente"
      ridurre: "Il peso delle consulenze esterne dei ministeri negli studi d'impatto."
      aumentare: "La trasparenza su chi guadagna e chi perde con le leggi più costose, su tre orizzonti di tempo."
      creare: "Una valutazione d'impatto pubblica fatta con l'intelligenza artificiale e un'Assemblea civica sorteggiata che fissa i pesi tra i valori."
  08-P2:
    perche: "Il Governo in carica ha posto la questione di fiducia 91 volte dall'inizio della legislatura, in media 2,85 al mese (Openpolis via stampa, dato non verificato su fonte primaria). Decreti-legge pieni di norme estranee e leggi mai valutate rendono le regole meno chiare per tutte e tutti. Il primo passo è far pubblicare il dato ufficiale."
    come: "Il programma intermedio sceglie la versione piena: legge ordinaria più modifiche ai regolamenti di Camera e Senato. Il Governo ottiene un binario veloce, con voto a data certa entro 60-90 giorni, per i suoi disegni di legge; in cambio gli emendamenti estranei al tema nella conversione dei decreti diventano inammissibili, come chiede la Corte costituzionale. Ogni legge con costi sopra 100 milioni l'anno dichiara come e quando sarà valutata, e gli uffici studi si rafforzano con circa 50 persone. Si paga dentro i bilanci interni delle Camere e della Presidenza del Consiglio, senza aumentarli."
    cosa: "Obiettivi: questioni di fiducia da 2,85 al mese a non più di 2 nel 2029 e di 1 nel 2031; leggi sopra 100 milioni con clausola di valutazione attuata almeno al 60% nel 2029 e al 90% nel 2031; decreti attuativi in ritardo di oltre 12 mesi -30% nel 2029 e -50% nel 2031. Costo a regime: 0,008 mld €/anno dal 2028."
    chi: "Decidono il Parlamento e le Giunte per il regolamento di Camera e Senato; attuano il Ministro per i Rapporti con il Parlamento, il Dipartimento per gli affari giuridici e legislativi della Presidenza del Consiglio e il Comitato per la legislazione. Ne beneficiano cittadini e imprese, con leggi più chiare e valutate, e le opposizioni, con tempi di esame veri. Ci perde il Governo, che rinuncia ai decreti \"omnibus\"; pagano le altre spese interne delle Camere, che vengono ridotte."
    oceano_blu:
      eliminare: "Gli emendamenti estranei al tema nella conversione dei decreti-legge."
      ridurre: "Il ricorso a decreti-legge e questioni di fiducia solo per avere tempi certi."
      aumentare: "La valutazione delle leggi costose e la forza degli uffici studi delle Camere e del Governo."
      creare: "Un binario veloce con voto a data certa per i disegni di legge del Governo."
  08-P3:
    perche: "Alle politiche 2022 ha votato il 63,9%, minimo storico (Eligendo 2022). La nuova legge elettorale (legge 180/2026) si applicherà al voto del 2027, entro 12 mesi dall'approvazione, contro il codice di buona condotta della Commissione di Venezia del Consiglio d'Europa; è la quarta riforma in circa vent'anni (Normattiva). Cambiare le regole a ridosso del voto mina la fiducia di tutte e tutti."
    come: "Il programma intermedio sceglie la versione \"solo regole\", a costo zero: una clausola di stabilità impedisce di cambiare gli elementi fondamentali della legge elettorale a ridosso del voto, ma vale solo dalla prossima legislatura e quindi è neutra per gli equilibri di oggi. Dopo ogni elezione un rapporto pubblico misura proporzionalità e rappresentanza, e ogni nuovo progetto di legge elettorale deve allegare simulazioni. Il voto strutturale nel comune dove si vive per studio, lavoro o cura resta nelle versioni più ampie, non nell'intermedio. Nessun costo: il rapporto lo prepara l'ufficio di valutazione delle Camere (08-P1) o l'ISTAT con le risorse che ha."
    cosa: "Obiettivo principale: zero modifiche agli elementi fondamentali della legge elettorale nei 12 mesi prima del voto, contro 1 oggi (legge 180/2026), sia nel 2029 sia nel 2031. Gli obiettivi sull'affluenza (almeno 64% nel 2027) e sul voto fuorisede dipendono dalle versioni più ampie. Costo a regime: zero."
    chi: "Decide il Parlamento con un disegno di legge preparato dal Ministro per le Riforme con il Ministero dell'Interno; il rapporto dopo il voto è dell'ufficio di valutazione delle Camere o dell'ISTAT. Ne beneficiano tutte le persone che votano, con regole note per tempo. Ci perdono le maggioranze future, che non potranno cambiare le regole all'ultimo momento; chi studia o lavora lontano da casa, con questa versione, non ottiene ancora il voto dove vive."
    oceano_blu:
      eliminare: "I cambi degli elementi fondamentali della legge elettorale a ridosso del voto, dalla prossima legislatura."
      ridurre: "niente"
      aumentare: "La trasparenza sugli effetti delle leggi elettorali, con simulazioni allegate a ogni nuovo progetto."
      creare: "Un rapporto pubblico dopo ogni elezione su proporzionalità e rappresentanza."
  08-P4:
    perche: "Sul solo bilancio pluriennale dell'UE l'Italia ha versato nel 2025 4,1 mld più di quanto ha ricevuto; con le sovvenzioni del Next Generation EU diventa beneficiaria netta per 6,0 mld (Commissione UE 2025, calcolo GovernAI). Con la fine del PNRR nel 2026 e l'inizio del rimborso del debito comune nel 2028 sono in gioco circa 10 mld l'anno. Il negoziato sul bilancio UE 2028-2034 si chiude entro il 2027: la posizione italiana va decisa ora."
    come: "Il programma intermedio sceglie la versione piena, a costo nazionale zero. L'Italia chiede nuove risorse proprie europee (dal mercato delle emissioni, dalla tassa sul carbonio alle frontiere e da un prelievo sulle grandi imprese) come condizione per rimborsare il debito comune, e un fondo per beni pubblici europei come difesa comune, reti, ricerca e adattamento al clima, legato al rispetto dello stato di diritto. Una legge rafforza la sessione europea annuale del Parlamento e allega una valutazione d'impatto alle posizioni negoziali. Nessun beneficio atteso dal negoziato è contato come copertura."
    cosa: "Obiettivi: saldo netto sul solo bilancio UE non peggiore di -4 mld nel 2029 e almeno -3 mld nel 2031; accordo su almeno 2 nuove risorse proprie entro il 2029 e risorse in riscossione nel 2031; almeno il 25% del prestito europeo per la difesa (SAFE) trasformato in programmi comuni nel 2029 e il 50% nel 2031. Costo a regime: zero; l'effetto sul bilancio dipende dall'esito del negoziato."
    chi: "Decidono il Governo nel Consiglio dell'UE, con il Ministro per gli Affari europei, il Ministero degli Esteri e il Ministero dell'economia, e il Parlamento con una risoluzione e una legge; l'esito dipende anche dagli altri Stati. Ne beneficiano i contribuenti italiani, se il rimborso del debito comune pesa meno sui bilanci nazionali, e i progetti europei comuni. Pagherebbero le grandi imprese e i settori inquinanti colpiti dalle nuove risorse proprie; c'è il rischio che si spostino fondi da coesione e agricoltura."
    oceano_blu:
      eliminare: "niente"
      ridurre: "La difesa delle sole quote nazionali come unica linea negoziale."
      aumentare: "Il controllo del Parlamento sul mandato negoziale europeo, con una sessione annuale rafforzata."
      creare: "Una proposta italiana di nuove risorse proprie UE e di un fondo per beni pubblici europei legato allo stato di diritto."
  08-P5:
    perche: "L'aiuto pubblico allo sviluppo italiano è lo 0,30% del reddito nazionale lordo, 6,46 mld nel 2025, contro l'obiettivo dello 0,7% richiamato dalla legge 125/2014 (OCSE 2025, dati preliminari). Di questo aiuto 1,33 mld, il 18,5%, sono costi per accogliere persone rifugiate in Italia e non arrivano ai Paesi partner. Le valutazioni rigorose dei programmi sono poche e non sistematiche."
    come: "Il programma intermedio sceglie la versione a risorse invariate: l'aiuto non può scendere in valore nominale, i costi di accoglienza si contano a parte e l'1% dei nuovi programmi finanzia una valutazione indipendente. Il Piano Mattei per l'Africa rispetta gli stessi standard, e si usano le conversioni del debito dei Paesi partner. Nessun costo per il bilancio: la valutazione si paga dentro gli stanziamenti già esistenti."
    cosa: "Obiettivi: quota dell'aiuto spesa per l'accoglienza in Italia riportata a parte e scesa dal 18,5% (2025) a non più del 15% nel 2029 e del 12% nel 2031; programmi con valutazione d'impatto rigorosa, che confronta chi riceve l'aiuto con chi non lo riceve, al 5% nel 2029 e al 10% nel 2031. La crescita dell'aiuto verso lo 0,35-0,50% del reddito nazionale resta nelle versioni più ampie. Costo a regime: zero."
    chi: "Decide il Parlamento con un disegno di legge; attuano il Ministero degli Esteri, l'Agenzia italiana per la cooperazione allo sviluppo e il Comitato interministeriale per la cooperazione. Ne beneficiano i Paesi partner, con un aiuto più trasparente ed efficace, e i contribuenti, che vedono i risultati. Nessuno paga di più, ma l'aiuto non cresce; chi gestisce programmi poco efficaci rischia di vederli chiusi dopo la valutazione."
    oceano_blu:
      eliminare: "La possibilità di ridurre l'aiuto allo sviluppo in valore nominale."
      ridurre: "Il peso dei costi di accoglienza in Italia dentro la cifra dichiarata come aiuto allo sviluppo."
      aumentare: "La trasparenza e la valutazione dei programmi, Piano Mattei compreso."
      creare: "Una contabilità separata dei costi di accoglienza e una valutazione indipendente finanziata con l'1% dei nuovi programmi."
  08-P6:
    perche: "Nel 2025 Germania, Stati Uniti e Francia assorbono il 32,2% dell'export italiano di beni, e i mercati fuori dall'UE diversi dagli Stati Uniti sono scesi al 37,8% dal 38,7% del 2024 (Eurostat Comext 2025). Dipendere da pochi mercati espone le imprese a dazi e crisi. Le piccole e medie imprese fanno più fatica ad aprire mercati nuovi."
    come: "La proposta non è nel programma intermedio: con le risorse disponibili altre misure danno più valore per euro. La versione piena prevede voucher per il 2027-2029 alle piccole e medie imprese che entrano in mercati nuovi (India, Sud-est asiatico, Mercosur, Africa, Golfo) con un piano di export, uno sportello unico digitale di ICE, SACE e SIMEST, aiuto ad adeguarsi alle nuove regole europee su carbonio, deforestazione e controlli sulla filiera, e una valutazione d'impatto di ogni accordo commerciale UE con compensazioni temporanee. Si pagherebbe spostando 0,3 mld dai fondi di promozione oggi usati per mercati maturi e con 0,1 mld di fondi europei di coesione per le imprese del Mezzogiorno fino al 2029."
    cosa: "Obiettivi della versione piena: export verso mercati fuori UE diversi dagli USA dal 37,8% al 39% nel 2029 e al 40% nel 2031; peso dei primi tre mercati dal 32,2% a non più del 31% nel 2029 e del 30% nel 2031; almeno 2 € di export in più per ogni euro pubblico rispetto a un gruppo di controllo, altrimenti la misura chiude. Costo della versione piena: 0,4 mld €/anno nel 2029, solo per il triennio; nel programma intermedio zero, perché la misura non è inclusa."
    chi: "Deciderebbe il Parlamento con la legge di bilancio; attuerebbero il Ministero degli Esteri, il Ministero delle Imprese, ICE, SACE e SIMEST. Ne beneficerebbero le piccole e medie imprese alla prima esportazione e i territori del Mezzogiorno. Pagherebbero le imprese che oggi ricevono sostegni per mercati maturi già serviti; con gli accordi commerciali alcune filiere agricole possono perdere, con compensazioni temporanee e decrescenti."
    oceano_blu:
      eliminare: "niente"
      ridurre: "I sostegni alla promozione su mercati maturi già serviti."
      aumentare: "Il sostegno alle piccole e medie imprese alla prima esportazione verso mercati nuovi."
      creare: "Uno sportello unico digitale per l'export e una valutazione d'impatto per settore e territorio di ogni accordo commerciale UE."
  08-P7:
    perche: "Nel 2024 il 54,8% delle gare con confronto tra imprese è stato aggiudicato con una sola offerta (ANAC open data 2024, elaborazione GovernAI); per la Commissione europea oltre il 20% è un risultato scarso. Il numero di offerte è noto solo per circa 56.000 procedure su 191.000. Chi comunica meno dati sembra meno a rischio: per questo va misurata anche la reticenza."
    come: "Il programma intermedio sceglie la versione piena. L'Autorità nazionale anticorruzione (ANAC) pubblica ogni trimestre un cruscotto aperto dei rischi per ente e per settore, con indicatori e pesi dichiarati e confronto con l'atteso nazionale; ogni ente ha un indicatore pubblico di completezza dei dati, e determine e bandi si pubblicano in formato aperto e leggibile, collegati al codice della gara. Il cruscotto valuta enti e procedure, mai persone, e non si usa mai in automatico per sanzioni o esclusioni; ogni anno una validazione indipendente misura i falsi allarmi. Si paga spostando risorse nel bilancio dell'ANAC e tagliando consulenze esterne della pubblica amministrazione."
    cosa: "Obiettivi: procedure con numero di offerte comunicato dal 29% (2024) all'80% nel 2029 e al 95% nel 2031; aggiudicazioni con una sola offerta dal 54,8% al 45% nel 2029 e al 35% nel 2031; atti di gara in formato testuale collegati al codice della gara al 60% nel 2029 e al 95% nel 2031. Costo a regime: 0,008 mld €/anno dal 2028."
    chi: "Decide il Parlamento con un disegno di legge; attuano l'ANAC, l'Agenzia per l'Italia digitale e il Dipartimento per la trasformazione digitale, con università e Corte dei conti per la validazione. Ne beneficiano cittadinanza, stampa, consigli locali e responsabili anticorruzione degli enti, che possono fare domande documentate, e le imprese oneste, con più concorrenza. Pagano le società di consulenza della pubblica amministrazione; gli enti poco trasparenti sono esposti al confronto pubblico, con un rischio di gogna per i piccoli ridotto da avvertenze e diritto di replica."
    oceano_blu:
      eliminare: "niente"
      ridurre: "Le gare aggiudicate con una sola offerta e i dati mancanti sulle procedure."
      aumentare: "La completezza e l'apertura dei dati sugli appalti, con un indicatore pubblico di reticenza per ente."
      creare: "Un cruscotto pubblico trimestrale dei rischi negli appalti, con validazione indipendente annuale e lettura assistita degli atti per i responsabili anticorruzione."
  08-P8:
    perche: "L'Italia non ha una legge nazionale sulle lobby: la Commissione europea la raccomanda dal 2023 e nel 2026 vede solo \"progressi limitati\" (Rapporto sullo Stato di diritto 2026). Il disegno di legge fermo al Senato esclude sindacati e associazioni datoriali, non prevede l'impronta legislativa e non obbliga le società di lobbying a dire per chi lavorano. Senza regole chi non ha accesso ai decisori non vede chi ce l'ha."
    come: "Il programma intermedio sceglie la versione piena. Nasce un registro unico, obbligatorio e gratuito presso l'ANAC per tutti quelli che incontrano i decisori per influenzare un atto, sindacati e associazioni datoriali compresi, con clienti e spese dichiarati: senza iscrizione niente incontri, e la sanzione vale anche per il decisore; restano liberi i contatti di cittadini e associazioni che difendono un interesse proprio. Membri del Governo, capi di gabinetto e dirigenti di vertice pubblicano l'agenda degli incontri, ogni atto del Governo elenca gli interessi ascoltati (impronta legislativa), gli ex membri del Governo hanno un periodo di raffreddamento di 2 anni e un registro unico pubblica i finanziamenti alla politica sopra 500 € con soli nome, importo e destinatario. Si paga con il bilancio dell'ANAC e le spese di funzionamento della Presidenza del Consiglio."
    cosa: "Obiettivi: giudizio della Commissione europea da \"progressi limitati\" a \"progressi significativi\" nel 2029 e raccomandazione chiusa nel 2031; disegni di legge del Governo con impronta legislativa da 0% al 90% nel 2029 e al 100% nel 2031; indicatore OCSE di integrità sulle lobby nella pratica dal 44% al 60% nel 2029 e al 70% nel 2031. Costo a regime: 0,004 mld €/anno dal 2028."
    chi: "Decide il Parlamento con una legge o con emendamenti al disegno di legge già al Senato; attua l'ANAC; per Regioni e grandi Comuni valgono principi comuni con intesa, per le Camere servono modifiche dei regolamenti. Ne beneficiano chi oggi non ha accesso ai decisori e la cittadinanza, che vede chi influenza le leggi. Hanno nuovi obblighi i rappresentanti di interessi, parti sociali comprese, i decisori e i partiti con le fondazioni collegate; chi dona più di 500 € l'anno vede pubblicati nome, importo e destinatario per 5 anni."
    oceano_blu:
      eliminare: "Le esenzioni per categoria, parti sociali comprese, e gli incontri di influenza con soggetti non iscritti."
      ridurre: "Il passaggio immediato degli ex membri del Governo all'attività di lobby, con 2 anni di raffreddamento."
      aumentare: "La trasparenza su incontri, clienti, spese di lobbying e finanziamenti alla politica."
      creare: "Un registro nazionale obbligatorio delle lobby, l'agenda pubblica dei decisori, l'impronta legislativa e un registro unico dei finanziamenti alla politica."
  08-P9:
    perche: "Sui conflitti di interessi l'Italia rispetta il 100% dei criteri OCSE sulle regole ma solo il 22% sulla pratica, contro una media OCSE del 45% (OCSE 2026). Il Gruppo di Stati contro la corruzione del Consiglio d'Europa a giugno 2026 ha trovato attuata 1 sola raccomandazione su 19 (GRECO 2026, da verificare), e manca la verifica di merito delle dichiarazioni patrimoniali. Nel 2025 la legge 122/2025 ha abolito il periodo di attesa per chi passa da cariche locali e regionali alla guida di società pubbliche."
    come: "Il programma intermedio sceglie la versione piena. Una sezione per l'integrità dentro l'ANAC, di circa 70 persone, riceve in formato digitale le dichiarazioni patrimoniali e di interessi di circa 10-12 mila titolari di incarichi di vertice e le verifica: sempre per i vertici, a sorteggio per il 20% degli altri e per il 10% nei Comuni tra 15.000 e 50.000 abitanti, con accesso ai dati fiscali previsto dalla legge, caso per caso e tracciato; il coniuge dichiara solo se acconsente e i suoi dati non sono mai pubblicati, e sotto i 15.000 abitanti non c'è nessun obbligo nuovo. Chi lascia un incarico di vertice chiede un parere vincolante, entro 60 giorni, prima di lavorare per un privato del settore; torna il periodo di attesa abolito nel 2025 e una nuova legge sui conflitti di interessi del Governo sostituisce quella del 2004. Si paga con il bilancio dell'ANAC e le spese di funzionamento dei ministeri."
    cosa: "Obiettivi: indicatore OCSE sui conflitti di interessi nella pratica dal 22% al 40% nel 2029 e al 50% nel 2031; raccomandazioni del Consiglio d'Europa attuate da 1 a 8 nel 2029 e a 15 nel 2031; dichiarazioni verificate nel merito almeno 2.000 l'anno nel 2029 e 3.000 nel 2031; tutti i pareri sulle porte girevoli resi entro 60 giorni. Costo a regime: 0,01 mld €/anno dal 2028."
    chi: "Decide il Parlamento con un disegno di legge; attua l'ANAC con il parere del Garante della privacy; per le Regioni valgono principi comuni con intesa, e le Camere sono invitate ad affidare alla Sezione le verifiche sui parlamentari. Ne beneficiano la cittadinanza e chi decide in modo corretto, che ha regole chiare. Hanno nuovi obblighi circa 10-12 mila titolari di incarichi di vertice; le imprese che assumono ex decisori devono attendere il parere, al massimo 60 giorni."
    oceano_blu:
      eliminare: "niente"
      ridurre: "Il passaggio senza controlli da incarichi pubblici di vertice a imprese del settore regolato o finanziato."
      aumentare: "Le verifiche di merito sulle dichiarazioni patrimoniali e di interessi, oggi non sistematiche."
      creare: "Una sezione per l'integrità dentro l'ANAC con dichiarazione digitale unica, verifiche a sorteggio e parere preventivo vincolante sulle porte girevoli."
  08-P10:
    perche: "Nel 2025 i contratti pubblici sopra 40.000 € sono stati 287.421 per 309,7 mld €, di cui circa 20,8 legati al PNRR (Relazione ANAC 2025, sintesi da verificare). Chi partecipa a una gara non deve dichiarare in modo sistematico chi lo controlla davvero, nessuno lo verifica in automatico e il registro dei titolari effettivi è sospeso (Rapporto sullo Stato di diritto 2026). Così conflitti di interessi e società schermo emergono solo a indagine aperta."
    come: "Il programma intermedio sceglie la versione piena. Chi partecipa a gare da 40.000 € o chiede contributi da 100.000 € dichiara una sola volta, nel fascicolo digitale dell'impresa, la persona che la controlla davvero (titolare effettivo), e la dichiarazione è verificata in automatico con il registro delle imprese, il registro dei titolari effettivi quando operativo e i registri collegati degli altri Stati UE. Solo una dichiarazione falsa porta all'esclusione, mentre un'omissione si può correggere; per gli aggiudicatari sopra 1 milione di € si pubblicano nome, quota e contratto per la durata del contratto più 5 anni, con parere del Garante della privacy. Si paga spostando circa 4 milioni l'anno nei bilanci di ANAC e Agenzia per l'Italia digitale."
    cosa: "Obiettivi: procedure sopra 40.000 € con titolare effettivo dichiarato e verificato, oggi senza obbligo, all'80% nel 2029 e al 98% nel 2031; pubblicazione annuale delle esclusioni per dichiarazione falsa e dei conflitti di interessi scoperti prima dell'aggiudicazione. Costo a regime: 0,004 mld €/anno dal 2029."
    chi: "Decide il Governo con un decreto legislativo correttivo del codice dei contratti pubblici; attuano l'ANAC, l'Agenzia per l'Italia digitale e il sistema delle Camere di commercio, con le stazioni appaltanti. Ne beneficiano le stazioni appaltanti, con meno controlli a mano, e le imprese oneste. Le imprese fornitrici hanno un adempimento una tantum, le persone che controllano i grandi aggiudicatari vedono pubblicato il proprio nome, e ci perde chi usa società schermo."
    oceano_blu:
      eliminare: "La dichiarazione ripetuta a ogni gara: il titolare effettivo si dichiara una sola volta nel fascicolo digitale e si aggiorna solo se cambia."
      ridurre: "I controlli manuali delle stazioni appaltanti."
      aumentare: "Le verifiche sui conflitti di interessi nella singola gara, prima dell'aggiudicazione."
      creare: "La dichiarazione del titolare effettivo verificata in automatico per gare e contributi pubblici, con pubblicazione per i grandi aggiudicatari."
  08-P11:
    perche: "La Relazione ANAC 2025 segnala un aumento del 35% delle distrazioni di fondi PNRR (sintesi da verificare), mentre la vigilanza dell'ANAC è scesa da 450 a 208 procedimenti in un anno (Rapporto sullo Stato di diritto 2026). Oggi i controlli sul posto arrivano soprattutto dopo una segnalazione, quindi chi non è segnalato sa di avere poche probabilità di essere controllato. In Brasile i controlli sorteggiati hanno ridotto la corruzione futura dell'8% (Journal of Political Economy 2018)."
    come: "Il programma intermedio sceglie la versione piena. Ogni anno un sorteggio pubblico in diretta estrae 300 enti che spendono fondi PNRR, di coesione o per investimenti statali, divisi per dimensione e territorio; squadre dell'Ispettorato della Ragioneria generale dello Stato e dell'ANAC controllano sul posto un campione di spese e gare e pubblicano un rapporto entro 90 giorni, con le osservazioni dell'ente. Gli errori in buona fede portano a un piano di correzione con l'aiuto delle squadre tecniche (09-C3), non a sanzioni, mentre i fatti gravi vanno a Corte dei conti e procura come oggi. Si paga con le spese di funzionamento del Ministero dell'economia; nel 2027-29 una piccola parte può venire dall'assistenza tecnica dei fondi di coesione."
    cosa: "Obiettivi: 300 enti verificati a sorte ogni anno nel 2029 e nel 2031; rapporti pubblicati entro 90 giorni almeno al 90% nel 2029 e al 95% nel 2031; piani di correzione completati entro 12 mesi al 70% nel 2029 e all'85% nel 2031. Un gruppo di enti non sorteggiati permette di misurare l'effetto. Costo a regime: 0,01 mld €/anno dal 2028."
    chi: "Decide il Parlamento con un disegno di legge; attuano la Ragioneria generale dello Stato e l'ANAC, d'intesa con le Regioni per le loro risorse e in coordinamento con le autorità di audit dei fondi europei, mentre ISTAT e università valutano. Ne beneficiano cittadinanza e consigli locali, che ricevono un rapporto pubblico sull'uso dei fondi. Gli enti estratti, circa 300 l'anno, sostengono per qualche settimana il carico del controllo; ci perde chi distrae fondi contando di non essere controllato."
    oceano_blu:
      eliminare: "La prevedibilità dei controlli: oggi chi non è segnalato sa di essere controllato di rado."
      ridurre: "niente"
      aumentare: "I controlli sul posto e la pubblicità dei loro risultati."
      creare: "Un sorteggio pubblico annuale degli enti da controllare, con gruppo di confronto e piani di correzione per gli errori in buona fede."
  09-C1:
    perche: "Nessuna analisi d'impatto del Governo è oggi accompagnata per obbligo da dati e codice riproducibili. Eppure la pubblica amministrazione scambia già dati su larga scala: oltre 14.000 servizi e oltre 9.400 enti sulla Piattaforma digitale nazionale dati (Dipartimento per la trasformazione digitale 2026). I dati esistono, ma le analisi su cui si decide non sono pubbliche."
    come: "Il programma intermedio sceglie la versione piena. Ogni atto del Governo con valutazione d'impatto pubblica (08-P1) pubblica dati, codice e ipotesi in formato aperto, mentre i microdati sensibili restano in ambienti sicuri di ISTAT e Banca d'Italia; i modelli pubblici di simulazione di Ragioneria, Finanze e INPS diventano software aperto; un registro unico traccia analisi e algoritmi della pubblica amministrazione. Il controllo spetta all'ufficio indipendente delle Camere previsto da 08-P1, così non si paga due volte. Si pagano circa 120-150 persone tra Dipartimento per la trasformazione digitale, ISTAT e Ragioneria tagliando consulenze esterne per studi d'impatto e con il piano triennale dell'Agenzia per l'Italia digitale."
    cosa: "Obiettivi: atti con valutazione d'impatto che pubblicano dati e codice da 0% al 60% nel 2029 e al 90% nel 2031; analisi del campione rifatte con successo dall'ufficio di controllo almeno al 50% nel 2029 e all'80% nel 2031; modelli pubblici di simulazione con licenza aperta da 0 a 3 nel 2029 e 6 nel 2031. Costo a regime: 0,07 mld €/anno dal 2029."
    chi: "Decide il Parlamento con un disegno di legge insieme a 08-P1; attuano il Dipartimento per la trasformazione digitale, l'ISTAT, la Ragioneria generale, il Dipartimento Finanze e l'INPS, con il parere del Garante della privacy. Ne beneficiano ricerca, stampa, opposizioni e cittadinanza, che possono rifare i conti delle scelte pubbliche. Pagano le società di consulenza per studi d'impatto; le amministrazioni perdono la possibilità di mostrare solo gli scenari favorevoli."
    oceano_blu:
      eliminare: "La possibilità di pubblicare solo gli scenari favorevoli: si registrano tutte le analisi eseguite."
      ridurre: "Le consulenze esterne per studi e analisi d'impatto."
      aumentare: "La trasparenza e la riproducibilità delle analisi su cui si decide."
      creare: "Un registro unico delle analisi e degli algoritmi della pubblica amministrazione e modelli pubblici di simulazione aperti a tutti."
  09-C2:
    perche: "Nel 2025 solo il 43,5% delle persone tra 16 e 74 anni ha usato servizi online della pubblica amministrazione, contro il 57,7% della media UE (Eurostat 2025). L'offerta di servizi digitali è sopra la media UE, ma nessuno misura in quante pratiche lo Stato evita di chiedere dati che già possiede. Il problema non è l'infrastruttura, è il suo uso."
    come: "Il programma intermedio sceglie la versione senza fondi dedicati: diventa un diritto che l'ente non chieda dati che lo Stato già possiede (principio \"una volta sola\") e li prenda dalla Piattaforma digitale nazionale dati costruita con il PNRR. Un cruscotto pubblico mostra, ente per ente, quali procedimenti rispettano il principio, e ogni persona può vedere chi ha consultato i propri dati. Dopo 36 mesi, se l'ente chiede di nuovo un dato già posseduto, scatta un indennizzo pagato dall'ente stesso. Le amministrazioni si adeguano con risorse proprie: nessuna spesa nuova per lo Stato."
    cosa: "Obiettivi: persone tra 16 e 74 anni che usano servizi pubblici online dal 43,5% al 52% nel 2029 e al 60% nel 2031; procedimenti dell'elenco con dati presi solo dalla piattaforma, oggi non misurati, a 50 su 100 nel 2029 e 100 su 100 nel 2031; indennizzi in calo una volta in vigore. Costo a regime per lo Stato: zero; gli eventuali indennizzi pesano sui bilanci degli enti inadempienti."
    chi: "Decide il Governo con un decreto legislativo, d'intesa con Regioni e Comuni in Conferenza unificata; attuano il Ministro per la pubblica amministrazione, il Dipartimento per la trasformazione digitale, l'Agenzia per l'Italia digitale e tutte le amministrazioni. Ne beneficiano persone e imprese, che non devono più portare documenti che lo Stato ha già. Pagano gli enti inadempienti con gli indennizzi; senza fondi i Comuni piccoli, 5.522 sotto i 5.000 abitanti (ISTAT 2026), rischiano ritardi, per questo serve il sostegno delle squadre tecniche (09-C3)."
    oceano_blu:
      eliminare: "La richiesta a persone e imprese di dati che lo Stato già possiede."
      ridurre: "niente"
      aumentare: "L'uso effettivo della Piattaforma digitale nazionale dati per scambiare informazioni tra enti."
      creare: "Un diritto esigibile alla regola \"una volta sola\", con indennizzo dopo 36 mesi e un cruscotto pubblico per ente."
  09-C3:
    perche: "Al 31 marzo 2026 solo 3.919 amministrazioni erano qualificate dall'ANAC per bandire gare, a fronte di 7.896 Comuni, di cui 5.522 sotto i 5.000 abitanti (ANAC 2026; ISTAT 2026). Il personale specializzato in informatica è il 3,8% degli occupati in Italia contro il 5,0% nell'UE (Eurostat 2025). La maggior parte dei Comuni non ha né un ufficio gare qualificato né personale informatico."
    come: "Il programma intermedio sceglie la versione essenziale: 3.000 tecnici (informatica, sicurezza informatica, appalti, progettazione, dati) in un ruolo unico nazionale con carriera tecnica, organizzati in squadre regionali che fanno da stazione appaltante qualificata e da presidio informatico per i Comuni sotto i 5.000 abitanti del Mezzogiorno e delle aree interne. L'adesione dei Comuni è volontaria e ha priorità il personale esperto assunto con il PNRR e valutato positivamente. Si paga senza nuovi fondi: una parte delle assunzioni già autorizzate per sostituire chi va in pensione va a profili tecnici invece che generici (circa 0,18 mld) e le squadre sostituiscono consulenze e assistenza tecnica esterne (circa 0,04 mld)."
    cosa: "Obiettivi: Comuni sotto 5.000 abitanti serviti da una squadra qualificata da 0 a 2.000 nel 2029 e 4.000 nel 2031; tutti i Comuni aderenti coperti da una stazione appaltante qualificata, con tempi di aggiudicazione -20% rispetto ai non aderenti nel 2031; tempo medio di pagamento delle fatture negli enti aderenti da 30 a 27 giorni nel 2029 e 25 nel 2031. Costo a regime: 0,22 mld €/anno dal 2029."
    chi: "Decidono il Parlamento con una legge delega e il Governo con un decreto legislativo, d'intesa con Regioni e Comuni in Conferenza unificata; attuano Funzione pubblica, Regioni, ANAC e l'Agenzia per la rappresentanza negoziale delle pubbliche amministrazioni (ARAN) per la carriera tecnica. Ne beneficiano i piccoli Comuni, chi ci abita e il personale esperto del PNRR che resta. Ci perdono chi si candida a profili amministrativi generici, con meno posti, e le società di consulenza e assistenza tecnica."
    oceano_blu:
      eliminare: "niente"
      ridurre: "Le assunzioni in profili amministrativi generici e le consulenze esterne."
      aumentare: "Le competenze tecniche nei piccoli Comuni e il numero di enti serviti da una stazione appaltante qualificata."
      creare: "Un ruolo unico nazionale di personale tecnico pubblico, con squadre regionali condivise tra i piccoli Comuni."
  09-C4:
    perche: "Con il PNRR circa 13.000 amministrazioni sono passate al cloud, oltre l'obiettivo di 12.464 (Dipartimento per la trasformazione digitale 2026). Dal 2027 i canoni diventano spesa corrente dei singoli enti e non esiste una stima ufficiale del fabbisogno: il rischio è tornare a server locali non sicuri. L'Italia ha subito il 10,2% degli incidenti informatici gravi nel mondo (Clusit, primo semestre 2025)."
    come: "Il programma intermedio sceglie la versione senza fondo, a costo zero. Ogni contratto cloud deve avere una clausola di uscita, con dati e servizi trasferibili in formati aperti; un accordo quadro di Consip, la centrale acquisti dello Stato, fissa prezzi massimi dei canoni; gli enti iscrivono i canoni nei propri bilanci e i risparmi ottenuti (server dismessi, energia, licenze) sono pubblicati. Il contributo statale ai canoni resta nelle versioni più ampie."
    cosa: "Obiettivi: amministrazioni su cloud qualificati da oltre il 75% ad almeno l'85% nel 2029, senza ritorni a server locali, e al 95% nel 2031; risparmi certificati pari ad almeno il 25% dei canoni nel 2029 e al 50% nel 2031. Costo a regime: zero."
    chi: "Decide il Governo con un decreto legislativo; attuano il Dipartimento per la trasformazione digitale, l'Agenzia per l'Italia digitale, l'Agenzia per la cybersicurezza nazionale, Consip e gli enti. Ne beneficiano gli enti, con canoni più bassi e liberi di cambiare fornitore, e chi usa i servizi, che restano più sicuri. Perdono margini i fornitori cloud; i piccoli enti pagano i canoni con i propri bilanci, perché questa versione non evita il salto di spesa."
    oceano_blu:
      eliminare: "Il legame obbligato con un solo fornitore: clausola di uscita e portabilità in ogni contratto."
      ridurre: "Il prezzo dei canoni cloud, con prezzi massimi in un accordo quadro Consip."
      aumentare: "La trasparenza dei costi: i canoni sono iscritti nei bilanci degli enti."
      creare: "Una contabilità pubblica dei risparmi ottenuti con il passaggio al cloud."
  09-C5:
    perche: "Nel 2025 il 54,3% delle persone tra 16 e 74 anni aveva competenze digitali almeno di base, contro il 60,4% nell'UE e un obiettivo 2030 dell'80% (Eurostat 2025). Nella pubblica amministrazione l'intelligenza artificiale si usa in modo disomogeneo, spesso con strumenti non autorizzati, e non esiste un albo pubblico dei sistemi in uso. Gli errori degli algoritmi possono colpire i diritti delle persone."
    come: "Il programma intermedio sceglie la versione essenziale. Ogni sistema di intelligenza artificiale che incide su provvedimenti va iscritto in un albo dell'Agenzia per l'Italia digitale con la valutazione d'impatto sui diritti pubblicata, e nessuna decisione con effetti giuridici si prende senza revisione umana motivata. Un assistente pubblico condiviso, con modelli aperti su infrastruttura qualificata, sostituisce le licenze sparse; la formazione su intelligenza artificiale e dati avviene nelle ore già previste, e i punti di aiuto digitale si rafforzano solo in aree interne e Mezzogiorno. Si paga tagliando licenze e spese informatiche duplicate (0,05 mld) e con fondi europei di coesione fino al 2029 (0,03 mld)."
    cosa: "Obiettivi: sistemi di intelligenza artificiale che incidono su provvedimenti iscritti nell'albo con valutazione pubblica dallo 0% al 100% nel 2029; personale con 24 ore di formazione su intelligenza artificiale e dati al 60% nel 2029 e al 100% nel 2031; persone con competenze digitali di base dal 54,3% al 64% nel 2029. Costo a regime: 0,08 mld €/anno dal 2028."
    chi: "Decide il Governo con un decreto del Presidente del Consiglio e una direttiva del Ministro per la pubblica amministrazione; attuano l'Agenzia per l'Italia digitale, il Dipartimento per la trasformazione digitale e la Scuola nazionale dell'amministrazione. Ne beneficiano le persone che ricevono provvedimenti, protette da revisione umana e ricorso semplice, e chi lavora nella pubblica amministrazione, con strumenti autorizzati e formazione. Pagano i fornitori di licenze duplicate; i territori fuori da aree interne e Mezzogiorno non hanno aiuto digitale aggiuntivo."
    oceano_blu:
      eliminare: "Le decisioni con effetti giuridici prese da una macchina senza revisione umana motivata."
      ridurre: "Le licenze sparse e duplicate e l'uso di strumenti non autorizzati."
      aumentare: "Le competenze del personale pubblico su intelligenza artificiale e dati."
      creare: "Un albo pubblico dei sistemi di intelligenza artificiale con valutazione d'impatto sui diritti e un assistente pubblico condiviso con modelli aperti."
  09-C6:
    perche: "Nel 2024 nella pubblica amministrazione i procedimenti disciplinari sono stati 11.328, lo 0,34% del personale, con 590 licenziamenti; altri 979 erano ancora aperti a sei mesi dalla fine dell'anno (Funzione pubblica 2024). Quasi tutto il personale riceve la valutazione massima, il 98% secondo una dichiarazione ripresa dall'Osservatorio sui conti pubblici italiani (2026; dato ufficiale da costruire). Il problema più diffuso non sono i pochi casi gravi, ma uffici senza obiettivi misurabili in cui nessuno risponde dei risultati."
    come: "Il programma intermedio sceglie la versione piena. Ogni amministrazione con più di 50 dipendenti mette nel proprio piano integrato da 3 a 5 indicatori di servizio (tempi, arretrati, errori, soddisfazione) calcolati dai sistemi e pubblicati in un cruscotto nazionale, e le valutazioni massime vanno al massimo al 30% del personale per ufficio, come prevede la legge sul merito. Prima di un procedimento per scarso rendimento c'è un piano di miglioramento di 6-12 mesi scritto con la persona; gli uffici disciplinari dei Comuni sotto i 15.000 abitanti si gestiscono in forma associata e i dati disciplinari si pubblicano ogni anno per ente; sono vietati biometria, riconoscimento delle emozioni e valutazioni automatiche. Si paga riducendo i contratti esternalizzati di lavoro d'ufficio delle amministrazioni centrali."
    cosa: "Obiettivi: personale con valutazione massima da circa il 98% a non più del 30% per ufficio dirigenziale generale nel 2029; procedimenti disciplinari ancora aperti a 6 mesi dall'8,6% a non più del 5% nel 2029 e del 3% nel 2031; amministrazioni sopra i 50 dipendenti con indicatori di servizio pubblicati al 60% nel 2029 e al 100% nel 2031. Volutamente non c'è un obiettivo di \"più licenziamenti\". Costo a regime: 0,03 mld €/anno dal 2028."
    chi: "Decide il Parlamento con un disegno di legge, preceduto da una direttiva del Ministro per la pubblica amministrazione; attuano la Funzione pubblica, l'ARAN con i sindacati per il modello di piano di miglioramento e le associazioni di Comuni e Province per gli uffici associati. Ne beneficiano cittadini e imprese, con servizi misurati, e chi lavora con impegno. Ci perdono chi non lavora e la dirigenza che non valuta, che ne risponde; pagano le ditte a cui oggi è affidato lavoro d'ufficio esternalizzato."
    oceano_blu:
      eliminare: "Le valutazioni tutte uguali: le valutazioni massime non superano il 30% per ufficio."
      ridurre: "I procedimenti disciplinari che restano aperti o decadono per mancanza di uffici competenti."
      aumentare: "La misura pubblica dei risultati degli uffici e la responsabilità della dirigenza che non valuta."
      creare: "Un piano di miglioramento obbligatorio prima della sanzione per scarso rendimento e uffici disciplinari associati per i piccoli Comuni."
  09-C7:
    perche: "Nella pubblica amministrazione italiana l'intelligenza artificiale è appena all'inizio: 45 enti su 108 censiti hanno iniziative, con 120 progetti in tutto (Agenzia per l'Italia digitale 2025). Non esiste una mappa dei lavori ripetitivi né una regola su dove va il tempo liberato. Le mansioni d'ufficio sono le più esposte, e lo sono di più i posti delle donne: 9,6% contro 3,5% degli uomini nei Paesi ad alto reddito (Organizzazione internazionale del lavoro 2025)."
    come: "Il programma intermedio sceglie la versione pilota: per tre anni in tre amministrazioni, un ministero, una Regione del Mezzogiorno e un grande Comune, si mappano i lavori ripetitivi d'ufficio, si automatizzano i più pesanti e prima si firma con ARAN e sindacati un patto di riallocazione. Almeno il 70% del tempo liberato va a sportello, controlli e arretrati, chi cambia mansione ha formazione retribuita e nessuno perde il posto o viene trasferito d'ufficio per l'automazione; una valutazione indipendente misura le ore liberate. Si paga solo con fondi europei di coesione nel 2027-29, senza costi permanenti."
    cosa: "Obiettivi della misura: ore liberate certificate e spostate sui servizi almeno al 2% delle ore d'ufficio censite nel 2029 e al 5% nel 2031; almeno il 70% delle ore liberate a sportello, controlli e arretrati; zero licenziamenti per automazione; tempi dei procedimenti automatizzati -20% nel 2029 e -30% nel 2031. Costo della versione pilota: 0,02 mld €/anno solo nel 2027-29, nessun costo a regime."
    chi: "Decide il Ministro per la pubblica amministrazione con un decreto; attuano il Dipartimento per la trasformazione digitale, l'Agenzia per l'Italia digitale e la Ragioneria generale per la certificazione delle ore, con ARAN e sindacati. Ne beneficiano le persone che usano gli sportelli e chi lavora, che lascia compiti ripetitivi. Paga il bilancio europeo della coesione; i posti che dopo la certificazione risultano non più necessari possono non essere sostituiti al pensionamento."
    oceano_blu:
      eliminare: "Una parte del lavoro ripetitivo d'ufficio, come protocollare, ricopiare dati e controllare documenti standard."
      ridurre: "I tempi dei procedimenti automatizzati."
      aumentare: "Il tempo di lavoro dedicato a sportello, controlli e arretrati."
      creare: "Una mappa dei processi ripetitivi, un patto di riallocazione con i sindacati e una contabilità certificata delle ore liberate."
  09-C8:
    perche: "Nel settore pubblico lavorano oltre 3,7 milioni di persone: il 76,6% ha almeno 40 anni e 661.919 hanno tra 55 e 59 anni; l'INPS stima che al massimo un terzo andrà in pensione entro dieci anni (INPS 2025). Oggi chi esce si sostituisce di solito con lo stesso profilo, e la formazione non è legata ai cambi di mansione. Ogni uscita è un'occasione per ripensare il posto, ma anche il rischio di perdere conoscenze uniche."
    come: "Il programma intermedio sceglie la versione essenziale. Nel piano di ogni amministrazione, per ogni pensionamento previsto si decide in modo motivato e pubblico se sostituire con lo stesso profilo, assumere un profilo diverso, riqualificare personale interno o non sostituire perché l'attività è stata automatizzata e certificata. Per circa 2.250 posti critici l'anno, soprattutto nei Comuni sotto i 5.000 abitanti, nella parte amministrativa della sanità e nei sistemi informativi, chi subentra arriva 4 mesi prima per imparare da chi esce, con un'Accademia delle competenze pubbliche in versione ridotta. Si paga riducendo i contratti esternalizzati di lavoro d'ufficio (0,06 mld) e con fondi europei di coesione fino al 2029 (0,02 mld)."
    cosa: "Obiettivi: pensionamenti con decisione motivata nel piano dei fabbisogni all'80% nel 2029 e al 100% nel 2031; personale riqualificato e ricollocato ad almeno 20.000 persone in tutto nel 2029 e 50.000 nel 2031; età media del personale stabile, oggi 49 anni e 4 mesi, in calo. Costo a regime: 0,08 mld €/anno fino al 2029, 0,06 dal 2030."
    chi: "Decide il Parlamento con la legge di bilancio; attuano la Funzione pubblica, l'INPS e la Ragioneria per le stime delle uscite, la Scuola nazionale dell'amministrazione e tutte le amministrazioni. Ne beneficiano i servizi, che non si fermano quando una persona va in pensione, e chi lavora, che ha diritto a riqualificarsi dentro l'orario. Pagano le ditte di lavoro d'ufficio esternalizzato; la scelta di non sostituire vale solo dopo la certificazione, e nessuna persona è spinta a uscire."
    oceano_blu:
      eliminare: "La sostituzione automatica di chi va in pensione con lo stesso profilo."
      ridurre: "niente"
      aumentare: "La riqualificazione del personale, con il diritto e il dovere di formarsi quando cambia mansione."
      creare: "L'affiancamento di 4 mesi sui posti critici e un'Accademia delle competenze pubbliche."
  09-C9:
    perche: "Nella pubblica amministrazione l'intelligenza artificiale è adottata a pezzi: 45 enti su 108 censiti hanno iniziative, e nessuno misura le ore liberate né dove vanno (Agenzia per l'Italia digitale 2025). Intanto mancano persone nei servizi: per arrivare a un'assistente sociale ogni 5.000 abitanti servono ancora 1.126 assunzioni (Ufficio parlamentare di bilancio 2025). Le regole sull'automazione ci sono (09-C7), manca chi fa il lavoro dentro gli enti."
    come: "Il programma intermedio sceglie la versione pilota: una squadra di 25 persone, 15 da organici esistenti e 10 esperte ed esperti a termine per 36 mesi, svolge 8-10 missioni nelle tre amministrazioni del pilota di 09-C7. Insieme a chi lavora trova dove l'intelligenza artificiale libera tempo, costruisce o riusa gli strumenti e misura le ore; un catalogo in 2 Regioni offre a chi lo desidera lavori di valore sociale, e un registro pubblico rende conto di tutto. Nessun licenziamento: i posti non necessari si riducono solo con i pensionamenti, dopo la certificazione. Si paga solo con fondi europei di coesione nel 2027-29."
    cosa: "Obiettivi della misura, fissati per la versione piena: ore liberate e certificate da 0 ad almeno 1,5 milioni l'anno nel 2029; almeno 700 persone passate volontariamente ad attività del catalogo nel 2029; posti non sostituiti mai oltre il 30% delle ore liberate; zero licenziamenti o trasferimenti senza consenso. Il pilota misura questi dati prima di estendere la squadra. Costo della versione pilota: 0,01 mld €/anno solo nel 2027-29, nessun costo a regime."
    chi: "Decidono il Ministro per la pubblica amministrazione e la Funzione pubblica, con il Dipartimento per la trasformazione digitale, tramite un decreto del Presidente del Consiglio; ARAN e sindacati sono consultati prima di ogni missione. Ne beneficiano le persone che ricevono servizi sociali, controlli e sanità, e chi lavora, che lascia compiti ripetitivi per lavori di cui la comunità ha bisogno. Paga il bilancio europeo della coesione; gli enti di origine continuano a pagare il personale in comando."
    oceano_blu:
      eliminare: "niente"
      ridurre: "Il lavoro ripetitivo negli uffici delle tre amministrazioni del pilota."
      aumentare: "Le persone nei servizi alle persone, con passaggi volontari verso lavori di valore sociale."
      creare: "Una squadra pubblica per la produttività con l'intelligenza artificiale, un registro pubblico delle efficienze e un catalogo dei lavori di valore sociale."
  09-C10:
    perche: "Al 31 agosto 2026 l'Italia aveva pagato solo il 14,78% dei 73,83 mld dei fondi strutturali europei 2021-2027 (Ragioneria generale dello Stato 2026), e per la Commissione europea è tra i quattro Stati più indietro. Le spese sono ammissibili solo fino al 2029 o al 2030: ogni mese perso nell'istruttoria dei bandi rischia di far perdere fondi. Oggi i funzionari controllano le domande campo per campo."
    come: "Il programma intermedio sceglie la versione pilota: 10 bandi in 3 Regioni, confrontando tempi ed errori con bandi simili istruiti a mano. Chi fa domanda può usare un kit facoltativo che compila gli allegati una volta sola; il funzionario ha uno strumento che fa i controlli ripetitivi e segna in rosso ciò che non è conforme e in arancione ciò che va verificato, citando l'articolo del bando. Decide sempre la persona: sui criteri discrezionali lo strumento non propone punteggi e, se un dato è incerto, non indovina. Si paga in modo temporaneo con l'assistenza tecnica dei fondi europei 2021-2027."
    cosa: "Obiettivi: giorni tra la scadenza del bando e la graduatoria -30% nel 2029 e -50% nel 2031 rispetto a bandi analoghi; segnalazioni dello strumento confermate dai funzionari pubblicate per ogni bando. Si passa alla versione essenziale solo se i tempi di istruttoria scendono di almeno un terzo senza più ricorsi o errori. Costo della versione pilota: 0,01 mld €/anno, temporaneo."
    chi: "Decidono le Regioni con un accordo, insieme al Dipartimento per la trasformazione digitale, al Dipartimento per le politiche di coesione e all'Agenzia per l'Italia digitale per le linee guida; una Regione può partire anche senza legge nazionale. Ne beneficiano cittadini, imprese e Comuni che chiedono contributi, e i funzionari, che passano dal controllo campo per campo alla gestione delle eccezioni. Paga l'assistenza tecnica europea; possono perdere commesse le società di assistenza tecnica esterna, e la valutazione va affidata a soggetti diversi da chi ha costruito lo strumento, per un conflitto di interesse dichiarato."
    oceano_blu:
      eliminare: "La ricompilazione degli stessi dati in più allegati: si inseriscono una volta sola."
      ridurre: "I tempi tra scadenza del bando e graduatoria e i controlli manuali campo per campo."
      aumentare: "La tracciabilità dell'istruttoria: segnalazioni e scostamenti restano nel fascicolo e si pubblicano."
      creare: "Strumenti pubblici e aperti per istruire i bandi, riusabili da Regioni, Comuni e ministeri."
