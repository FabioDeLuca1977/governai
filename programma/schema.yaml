# GovernAI - Schema visuale del programma (scenario intermedio)
# Quattro domande per ogni missione: perché, come, cosa misuriamo, chi ne beneficia.
# Fonti: programma/selezione_intermedio.md e .csv, programma/schede/*.md,
# apprendimento/obiettivi.yaml, dati/serie/. I costi li genera il sito dai dati.
# "da stimare" = il numero non c'è nei file del repo.
versione: '2026-11-09'
scenario: intermedio
programma:
  perche: "Un Paese dove chi nasce, studia, lavora e invecchia trova servizi che funzionano, e dove le scelte di oggi non pesano sui conti delle generazioni future."
  come: "Ogni misura pagata senza deficit: tagli di spesa nei ministeri, meno sussidi dannosi e agevolazioni inefficaci, accise su tabacco e alcol. Le misure incerte partono come sperimentazioni."
  cosa: "Con indicatori pubblici, aggiornati ogni anno, con base e obiettivo a 5 anni: nidi, abbandono scolastico, persone laureate, ricerca, produttività, cure, acqua, giustizia."
  chi: "Famiglie con bambine e bambini piccoli, studentesse e studenti delle scuole più fragili, giovani, imprese che innovano, chi vive in territori a rischio, chi paga le tasse e chi usa giustizia e servizi pubblici."
  indicatori_chiave: [02-C2-b, 05-C1-a, 05-C4-a, 01-P13-a, 01-P4-c, 06-C1-a, 03-P3-a, 07-C1-a]
missioni:
  - id: M1
    titolo: "Crescere e imparare, a ogni età"
    icona: school
    perche: "Ogni bambina e ogni bambino deve poter partire alla pari, ovunque nasca. Nido, scuola e studio dopo il diploma sono la base di una vita libera e di un Paese che cresce."
    valori: [APC, EQU, FUT]
    come: "Più posti al nido dove mancano e congedo più lungo per i papà. Squadre contro l'abbandono e più fondi alle scuole fragili. Borse di studio garantite e ITS (scuole tecniche superiori) triplicati."
    sostenibilita: "Si paga con il riordino di bonus e agevolazioni e con tagli di spesa nei ministeri, senza tagli al personale della scuola; fondi europei per le sperimentazioni. Nido in versione ridotta; biblioteche, cultura e psicologi a scuola solo sperimentali."
    proposte: [02-C2, 02-C6, 05-C1, 05-C2, 05-C4, 05-C5, 05-C6, 05-C7, 05-C8, 05-C9, 06-C9]
    indicatori: [02-C2-b, 05-C1-a, 05-C4-a, 02-C2-c]
    chi:
      - gruppo: "Famiglie con figlie e figli sotto i 3 anni"
        quanti: "circa 1,1 milioni di bambine e bambini"
        fonte: "Nati 2023-2025 (379.890 + 369.944 + 355.435), Eurostat, dati/serie/02_demografia_nati_decessi_pop.csv"
        cosa_cambia: "Circa 60-70 mila posti nido in più dove mancano, gratis fino a un ISEE (indicatore della situazione economica equivalente) di 25.000 €; congedo papà di 2 mesi."
        proposte: [02-C2]
      - gruppo: "Alunne e alunni delle scuole più fragili"
        quanti: "circa 0,7 milioni tra alunne e alunni (10% di scuole più svantaggiate), fino a 1,4 milioni nelle 1.500 scuole con squadre"
        fonte: "Scheda 05-C7, variante ESSENZIALE; scheda 06-C9 (quintile fragile, stima GovernAI)"
        cosa_cambia: "Tutor, educatori e mediatori contro l'abbandono, 250 € in più per ogni alunna o alunno, scuole aperte il pomeriggio e d'estate."
        proposte: [05-C1, 05-C7, 05-C5]
      - gruppo: "Giovani che studiano dopo il diploma"
        quanti: "circa 33.400 persone iscritte agli ITS oggi, verso circa 100.000; persone idonee alla borsa da stimare"
        fonte: "Scheda 05-C4 e obiettivo 05-C4-b (iscrizioni ITS al 1/2/2026)"
        cosa_cambia: "Borsa di studio garantita a tutte le persone idonee, ITS triplicati, nuove residenze universitarie a canone legato all'ISEE."
        proposte: [05-C4]
      - gruppo: "Persone adulte senza diploma e giovani oltre i 25 anni che non studiano né lavorano"
        quanti: "da stimare"
        fonte: "da stimare (la scheda 05-C2 riporta solo quote: 35% degli adulti con competenze di lettura minime, OCSE PIAAC 2023)"
        cosa_cambia: "Dote di 900 € per corsi certificati e scuole serali per adulti (CPIA) su lettura, calcolo e uso dell'AI."
        proposte: [05-C2]
      - gruppo: "Studentesse, studenti e famiglie nelle Regioni della sperimentazione su cultura e benessere"
        quanti: "da stimare (3-4 Regioni)"
        fonte: "da stimare; varianti PILOTA in programma/selezione_intermedio.csv"
        cosa_cambia: "Solo sperimentazione: biblioteche di comunità, zaino culturale, psicologi a scuola. Si estende se la valutazione è positiva."
        proposte: [05-C8, 05-C9, 06-C9]

  - id: M2
    titolo: "Cura e protezione quando serve"
    icona: heart-pulse
    perche: "Nessuna persona deve rinunciare a curarsi o restare sola quando è fragile: chi ha una malattia, le persone anziane non autosufficienti, le persone con disabilità, chi vive in strada."
    valori: [BEN, EQU, RIS]
    come: "Case della Comunità che funzionano, squadre infermieristiche di quartiere per l'assistenza a casa, meno burocrazia negli uffici sanitari, regole per accorciare le attese, Housing First (prima una casa, poi il resto) e sperimentazioni su povertà e non autosufficienza."
    sostenibilita: "Resta la missione più debole e lo diciamo. Le Case della Comunità e le squadre di quartiere entrano senza tasse in più oltre quelle già previste, con un gradino in meno su alcune misure di scuola e innovazione e con il ricambio selettivo degli amministrativi della sanità. Il nuovo personale infermieristico e la salute mentale restano fuori; povertà e non autosufficienza solo sperimentali."
    proposte: [02-C4, 02-C5, 02-C7, 06-C1, 06-C2, 06-C3, 06-C4, 06-C5, 06-C6, 06-C8, 06-C10]
    indicatori: [06-C1-a, 06-C6-a, 02-C5-a, 02-C7-b]
    chi:
      - gruppo: "Persone che aspettano visite ed esami"
        quanti: "il 2,5% delle persone dai 16 anni in su ha rinunciato a cure nel 2025; numero assoluto da stimare"
        fonte: "Eurostat EU-SILC hlth_silc_08, scheda 06-C1, dati/serie/06_bisogni_non_soddisfatti.csv"
        cosa_cambia: "Agenda unica delle prenotazioni anche con il privato accreditato, richiamo attivo; nessun rimborso automatico in questo scenario."
        proposte: [06-C1, 06-C6]
      - gruppo: "Persone senza dimora"
        quanti: "96.197 persone iscritte in anagrafe; 6.000 in Housing First nelle 14 città metropolitane"
        fonte: "ISTAT, censimento al 31/12/2021; scheda 02-C7, variante PIENA"
        cosa_cambia: "Una casa con contratto proprio e un'équipe stabile che accompagna, anche dopo la fine dei fondi del PNRR (Piano nazionale di ripresa e resilienza)."
        proposte: [02-C7]
      - gruppo: "Persone con disabilità grave"
        quanti: "circa 2,9 milioni di persone con limitazioni gravi"
        fonte: "ISTAT 2023, scheda 02-C5"
        cosa_cambia: "Collocamento mirato con banca dati dei posti scoperti e sanzioni automatiche; il progetto di vita pieno è rinviato."
        proposte: [02-C5]
      - gruppo: "Persone anziane non autosufficienti e chi le assiste"
        quanti: "da stimare (circa 243.000 persone in lista d'attesa per una RSA, residenza sanitaria assistenziale, dato da verificare)"
        fonte: "Scheda 06-C4 (Quotidiano Sanità 2026, da verificare)"
        cosa_cambia: "500 squadre infermieristiche di quartiere per l'assistenza a casa nelle Regioni con meno ore per assistito; budget di cura solo in sperimentazione in 20 ambiti."
        proposte: [06-C4, 06-C8]
      - gruppo: "Famiglie in povertà assoluta"
        quanti: "2,1 milioni di famiglie, 5,4 milioni di persone"
        fonte: "ISTAT, La povertà in Italia 2025 (scheda 02-C4)"
        cosa_cambia: "Solo una sperimentazione in 12 ambiti del reddito di inclusione universale; per ora nessun cambiamento generale."
        proposte: [02-C4]

  - id: M3
    titolo: "Lavoro, ricerca e imprese che crescono"
    icona: lightbulb
    perche: "Produttività e salari sono fermi da anni. Più ricerca e innovazione nelle imprese, soprattutto piccole, servono a creare lavoro migliore e pagato meglio."
    valori: [INN, FUT, APC]
    come: "Un solo credito d'imposta per la ricerca, stabile e più forte per le piccole imprese; la pubblica amministrazione (PA) compra innovazione; un fondo per le imprese tecnologiche; centri di ricerca al servizio delle imprese."
    sostenibilita: "Inserite per scelta politica: il panel le mette in coda. Si pagano chiudendo il patent box (sconto sui brevetti) e tagliando incentivi inefficaci. Salario minimo: solo regole. La misura sui gradini dimensionali delle imprese (01-P4) resta fuori."
    proposte: [01-P4, 01-P5, 01-P6, 01-P13, 01-P14, 01-P15, 02-C1, 05-C3, 05-C10, 08-P6]
    indicatori: [01-P13-a, 01-P4-c, 01-P15-a, 02-C1-b]
    chi:
      - gruppo: "Imprese che fanno ricerca, soprattutto quelle sotto i 50 addetti"
        quanti: "da stimare"
        fonte: "da stimare (obiettivo 01-P13-c senza base nel repo)"
        cosa_cambia: "Credito unico stabile per 5 anni: 10%, 13% sotto i 50 addetti; progetto certificato prima di spendere."
        proposte: [01-P13, 01-P4]
      - gruppo: "Ricercatrici e ricercatori, università e nuove imprese nate dalla ricerca"
        quanti: "86 spin-off nel 2023; 750 dottorati industriali l'anno previsti"
        fonte: "Netval, 20° Rapporto 2025 (scheda 01-P15); scheda 05-C10, variante ESSENZIALE"
        cosa_cambia: "Fondo di fondi da 750 milioni con capitale privato, 130 prove di fattibilità l'anno, 8 centri di ricerca applicata."
        proposte: [01-P15, 05-C10, 05-C3]
      - gruppo: "Piccole imprese e startup che vendono innovazione alla PA"
        quanti: "circa 200 contratti di prima fase e 40 di seconda fase l'anno"
        fonte: "programma/selezione_intermedio.csv, 01-P14 variante ESSENZIALE"
        cosa_cambia: "Gare in tre fasi su salute, territorio ed energia: la PA paga prototipi e poi li compra."
        proposte: [01-P14]
      - gruppo: "Imprese che consumano molta energia"
        quanti: "da stimare"
        fonte: "da stimare"
        cosa_cambia: "Garanzia pubblica per contratti lunghi di energia rinnovabile a prezzo stabile, per consorzi e distretti."
        proposte: [01-P5]
      - gruppo: "Chi lavora con salari bassi"
        quanti: "il 10,2% delle persone occupate è a rischio di povertà; numero assoluto da stimare"
        fonte: "Eurostat EU-SILC ilc_iw01, 2025 (scheda 02-C1)"
        cosa_cambia: "Il salario del contratto più rappresentativo diventa il riferimento per tutto il settore; nessuna soglia di legge né nuovo personale ispettivo."
        proposte: [02-C1]

  - id: M4
    titolo: "Territori sicuri e transizione verde"
    icona: leaf
    perche: "Frane, alluvioni, acqua sprecata e paesi che si svuotano costano vite e denaro. Prevenire costa meno che riparare, e la transizione verde deve essere giusta."
    valori: [FUT, SIC, BPA]
    come: "Fondo stabile contro frane e alluvioni, assicurazione della casa con adesione automatica, reti idriche, servizi nelle aree interne, più merci sul treno, camion e consegne urbane a emissioni zero."
    sostenibilita: "Si paga soprattutto con l'uscita graduale dai sussidi al gasolio entro il 2035 e con fondi europei. Treni per pendolari, casa a canone giusto e agricoltura per il clima restano fuori."
    proposte: [03-P1, 03-P2, 03-P3, 03-P4, 03-P5, 04-P1, 04-P2, 04-P3, 04-P5, 04-P6, 04-P7, 04-P8, 04-P9]
    indicatori: [03-P3-a, 03-P4-a, 04-P7-a, 03-P1-b]
    chi:
      - gruppo: "Chi vive nelle zone a rischio frana"
        quanti: "1,28 milioni di persone in aree a pericolosità elevata e molto elevata"
        fonte: "ISPRA, Rapporto dissesto ed. 2024 (scheda 03-P4)"
        cosa_cambia: "Fondo di prevenzione sui Comuni più a rischio e polizza casa con adesione automatica e uscita libera."
        proposte: [03-P4]
      - gruppo: "Residenti delle regioni che perdono più acqua"
        quanti: "da stimare (5 regioni con perdite oltre il 50%)"
        fonte: "da stimare; ISTAT, Censimento acque 2022 per le regioni (scheda 03-P3)"
        cosa_cambia: "Obiettivi vincolanti sulle perdite, gestori più grandi e fondi europei per rifare le reti."
        proposte: [03-P3]
      - gruppo: "Abitanti delle aree interne"
        quanti: "13,3 milioni di persone (intervento in 72 aree progetto)"
        fonte: "ISTAT, previsioni base 1/1/2025, dati/serie/04_istat_previsioni_aree_interne; scheda 04-P6"
        cosa_cambia: "500 presidi con più servizi, trasporto a chiamata, indennità per circa 35.000 persone tra personale medico, infermieristico e docente."
        proposte: [04-P6]
      - gruppo: "Imprese di autotrasporto e logistica"
        quanti: "da stimare"
        fonte: "da stimare"
        cosa_cambia: "Aste per circa 1.000 camion a zero emissioni l'anno e più ferrovia, in cambio dell'uscita dal rimborso sul gasolio."
        proposte: [04-P7, 04-P8]
      - gruppo: "Residenti e negozi delle 14 città metropolitane"
        quanti: "da stimare"
        fonte: "da stimare"
        cosa_cambia: "Consegne a emissioni zero dal 2030, con 4 anni di preavviso e regole uguali in tutta Italia."
        proposte: [04-P9]

  - id: M5
    titolo: "Fisco semplice e conti onesti"
    icona: receipt
    perche: "Pagare le tasse deve essere semplice e giusto. Ogni scelta pubblica deve dire chi paga e quando, senza scaricare debiti sulle generazioni future."
    valori: [FID, FUT, EQU]
    come: "Dichiarazione già pronta che vale se non la contesti, controlli IVA in tempo reale, nessun condono, agevolazioni fiscali a scadenza, valutazione a 30 anni delle leggi e delle grandi opere."
    sostenibilita: "Costa poco ed è pagata spostando spesa esistente. L'evasione recuperata non paga nuova spesa: riduce il deficit. Detrazioni e scontrini: solo riordino a costo zero. I controlli mirati restano fuori."
    proposte: [01-P1, 01-P2, 01-P3, 01-P7, 01-P8, 01-P9, 01-P10, 01-P11, 01-P12, 02-C3, 04-P4]
    indicatori: [01-P3-a, 01-P2-a, 01-P1-a, 04-P4-a]
    chi:
      - gruppo: "Chi usa il 730 e chi ha una pensione con la sola Certificazione Unica"
        quanti: "circa 25,2 milioni di contribuenti con il 730, più chi ha una pensione e la sola CU"
        fonte: "MEF-DF, Sintesi dati dichiarazioni 2024 (scheda 01-P7)"
        cosa_cambia: "La dichiarazione arriva già fatta e vale se non la si contesta; rimborsi automatici."
        proposte: [01-P7, 01-P8, 01-P9]
      - gruppo: "Piccole partite IVA (regime forfetario e semplificato)"
        quanti: "da stimare"
        fonte: "da stimare"
        cosa_cambia: "IVA e redditi precompilati dalle fatture, rateazione automatica online, sanzioni proporzionate e nessun condono."
        proposte: [01-P12]
      - gruppo: "Contribuenti e imprese in regola"
        quanti: "42,8 milioni di contribuenti IRPEF"
        fonte: "MEF-DF, Sintesi dati dichiarazioni 2024 (scheda 01-P7)"
        cosa_cambia: "Meno frodi IVA, rimborsi più rapidi per chi è affidabile, agevolazioni che restano solo se funzionano."
        proposte: [01-P3, 01-P2, 01-P11]
      - gruppo: "Giovani e generazioni future"
        quanti: "da stimare"
        fonte: "da stimare"
        cosa_cambia: "Ogni legge importante dichiara chi paga e quando; grandi opere con analisi pubblica; costo delle pensioni per generazione."
        proposte: [01-P1, 02-C3, 04-P4]

  - id: M6
    titolo: "Uno Stato che funziona, istituzioni aperte"
    icona: landmark
    perche: "Uno Stato rapido, giusto e trasparente fa risparmiare tempo alle persone e alle imprese e rafforza la fiducia. L'AI aiuta, ma decidono le persone."
    valori: [FID, SIC, CIT]
    come: "Tribunali più veloci, pene alternative per i reati minori, personale tecnico per i piccoli Comuni, AI nella PA con supervisione umana, una squadra che toglie lavoro ripetitivo dagli uffici e sposta chi lo desidera verso servizi alle persone, appalti e dati aperti, leggi valutate prima del voto."
    sostenibilita: "Costi bassi, pagati con tagli di spesa e di personale amministrativo nei ministeri. Difesa al 3,5% del PIL e scudo cyber per i Comuni restano fuori; diverse misure sulla PA sono ridotte."
    proposte: [07-C1, 07-C2, 07-C3, 07-C4, 07-C5, 07-C6, 08-P1, 08-P2, 08-P3, 08-P4, 08-P5, 08-P7, 09-C1, 09-C2, 09-C3, 09-C4, 09-C5, 09-C6, 09-C7, 09-C8, 09-C9]
    indicatori: [07-C1-a, 07-C2-a, 09-C2-a, 09-C5-a, 09-C9-a]
    chi:
      - gruppo: "Persone e imprese con una causa civile"
        quanti: "da stimare"
        fonte: "da stimare"
        cosa_cambia: "4.500 addetti stabili nei tribunali più lenti: obiettivo da 1.789 a 1.400 giorni per una causa civile."
        proposte: [07-C1]
      - gruppo: "Persone detenute e chi lavora nelle carceri"
        quanti: "66.063 persone detenute per 51.295 posti"
        fonte: "DAP al 30/9/2026, dati/serie/07_detenuti_dap.csv (scheda 07-C2)"
        cosa_cambia: "Pene alternative per chi ha meno di 2 anni da scontare, 1.000 funzionarie e funzionari in più, braccialetti elettronici."
        proposte: [07-C2]
      - gruppo: "Piccoli Comuni"
        quanti: "5.522 Comuni sotto i 5.000 abitanti (aiuto mirato a Mezzogiorno e aree interne)"
        fonte: "ISTAT 1/1/2026, dati/serie/09_comuni_classi_ampiezza (scheda 09-C3)"
        cosa_cambia: "3.000 tra tecniche e tecnici condivisi per gare, progetti e informatica, e affiancamento di chi va in pensione."
        proposte: [09-C3, 09-C8]
      - gruppo: "Personale pubblico"
        quanti: "oltre 3,7 milioni di persone"
        fonte: "INPS, Osservatorio sui lavoratori pubblici, 11/11/2025 (scheda 09-C8)"
        cosa_cambia: "Valutazione vera, formazione su AI e dati, una squadra che aiuta gli uffici a togliere il lavoro ripetitivo; chi lo desidera passa, con formazione pagata e nello stesso comune, a lavori utili alla comunità. Nessun licenziamento per l'automazione."
        proposte: [09-C6, 09-C7, 09-C5, 09-C9]
      - gruppo: "Persone che usano servizi sociali, CUP e sportelli pubblici nei territori con carenze di personale"
        quanti: "da stimare (mancano ancora 1.126 assistenti sociali per il livello essenziale di 1 ogni 5.000 abitanti)"
        fonte: "UPB, Flash 1/2025 (assistenti sociali); scheda 09-C9"
        cosa_cambia: "Persone spostate su base volontaria da compiti ripetitivi a servizi sociali, sanità amministrativa, controlli e uffici giudiziari, con ore liberate misurate e pubblicate ente per ente."
        proposte: [09-C9]
      - gruppo: "Comunità e associazioni che ricevono beni confiscati"
        quanti: "19.414 immobili confiscati ancora in gestione dello Stato"
        fonte: "ANBSC al 31/12/2025, dati/serie/07_anbsc_beni_confiscati.csv (scheda 07-C4)"
        cosa_cambia: "Più beni restituiti all'uso sociale, con prestiti per ristrutturarli e dati aperti."
        proposte: [07-C4]
# Nomi in linguaggio semplice per la pagina; base e obiettivi restano quelli di apprendimento/obiettivi.yaml.
# obiettivo_5a qui solo quando dipende dalla versione scelta nello scenario.
indicatori_semplici:
  01-P1-a: {nome: "Leggi importanti con il conto per le generazioni future", unita: "%"}
  01-P13-a: {nome: "Spesa delle imprese in ricerca e sviluppo"}
  01-P15-a: {nome: "Capitale di rischio investito nelle nuove imprese"}
  01-P2-a: {nome: "Agevolazioni fiscali in vigore", unita: ""}
  01-P3-a: {nome: "IVA evasa ogni anno"}
  01-P4-c: {nome: "Produttività: PIL per ora lavorata", unita: "(2015 = 100)"}
  02-C1-b: {nome: "Potere d'acquisto dei salari rispetto a gennaio 2021", unita: "%"}
  02-C2-b: {nome: "Posti al nido ogni 100 bambine e bambini sotto i 3 anni", unita: ""}
  02-C2-c: {nome: "Donne tra 20 e 64 anni che lavorano"}
  02-C5-a: {nome: "Divario di occupazione tra persone con disabilità grave e le altre", unita: "punti"}
  02-C7-b: {nome: "Persone senza dimora ancora in casa dopo 12 mesi", unita: "%"}
  03-P1-b: {nome: "Emissioni di gas serra dei trasporti"}
  03-P3-a: {nome: "Acqua persa dalle reti idriche"}
  03-P4-a: {nome: "Imprese assicurate contro le catastrofi naturali", unita: "%"}
  04-P4-a: {nome: "Grandi opere con valutazione indipendente pubblica", unita: "%"}
  04-P7-a: {nome: "Merci trasportate in treno", obiettivo_5a: 13.0}
  05-C1-a: {nome: "Giovani che lasciano presto la scuola, nelle Isole"}
  05-C4-a: {nome: "Persone tra 25 e 34 anni con laurea o diploma ITS"}
  06-C1-a: {nome: "Persone che rinunciano a cure necessarie per costo, distanza o attesa"}
  06-C6-a: {nome: "Quota della spesa sanitaria per la prevenzione", unita: "%"}
  07-C1-a: {nome: "Durata di una causa civile nei tre gradi"}
  07-C2-a: {nome: "Affollamento delle carceri"}
  09-C2-a: {nome: "Persone che usano i servizi pubblici online"}
  09-C5-a: {nome: "Persone con competenze digitali almeno di base"}
  09-C9-a: {nome: "Ore di lavoro liberate dall'AI e certificate", unita: "milioni di ore l'anno", obiettivo_5a: 2.5}
