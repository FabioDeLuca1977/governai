# Testi della pagina "Governi a confronto" (19/11/2026). Numeri da storia/governi_confronto.csv e .md
# (script storia/script/governi.py). I governi sono indicati per date, senza nomi di persone o di partiti.
in_breve: "Ogni governo dal 1979 con almeno un anno di mandato, confrontato sugli stessi indicatori. La misura principale è quanto l'Italia ha fatto meglio o peggio di Francia, Germania e Spagna negli stessi anni: così gli shock che colpiscono tutti non vengono attribuiti al governo di turno. Nessun voto con pesi scelti da noi: una posizione per ambito e un punteggio calcolato da migliaia di punti di vista."
perche: "Un dato da solo non dice se un governo ha fatto bene: un deficit al 3% può essere un successo dopo una crisi o un passo indietro dopo anni di avanzi. Per giudicare serve un confronto con gli altri governi e con i Paesi vicini, sapendo da dove ciascuno è partito."
come: "Ogni anno solare va al governo in carica per la maggior parte dell'anno; i governi sotto i 12 mesi sono uniti al periodo vicino o esclusi, dichiarandolo. Per 18 indicatori calcoliamo il valore italiano, quello medio di Francia, Germania e Spagna e la differenza; poi il posto di ogni governo. C'è anche una versione con gli anni spostati di uno, perché le misure agiscono in ritardo. Per il governo in carica contano solo gli anni 2023-2025: il 2026 è ancora una previsione."
cosa: "Il governo 2022-oggi, rispetto ai vicini, è nel primo terzo per lavoro (5° su 24 per occupazione, occupazione femminile e disoccupazione giovanile) e per prezzi e mercati (inflazione 2° su 24, spread 8°); nel terzo centrale per i conti (debito 12°, saldo primario 12°, deficit 9° su 24); per la crescita è 8° sul PIL per abitante ma 20° su 24 per produttività, e primo per investimenti pubblici grazie al PNRR, deciso prima. Sulla qualità del lavoro è nel primo terzo: la quota di dipendenti a tempo determinato scende di 3,3 punti (vicini 2,7) e il part-time involontario di 6,9 punti (vicini 3,7), ma il salario reale cresce dello 0,3% all'anno contro lo 0,8% dei vicini (15° su 24) e le ore per occupato salgono di 24 mentre nei vicini scendono di 11. La pressione fiscale sale di 1,8 punti più dei vicini: è il secondo aumento più alto dal 1979 (non è di per sé un risultato migliore o peggiore). L'emigrazione di italiani è la più alta tra gli 11 governi per cui c'è il dato."
chi: "Il governo in carica ha ereditato il secondo debito più alto (138,4% del PIL), un deficit dell'8,1% gonfiato dai crediti edilizi decisi prima, uno spread a 202 punti e un'inflazione all'8,2%. Plausibilmente legati alle sue scelte: il rientro del deficit, aiutato dallo stop alla cessione dei crediti, l'aumento della pressione fiscale e in parte la discesa dello spread. Non (o non solo) suoi: l'inflazione (energia e BCE), l'occupazione (in salita dal 2021, anche per il calo demografico), gli investimenti (PNRR), la produttività (ferma dal 2001)."
limiti:
  - "Il mandato è in corso: tre anni di dati, con il 2025 ancora provvisorio."
  - "Molti governi hanno solo uno o due anni: i loro posti sono instabili."
  - "Il confronto con i vicini toglie gli shock comuni, non quelli che colpiscono l'Italia più degli altri. Nessun numero qui dimostra una causa."
  - "Prima del 1991 la Germania è la sola Germania Ovest; la Spagna non ha deficit e saldo primario prima del 1995; gli investimenti pubblici partono dal 1995; la povertà assoluta dal 2005, con un cambio di metodo nel 2014."
  - "Le decisioni del catalogo per governo sono contate solo come informazione: la selezione è nostra e non è un voto."
  - "La qualità del lavoro si misura con contratti a termine e part-time involontario, dal 1983 per l'Italia e dal 1987 per tutti e quattro i Paesi: i governi precedenti non hanno questo confronto. Il salario reale (redditi da lavoro dipendente per dipendente, al netto dei prezzi al consumo) e le ore per occupato ci sono per tutti i governi: per quelli prima del 1987 la qualità del lavoro si basa sul solo salario. Le ore non hanno un verso: meno ore può voler dire più tempo libero o meno lavoro di quanto si vorrebbe. Nel 2021 l'indagine europea sulle forze di lavoro ha cambiato regole: piccola rottura di serie."
oceano_blu:
  eliminare: "Il giudizio per slogan: nessun voto con pesi decisi da noi e nessun nome, solo indicatori uguali per tutti."
  ridurre: "L'effetto degli shock esterni sul giudizio, confrontando sempre con i Paesi vicini."
  aumentare: "La memoria: 24 governi dal 1979 sugli stessi numeri, con il punto di partenza di ciascuno."
  creare: "Un confronto che chiunque può rifare: dati, script e metodo sono pubblici."
# "Che cosa emerge" (20/11/2026): sintesi della tabella per ambito, versione con gli anni del mandato.
emerge:
  - titolo: "Il governo migliore in tutto non esiste"
    testo: "Nessuno dei 24 governi è nel primo terzo in tutti gli ambiti: ognuno è forte su qualcosa e debole su altro. Chi dice che un governo è stato il migliore sta scegliendo quali ambiti contano di più."
  - titolo: "Conta più l'epoca del governo"
    testo: "I governi degli anni '80 sono tutti deboli sui conti, tra 0 e 30, e sui prezzi: è lì che si è formata gran parte del debito. Dal 1995 al 2013 sette governi su nove sono tra 65 e 96 sui conti. Dal 2001 al 2019 la crescita è debole per tutti, tra 13 e 52; dal 2020 i valori salgono, anche per il rimbalzo dopo la pandemia e i fondi europei. Molto dipende da fattori che durano più di un governo."
  - titolo: "Conti e crescita spesso tirano in direzioni opposte"
    testo: "Chi ha risanato di più è spesso cresciuto meno: il governo 2011-2013 è primo sui conti (96) e quasi ultimo sulla crescita (13), quello 2008-2011 è a 91 e 21. Mettere in ordine i conti in piena crisi ha avuto un costo in crescita: è una scelta con un prezzo, non in sé un merito o una colpa."
  - titolo: "Molti posti valgono poco"
    testo: "Diversi governi hanno un solo anno di dati, per esempio quelli del 1990, 1991, 1993, 1995, 2000 e 2012: il loro posto può cambiare molto con un anno in più o in meno. La versione con gli anni spostati di uno lo mostra."
  - titolo: "Il governo in carica"
    testo: "Il governo 2022-oggi, rispetto ai vicini, va bene su lavoro e prezzi (83) e discreto sulla qualità del lavoro (74: meno contratti a termine, ma salari che crescono meno dei vicini), è a metà sui conti (52) e discreto sulla crescita (70), ma è 20° su 24 per produttività e ha l'emigrazione più alta tra gli 11 governi con il dato. Parte dei risultati viene da scelte precedenti, come il PNRR, o esterne, come la Banca centrale europea."
  - titolo: "Più occupati, ma con quali contratti?"
    testo: "Dal 1995 al 2018 la quota di dipendenti a tempo determinato in Italia è più che raddoppiata, dal 7,2% al 17,1%, mentre in Germania restava tra il 10% e il 15% e in Spagna scendeva. Dal 2018 al 2025 è scesa al 13,6%, sotto Francia e Spagna. Il part-time involontario resta il più alto dei quattro Paesi: il 51% di chi lavora a tempo parziale vorrebbe il tempo pieno. Quindi è vero che a lungo è cresciuto il lavoro precario; negli ultimi anni la crescita è stata soprattutto a tempo indeterminato."
  - titolo: "Salari fermi da 30 anni"
    testo: "Dal 1991 al 2025 il salario reale per dipendente in Italia è sceso dell'8,4%, mentre in Francia è salito del 30%, in Germania del 26% e in Spagna dell'11%. Nessun governo ha invertito la tendenza in modo duraturo. Chi lavora in Italia lavora anche più ore: 1.716 all'anno per occupato nel 2025, contro 1.498 in Francia, 1.332 in Germania e 1.633 in Spagna. È l'altra faccia della produttività bassa."
  - titolo: "Il filo rosso di 45 anni"
    testo: "L'Italia non ha un problema di singoli governi, ma due problemi che li attraversano tutti: un debito accumulato soprattutto negli anni '80 e una crescita più lenta dei vicini da circa 25 anni, legata alla produttività. Ogni governo si giudica meglio su quanto ha inciso su questi due problemi che sulla classifica."
# Punteggio da più punti di vista (21/11/2026): numeri da storia/punti_di_vista.md (script storia/script/punti_di_vista.py).
punti_di_vista:
  in_breve: "Un punteggio unico dipende da quanto pesa ogni ambito, e il peso è una scelta politica. Per questo non lo scegliamo noi: proviamo 4.000 combinazioni di pesi, con gli anni del mandato e con quelli spostati di uno, e mostriamo dove si colloca ognuno nella maggior parte dei casi e quanto cambia."
  perche: "Chi vuole difendere o attaccare un governo sceglie, spesso senza dirlo, gli ambiti che gli danno ragione. Un punteggio più equo è quello che resta valido anche cambiando punto di vista: se un governo è in alto con quasi tutti i pesi, il giudizio è solido; se sale o scende a seconda dei pesi, dipende da che cosa si considera più importante."
  come: "Si parte dalla posizione 0-100 in ogni ambito, la stessa della tabella. Per ogni combinazione di pesi si fa la media pesata e si calcola il posto. Le combinazioni sono 14 dichiarate (pesi uguali e, una per volta, un ambito che conta il doppio) più 4.000 estratte a caso in modo uniforme tra tutte quelle possibili, con un seme fisso perché il calcolo sia ripetibile. Il punteggio equo è la posizione mediana su tutte; l'intervallo va dal 10° al 90° percentile. Un ambito senza dati resta fuori e gli altri pesano di più."
  cosa: "Il governo 2001-2005 è primo nel 97% dei punti di vista e il governo 2022-oggi secondo, nel primo terzo nel 94%; in fondo i governi del 1989-1991 e del 1991-1992, nell'ultimo terzo in 8 casi su 10 o più. Per la maggior parte dei governi però il posto cambia molto con i pesi: il governo 2019-2021 va da 17 a 96 a seconda che si dia più peso alla società o alla crescita. I governi con un solo anno di dati, come quello del 2000, hanno posizioni meno affidabili."
  cosa_legislature: "La XIV (2001-2006) e la XIX (2022-oggi) sono in testa con quasi tutti i pesi, nel primo terzo nell'85% e nel 93% dei punti di vista; la X (1987-1992) è nell'ultimo terzo nell'89% dei casi e mai sopra il 9° posto nei punti di vista dichiarati. Le altre si spostano molto: la VIII va da 9 a 91 a seconda del peso dato al lavoro o ai prezzi."
  chi: "Lo script non sceglie i pesi: li prova tutti. Nella sezione qui sotto puoi fissare i tuoi e vedere subito come cambia l'ordine. Il calcolo è pubblico e si può rifare con storia/script/punti_di_vista.py."
  oceano_blu:
    eliminare: "Il peso nascosto: nessun ambito conta di più per scelta nostra."
    ridurre: "Il valore di un singolo numero: il punteggio arriva sempre con il suo intervallo."
    aumentare: "La solidità del giudizio: si vede in quanti punti di vista un governo resta in alto o in basso."
    creare: "Un punto di vista personale: ognuno può fissare i propri pesi e confrontarli con quelli degli altri."
  limiti:
    - "Il punteggio è costruito sui posti rispetto ai vicini, non su quanto bene o male sia andata in assoluto: ottimo vuol dire meglio degli altri governi nello stesso confronto."
    - "Gli ambiti hanno lo stesso numero di indicatori solo in parte: un ambito con pochi indicatori, come la società, può oscillare di più."
    - "Prima del 2001 manca l'ambito società e prima del 1987 la qualità del lavoro si basa sul solo salario: quei governi sono giudicati su meno informazioni."
    - "Le combinazioni casuali danno a ogni ambito, in media, lo stesso peso: chi pensa che un ambito conti sempre di più deve usare i propri pesi."
# Vista per legislatura (20/11/2026). Numeri da storia/legislature_confronto.csv e .md (script storia/script/legislature.py).
legislature:
  in_breve: "Le 12 legislature dal 1979, dalla VIII alla XIX, confrontate sugli stessi 18 indicatori e con lo stesso metodo dei governi: conta quanto l'Italia ha fatto meglio o peggio di Francia, Germania e Spagna negli stessi anni. Nessun voto con pesi scelti da noi: una posizione per ambito e un punteggio calcolato da migliaia di punti di vista."
  perche: "I governi cambiano spesso, a volte dopo pochi mesi; la legislatura dura di più e comprende il Parlamento che li sostiene. Guardare per legislatura riduce il peso dei governi brevi e mostra com'è andato il Paese in periodi più lunghi e confrontabili."
  come: "Ogni anno solare va alla legislatura con più giorni di governo in quell'anno. I governi rimasti in carica per gli affari correnti dopo le elezioni contano nella legislatura precedente. La VII legislatura, iniziata prima del 1979, resta fuori. Per la XIX contano gli anni 2023-2025. C'è anche la versione con gli anni spostati di uno."
  cosa: "Sui conti le migliori rispetto ai vicini sono la XVI (2008-2013) e la XIII (1996-2001), che ha ridotto il debito di 10,3 punti mentre i vicini lo aumentavano di 0,8; le peggiori la IX e la X (1983-1992), con il debito salito di 11,3 e 8,6 punti più dei vicini. Sulla crescita guidano XVIII, IX e XII, in fondo XV e XVI. Sul lavoro guidano VIII, XI e XIV, in fondo X e XVII. Sulla qualità del lavoro guidano VIII, X e XIX (per VIII e IX conta solo il salario), in fondo XVI e XVIII. Su prezzi e mercati guidano XV, XIX e XIV, ultima la VIII, con un'inflazione media del 17,5% contro il 10,4% dei vicini. Nessuna legislatura è nel primo terzo in tutti gli ambiti."
  chi: "Una legislatura è il Parlamento eletto più i governi che ha sostenuto, da uno a sei. È l'unità giusta per chiedersi com'è andato il Paese in quegli anni, non per giudicare un singolo governo: per questo c'è la vista per governo, con il punto di partenza di ciascuno. Molti risultati dipendono anche da Banca centrale europea, Unione europea e shock esterni."
  limiti:
    - "Una legislatura somma governi anche molto diversi tra loro: il dato descrive il periodo, non giudica un governo."
    - "La XIX legislatura è in corso: tre anni di dati, con il 2025 ancora provvisorio."
    - "Contratti a termine e part-time involontario hanno dati per tutti e quattro i Paesi solo dal 1987: per la VIII e la IX legislatura la qualità del lavoro si basa sul solo salario reale."
    - "Con 12 legislature i posti sono pochi: una differenza di un posto conta poco."
    - "Gli anni della XVIII comprendono la caduta e il rimbalzo della pandemia; quelli della XVI la crisi finanziaria e quella dei debiti sovrani."
    - "Il confronto con i vicini toglie gli shock comuni, non quelli che colpiscono l'Italia più degli altri. Nessun numero qui dimostra una causa."
    - "Per la società i dati partono dal 2002 per l'emigrazione e dal 2005 per la povertà assoluta, che cambia metodo nel 2014: il confronto vale dalla XIV legislatura in poi e su pochi casi."
# Pagina "Verifica un confronto" (20/11/2026): stessi dati di Governi a confronto, letti con cinque domande.
verifica:
  in_breve: "Hai sentito dire che un governo o una legislatura ha fatto meglio o peggio di un altro? Scegli chi e su quale indicatore: la pagina ti mostra lo stesso dato letto in cinque modi diversi e ti dice se le letture vanno nella stessa direzione o si contraddicono."
  perche: "Nei dibattiti sui governi quasi nessuno inventa i numeri: si scelgono, senza dirlo, il modo di leggerli. Numero assoluto o confronto con gli altri Paesi, quali anni contare, livello o variazione, quale indicatore citare. Con scelte diverse lo stesso dato vero sostiene conclusioni opposte, e chi ascolta non ha modo di capire chi ha ragione."
  come: "Per ogni governo dal 1979 e ogni legislatura dalla VIII, e per ciascuno dei 18 indicatori, la pagina mette fianco a fianco le letture possibili: il solo dato italiano e il confronto con la media di Francia, Germania e Spagna; gli anni del mandato e quelli spostati di uno; il livello raggiunto e la variazione; gli altri indicatori dello stesso periodo; la fonte ufficiale. Se le letture finiscono in terzi opposti della classifica, la pagina lo segnala."
  cosa: "Un controllo in tre passi: scegli chi confrontare e su che cosa, leggi le cinque risposte, copia la frase che dice il dato in modo completo. Un esempio: nella XVI legislatura (2008-2013) il debito è salito di 22,4 punti di PIL, ma nei Paesi vicini di 32,1. Detto in assoluto è uno dei risultati peggiori; detto rispetto ai vicini è il secondo migliore. Entrambe le frasi sono vere: la pagina le mostra insieme."
  chi: "È pensata per chi ascolta un dibattito, legge un articolo o vuole controllare un post prima di condividerlo. Non dà ragione a nessuno: gli stessi dati, le stesse regole e gli stessi limiti valgono per tutti i governi e tutte le legislature, indicati per date e senza nomi di persone o di partiti."
  oceano_blu:
    eliminare: "La disputa su chi ha i numeri giusti: i numeri sono gli stessi per tutti, cambia solo come si leggono."
    ridurre: "Il peso della lettura più comoda: nessun dato compare senza le letture alternative."
    aumentare: "La trasparenza delle scelte: anni, confronto e fonte sono sempre scritti accanto al numero."
    creare: "Una frase pronta da usare che dice il dato in modo completo, da copiare e condividere."
  limiti:
    - "Valgono gli stessi limiti del confronto tra governi: molti governi hanno solo uno o due anni di dati e il confronto con i vicini non toglie gli shock che colpiscono solo l'Italia."
    - "La pagina controlla i numeri, non le cause: dire che un risultato è merito o colpa di un governo richiede un'analisi in più."
    - "Gli indicatori sono 18: un'affermazione su un dato che qui non c'è non si può verificare con questa pagina."
